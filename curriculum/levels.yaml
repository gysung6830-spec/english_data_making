      - "현재완료 심화"
      - "조동사 총정리"
      - "to부정사 3용법 구분"
      - "동명사 관용표현"
      - "분사의 형용사 역할"
      - "수동태 시제 변화"
      - "관계대명사 주격·목적격"
      - "관계대명사 소유격 whose"
      - "관계부사 기초"
      - "비교 구문 심화"
      - "명사절 접속사"
      - "부사절 접속사"
      - "문장 연결과 대명사 지칭"
