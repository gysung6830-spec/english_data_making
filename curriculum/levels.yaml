      - "삽입·동격 처리"
      - "관계사 총정리"
      - "분사구문 총정리"
      - "가정법 총정리"
      - "특수구문(도치·강조·생략)"
      - "병렬 구조"
      - "대명사·대동사 지칭"
      - "연결어 추론"
      - "글의 주제·요지 찾기"
      - "빈칸 추론 입문"
