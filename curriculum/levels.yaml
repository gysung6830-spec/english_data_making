      - "분사구문 심화(시간·이유·조건)"
      - "관계대명사 계속적 용법"
      - "관계대명사 what"
      - "복합관계사"
      - "가정법 과거"
      - "가정법 과거완료"
      - "I wish / as if"
      - "도치 구문"
      - "강조 구문 It ~ that"
      - "비교 관용표현"
      - "부정 표현과 부분부정"
      - "동격과 삽입절"
      - "긴 문장 끊어읽기 훈련"
      - "내신 변형문항 대비 정리"

  - code: M3
    name: "중3 · 예비고"
    grades: "중3"
    vocab_target: 3200
    sentence_words: [16, 24]
    passage_words: [170, 240]
