# ============================================================
#  레벨 체계 — 교습소 커리큘럼의 뼈대
#  이 파일 하나가 "무슨 자료를 얼마나 만들어야 하는가"의 기준이 된다.
#    - grammar_sequence : 그 레벨에서 16주 동안 다루는 문법 순서(= 주차별 진도)
#    - material_target  : 그 레벨을 굴리려면 라이브러리에 있어야 할 지문 수
#    - source_mix       : 그 레벨 지문을 어디서 가져올지(비중 %)
#  숫자/문구만 고치면 진도표·자료 목표치가 전부 따라 바뀝니다.
# ============================================================

# 한 학기 = 16주 (주 2회 기준 32차시)
term_weeks: 16

levels:
  - code: E1
    name: "초등 기초"
    grades: "초3~초4"
    vocab_target: 800          # 이 레벨을 마칠 때 누적 목표 어휘 수
    sentence_words: [6, 12]    # 지문 문장당 적정 단어 수
    passage_words: [60, 110]   # 지문 1편 적정 길이
    material_target: 64        # 필요한 지문 자료 수 (16주 × 주 2편 × 2학기)
    source_mix: {textbook: 40, custom: 50, book: 10}
    focus: "소리-철자 연결, 문장 통째 읽기, 기초 어순 감각"
    grammar_sequence:
      - "be동사 현재형"
      - "일반동사 현재형"
      - "명사의 단수·복수"
      - "관사 a/an/the"
      - "인칭대명사와 소유격"
      - "형용사의 자리"
      - "There is / There are"
      - "의문사 의문문(who/what/where)"
      - "현재진행형"
      - "빈도부사와 위치"
      - "조동사 can / can't"
      - "명령문과 청유문"
      - "전치사(장소·시간)"
      - "be동사 과거형"
      - "일반동사 과거형(규칙)"
      - "1학기 총정리 · 문장 만들기"

  - code: E2
    name: "초등 발전"
    grades: "초5"
    vocab_target: 1200
    sentence_words: [8, 14]
    passage_words: [90, 140]
    material_target: 64
    source_mix: {textbook: 35, custom: 45, book: 20}
    focus: "문장 확장, 시제 구분, 문단 단위 읽기"
    grammar_sequence:
      - "일반동사 과거형(불규칙)"
      - "미래표현 will / be going to"
      - "과거진행형"
      - "조동사 must / have to"
      - "조동사 should / may"
      - "감각동사 + 형용사"
      - "수여동사(4형식)"
      - "to부정사 명사적 용법"
      - "동명사의 기초"
      - "비교급"
      - "최상급"
      - "접속사 and/but/or/so"
      - "접속사 when/because/if"
      - "부가의문문"
      - "대명사 it의 여러 쓰임"
      - "1학기 총정리 · 문단 쓰기"

  - code: E3
    name: "예비중"
    grades: "초6"
    vocab_target: 1600
    sentence_words: [10, 16]
    passage_words: [110, 170]
    material_target: 64
    source_mix: {textbook: 30, school: 10, custom: 40, book: 20}
    focus: "중등 문법 용어에 적응, 지문 구조 인식 시작"
    grammar_sequence:
      - "문장의 5형식 개관"
      - "1·2형식과 보어"
      - "3·4형식 전환"
      - "5형식과 목적격보어"
      - "to부정사 형용사적 용법"
      - "to부정사 부사적 용법"
      - "동명사 vs to부정사"
      - "현재완료 기초(경험·완료)"
      - "현재완료 계속·결과"
      - "수동태 기초"
      - "관계대명사 who/which/that"
      - "접속사 that과 명사절"
      - "간접의문문"
      - "원급 비교 as~as"
      - "연결어와 글의 흐름"
      - "1학기 총정리 · 서술형 대비"

  - code: M1
