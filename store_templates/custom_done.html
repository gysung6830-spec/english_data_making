{% extends "base.html" %}
{% block title %}문의 접수 완료 · {{ site.brand }}{% endblock %}

{% block body %}
<section class="section">
  <div class="wrap narrow center">
    <div class="section-head center">
      <h2>문의가 접수되었습니다</h2>
      <p>문의번호 <b>{{ order_no }}</b></p>
    </div>
    <div class="alert alert-info" style="text-align:left;">
      지문을 확인한 뒤 <b>견적과 일정</b>을 적어 주신 이메일로 회신드립니다.
      영업일 기준 1일 이내에 답을 드리고 있습니다.<br><br>
      지문 파일을 아직 안 보내셨다면 <b>{{ site.contact.email }}</b> 으로
      문의번호와 함께 보내 주세요.
    </div>
    <div style="margin-top:26px;">
      <a class="btn btn-ghost" href="{{ url_for('products') }}">판매 중인 자료 보기</a>
      <a class="btn btn-primary" href="{{ url_for('home') }}">홈으로</a>
    </div>
  </div>
</section>
{% endblock %}
