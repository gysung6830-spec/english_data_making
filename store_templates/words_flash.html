{% extends "base.html" %}
{% block title %}{{ b.name }} 깜빡이 · {{ site.brand }}{% endblock %}
{% block desc %}{{ b.name }} 단어를 깜빡이로 훑습니다.{% endblock %}

{% block body %}
<section class="section">
  <div class="wrap narrow">
    <a class="back-link" href="{{ back }}">← 다시 고르기</a>
    <div class="fl-top">
      <span class="fl-scope">{{ scope }}</span>
      <span class="fl-count"><b id="fl-n">1</b> / {{ words|length }}</span>
    </div>

    <div class="fl-card" id="fl-card">
      <b class="fl-en" id="fl-en"></b>
      <p class="fl-ko" id="fl-ko"></p>
      <span class="fl-unit muted" id="fl-unit"></span>
    </div>

    <div class="fl-bar"><i id="fl-fill"></i></div>

    <div class="fl-tools">
      <button type="button" class="sq-tool" id="fl-prev">← 앞</button>
      <button type="button" class="sq-tool go" id="fl-play">멈춤</button>
      <button type="button" class="sq-tool" id="fl-next">뒤 →</button>
      <div class="spacer"></div>
      <button type="button" class="sq-tool" id="fl-sound" aria-pressed="true">소리 켬</button>
    </div>
    <div class="fl-tools">
      <span class="mt-label">속도</span>
      <div class="pick pick-sm" id="fl-speed">
        <button type="button" class="pick-btn" data-ms="3200">느리게</button>
        <button type="button" class="pick-btn on" data-ms="2200">보통</button>
        <button type="button" class="pick-btn" data-ms="1400">빠르게</button>
      </div>
      <div class="spacer"></div>
      <label class="check"><input type="checkbox" id="fl-flip"><span>뜻 → 영어</span></label>
    </div>

    <div class="fl-done" id="fl-done" hidden>
      <b>다 훑었습니다.</b>
      <p class="muted">이제 문제로 확인해 보세요.</p>
      <div class="hero-actions">
        <a class="btn btn-primary btn-sm" href="{{ back }}">문제 풀러 가기</a>
        <button type="button" class="btn btn-ghost btn-sm" id="fl-again">다시 훑기</button>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  var WORDS = {{ words|tojson }};
  var at = 0, timer = null, showKo = false, playing = true, ms = 2200, sound = true;
  var en = document.getElementById('fl-en'), ko = document.getElementById('fl-ko');
  var unit = document.getElementById('fl-unit'), card = document.getElementById('fl-card');

  function say(t) {
    if (!sound || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US'; u.rate = 0.95;
    speechSynthesis.speak(u);
  }
  function flip() {                                  /* 뜻 → 영어로 뒤집기 */
    return document.getElementById('fl-flip').checked;
  }
  function draw() {
    var w = WORDS[at];
    if (!w) return;
    card.classList.remove('show');
    void card.offsetWidth;                           /* 다시 깜빡이게 */
    card.classList.add('show');
    en.textContent = flip() ? w.ko : w.en;
    ko.textContent = showKo ? (flip() ? w.en : w.ko) : '';
    ko.hidden = !showKo;
    unit.textContent = w.unit || '';
    document.getElementById('fl-n').textContent = at + 1;
    document.getElementById('fl-fill').style.width =
      ((at + 1) / WORDS.length * 100) + '%';
    if (showKo && !flip()) say(w.en);
    if (!showKo && flip()) { /* 뜻이 먼저 뜨는 차례에서는 안 읽습니다 */ }
    else if (!showKo) say(w.en);
  }
  function tick() {
    if (!showKo) { showKo = true; draw(); return; }  /* 먼저 낱말, 그다음 뜻 */
    showKo = false;
    at++;
    if (at >= WORDS.length) { stop(); done(); return; }
    draw();
  }
  function start() {
    playing = true;
    document.getElementById('fl-play').textContent = '멈춤';
    clearInterval(timer);
    timer = setInterval(tick, ms);
  }
  function stop() {
    playing = false;
    document.getElementById('fl-play').textContent = '이어서';
    clearInterval(timer);
  }
  function done() { document.getElementById('fl-done').hidden = false; }
  function jump(d) {
    showKo = false;
    at = Math.min(WORDS.length - 1, Math.max(0, at + d));
    document.getElementById('fl-done').hidden = true;
    draw();
    if (playing) start();
  }
  document.getElementById('fl-play').addEventListener('click', function () {
    playing ? stop() : start();
  });
  document.getElementById('fl-prev').addEventListener('click', function () { jump(-1); });
  document.getElementById('fl-next').addEventListener('click', function () { jump(1); });
  card.addEventListener('click', function () { showKo = !showKo; draw(); });
  document.getElementById('fl-flip').addEventListener('change', function () {
    showKo = false; draw();
  });
  document.getElementById('fl-sound').addEventListener('click', function (e) {
    sound = !sound;
    e.target.textContent = sound ? '소리 켬' : '소리 끔';
    e.target.setAttribute('aria-pressed', sound ? 'true' : 'false');
  });
  document.querySelectorAll('#fl-speed .pick-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#fl-speed .pick-btn').forEach(function (x) {
        x.classList.remove('on');
      });
      b.classList.add('on');
      ms = parseInt(b.dataset.ms, 10);
      if (playing) start();
    });
  });
  document.getElementById('fl-again').addEventListener('click', function () {
    at = 0; showKo = false;
    document.getElementById('fl-done').hidden = true;
    draw(); start();
  });
  draw(); start();
})();
</script>
{% endblock %}
