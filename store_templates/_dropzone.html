{# 파일을 끌어다 놓는 자리. 맞춤 제작 의뢰와 시험지 보내기가 함께 씁니다.
   화면에 id="drop"(감싸는 label)과 id="files"(input)가 있어야 하고,
   id="shot"(사진 찍기용 input)이 있으면 찍은 사진을 이어 붙입니다. #}
<script>
(function () {
  var drop = document.getElementById('drop');
  var input = document.getElementById('files');
  if (!drop || !input) return;
  var shot = document.getElementById('shot');
  var badge = drop.querySelector('.dz-file');
  var title = drop.querySelector('.dz-title');
  var clear = document.getElementById('dz-clear');
  var first = title ? title.textContent : '';
  var max = parseInt(input.getAttribute('data-max') || '5', 10);
  /* 사진을 여러 번 나눠 찍으실 수 있게, 새로 고른 것을 앞의 것에 이어 붙입니다.
     그러려면 FileList 를 새로 만들어야 하는데 DataTransfer 로만 됩니다. */
  var canAdd = (function () {
    try { return !!new DataTransfer(); } catch (e) { return false; }
  })();

  function show() {
    var names = [].map.call(input.files, function (f) { return f.name; });
    if (badge) {
      badge.textContent = names.join(' · ');
      badge.hidden = !names.length;
    }
    if (clear) clear.hidden = !names.length;
    drop.classList.toggle('has', !!names.length);
    drop.classList.toggle('too-many', names.length > max);
    if (title) {
      title.textContent = !names.length ? first
        : names.length > max ? max + '장까지만 보낼 수 있습니다'
        : names.length + '개를 올립니다';
    }
  }

  function add(list) {
    if (!list || !list.length) return;
    if (!canAdd) { input.files = list; show(); return; }
    var box = new DataTransfer(), seen = {};
    [].forEach.call(input.files, function (f) {
      seen[f.name + f.size] = 1; box.items.add(f);
    });
    [].forEach.call(list, function (f) {          /* 같은 파일은 한 번만 */
      if (!seen[f.name + f.size]) { seen[f.name + f.size] = 1; box.items.add(f); }
    });
    input.files = box.files;
    show();
  }

  input.addEventListener('change', show);

  if (shot) {
    shot.addEventListener('change', function () {
      add(shot.files);
      shot.value = '';               /* 같은 자리에서 또 찍을 수 있게 비웁니다 */
    });
    /* 사진 찍기 버튼이 감싸는 label 안에 있어도 파일 창이 같이 열리지 않게 막습니다 */
    var cam = document.getElementById('dz-cam');
    if (cam) cam.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation(); shot.click();
    });
  }

  if (clear) clear.addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
    input.value = '';
    show();
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault(); drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault();
      if (ev === 'dragleave' && drop.contains(e.relatedTarget)) return;
      drop.classList.remove('over');
    });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer) add(e.dataTransfer.files);
  });
})();
</script>
