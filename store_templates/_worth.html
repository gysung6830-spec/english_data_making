{# 값을 무엇과 견줄지. 값이 얼마라고 우리가 주장하지는 않습니다 —
   학원비도 선생님 시간도 우리가 알 수 없는 값이라, 판단은 손님 몫으로 둡니다.
   받는 사람을 줄마다 지목해, 어느 쪽이 읽어도 자기 말과 남의 말이 구분됩니다.
   부르실 때 worth_head 를 넘기시면 맨 위에 한 줄이 붙습니다. #}
<div class="worth-box">
  {% if worth_head %}<b>{{ worth_head }}</b>{% endif %}
  <ul>
    <li><b>혼자 공부한다면</b> — 학원 한 달 수강료와 견줘 보세요.</li>
    <li><b>가르치신다면</b> — 자료를 찾고 만드는 시간과 견줘 보세요.</li>
  </ul>
</div>
