<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필생보 — 필자의 생각이 보이는 영어독해 (교재 생성기)</title>
<style>
  :root { --green:#279A52; --greenD:#1E7A40; --mint:#EAF6EC; --ink:#232323; --sub:#6b7280; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"NanumSquareRound","Noto Sans KR","Malgun Gothic",sans-serif;
    background:#f6f8f6; color:var(--ink); line-height:1.6; }
  .wrap { max-width:680px; margin:0 auto; padding:40px 20px 80px; }
  header h1 { font-size:26px; margin:0 0 6px; }
  header p { color:var(--sub); margin:0 0 26px; }
  .badge { display:inline-block; background:var(--green); color:#fff; font-weight:700;
    font-size:12px; padding:4px 12px; border-radius:20px; margin-bottom:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; margin-bottom:18px; }

  /* API 키 입력 */
  .field { margin-bottom:18px; }
  .field label { display:block; font-weight:700; font-size:14px; margin-bottom:7px; }
  .field .opt { color:var(--sub); font-weight:400; font-size:12.5px; }
  .keybox { display:flex; gap:8px; }
  .keybox input { flex:1; min-width:0; padding:11px 12px; border:1px solid var(--line);
    border-radius:9px; font-size:14px; font-family:inherit; }
  .keybox input:focus { outline:none; border-color:var(--green); }
  .keybox .toggle { flex:none; width:auto; margin:0; border:1px solid var(--line); background:#fff;
    border-radius:9px; padding:0 14px; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--sub); }
  .keyhelp { color:var(--sub); font-size:12px; margin-top:7px; }
  .keyhelp a { color:var(--green); }

  /* 드롭 존 */
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    width:100%; min-height:150px; border:2px dashed #bcd8c2; border-radius:12px; background:var(--mint);
    text-align:center; padding:24px 20px; cursor:pointer; transition:.15s; }
  .drop.drag { background:#dcefe0; border-color:var(--green); }
  .drop .di { font-size:28px; line-height:1; }
  .drop .dt { display:block; color:var(--greenD); font-size:16px; font-weight:800; }
  .drop .ds { display:block; color:var(--sub); font-size:12.5px; }
  .fname { margin-top:4px; font-size:13.5px; color:var(--greenD); font-weight:700; word-break:break-all; }
  #file { display:none; }

  button { width:100%; margin-top:16px; background:var(--green); color:#fff; border:0; border-radius:10px;
    padding:14px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; }
  button:disabled { background:#a9c9b1; cursor:default; }
  .steps { font-size:13px; color:#374151; }
  .steps div { padding:5px 0; border-bottom:1px solid #f0f0f0; }
  .steps div:last-child { border-bottom:0; }
  .steps div:before { content:"›"; color:var(--green); font-weight:800; margin-right:8px; }
  .result h3 { margin:0 0 10px; }
  .result a { display:inline-block; background:var(--greenD); color:#fff; text-decoration:none;
    padding:10px 18px; border-radius:8px; font-weight:700; margin:6px 10px 0 0; }
  .err { color:#b3261e; font-weight:700; }
  .muted { color:var(--sub); font-size:12.5px; }
  .spin { display:inline-block; width:15px; height:15px; border:2px solid #cfe4d4; border-top-color:var(--green);
    border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">필생보 · 필자의 생각이 보이는 영어독해</span>
    <h1>필생보 교재 자동 생성기</h1>
    <p>수능·평가원 영어 지문 PDF 를 올리면, AI 가 <b>지문 단위</b>로 독해 훈련 교재(편집용 docx + 배포용 PDF)를 만들어 줘. 문장은 원문 순서 그대로, 문법은 문장별 포인트로 짚고, <b>소재 → 필자 주장 → 글 구조 → 재진술</b>까지 한 지문을 온전히 뜯어봐.</p>
  </header>

  <div class="card">
    <form id="form">
      <!-- API 키 -->
      <div class="field">
        <label for="apikey">🔑 Claude API 키 <span class="opt">(선택 — 넣으면 실제 AI, 비우면 형식만 MOCK)</span></label>
        <div class="keybox">
          <input type="password" id="apikey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
          <button type="button" class="toggle" id="toggleKey">보기</button>
        </div>
        <div class="keyhelp">키는 <b>이 브라우저에만 저장</b>되고, 교재 만들 때 내 컴퓨터의 로컬 서버로만 전달돼(외부 전송 없음). <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">API 키 발급받기 ↗</a></div>
      </div>

      <!-- PDF 드롭 -->
      <div class="field">
        <label>📄 지문 PDF</label>
        <label class="drop" id="drop">
          <span class="di">📄</span>
          <span class="dt">PDF 를 여기에 끌어다 놓거나 클릭해서 선택</span>
          <span class="ds">수능/평가원 WORKBOOK · 모의고사 지문 PDF (최대 30MB)</span>
          <input type="file" id="file" name="pdf" accept="application/pdf,.pdf">
          <div class="fname hide" id="fname"></div>
        </label>
      </div>

      <button type="submit" id="go" disabled>교재 만들기</button>
    </form>
  </div>

  <div class="card hide" id="progress"><div class="steps" id="steps"></div></div>
  <div class="card hide result" id="result"></div>
  <p class="muted" id="mode"></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fileInput = $('file'), drop = $('drop'), fname = $('fname'), go = $('go');
const form = $('form'), progress = $('progress'), stepsEl = $('steps'), result = $('result');
const apikey = $('apikey'), modeEl = $('mode');

// API 키 저장/복원 (이 브라우저 로컬)
apikey.value = localStorage.getItem('pilsaengbo_key') || '';
apikey.addEventListener('input', () => { localStorage.setItem('pilsaengbo_key', apikey.value.trim()); updateMode(); });
$('toggleKey').addEventListener('click', () => {
  const on = apikey.type === 'password'; apikey.type = on ? 'text' : 'password'; $('toggleKey').textContent = on ? '숨김' : '보기';
});
function updateMode() {
  modeEl.textContent = apikey.value.trim()
    ? 'AI 모드: 입력한 Claude 키로 실제 해석·분석을 생성합니다.'
    : 'MOCK 모드: 키가 비어 있어 형식만 만듭니다. 위에 키를 넣으면 실제 AI 로 생성돼요.';
}
updateMode();

function setFile(f) { if (!f) return; fname.textContent = '선택됨: ' + f.name; fname.classList.remove('hide'); go.disabled = false; }
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
['dragover', 'dragenter'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', (ev) => { const f = ev.dataTransfer.files[0]; if (f) { fileInput.files = ev.dataTransfer.files; setFile(f); } });

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!fileInput.files[0]) return;
  go.disabled = true; result.classList.add('hide'); progress.classList.remove('hide');
  stepsEl.innerHTML = '<div><span class="spin"></span>업로드하고 교재를 만드는 중… (지문이 많으면 몇 분 걸릴 수 있어요)</div>';

  const fd = new FormData();
  fd.append('pdf', fileInput.files[0]);
  if (apikey.value.trim()) fd.append('apiKey', apikey.value.trim());
  try {
    const r = await fetch('/api/generate', { method: 'POST', body: fd });
    const data = await r.json();
    stepsEl.innerHTML = (data.steps || []).map((s) => `<div>${s}</div>`).join('') || '';
    if (!data.ok) {
      result.innerHTML = `<p class="err">⚠️ ${data.error}</p>` + (data.detail ? `<p class="muted">${data.detail.slice(0, 8).join('<br>')}</p>` : '');
    } else {
      result.innerHTML = `<h3>✅ 완성! (지문 ${data.passages}개 · 문장 ${data.sentences}개 · ${data.mode === 'mock' ? 'MOCK' : 'AI'})</h3>` +
        data.files.map((f) => `<a href="${f.url}" download>${f.label} 다운로드</a>`).join('');
    }
  } catch (e) {
    result.innerHTML = `<p class="err">⚠️ 요청 실패: ${e.message}. 서버(검은 창)가 켜져 있는지 확인해줘.</p>`;
  } finally {
    result.classList.remove('hide'); go.disabled = false;
  }
});
</script>
</body>
</html>
