# ============================================================
#  동형모의고사 자동생성 - 설정 (§8.5.7)
#  '학교를 고르면 그 학교가 학습한 경향대로 동형이 생성됩니다.'
# ============================================================

mode: generate          # learn | generate
school_id: jinyang_hs   # 대상 학교(profiles/schools.json 에서 선택)
grade: 1                # 학년
difficulty: 중          # 상 | 중 | 하

# 생성 모델(속도/품질/비용). 기본은 빠르고 우수한 Sonnet.
#   claude-sonnet-5           : 빠름·고품질(권장, 기본)
#   claude-haiku-4-5-20251001 : 초고속·저비용(간단한 문항)
#   claude-opus-4-8           : 최고품질·느림·고비용
model: "claude-sonnet-5"

# 지문 처리
passage_mode: assign    # assign(올린 지문 자동배정, 기본) | keep(원본 유지)

# 출력 머리글(원본 시험지 디자인) — 아래 값만 학교/시험에 맞게 적어주세요.
header_info:
  exam_title: "2026학년도 1학기 2차 시험"   # n학년도 n학기 n차 시험 (자유 입력)
  code: "03"
  class_range: "1학년 (1 ~ 10)반"
  subject: "공통영어1"                       # 과목명 (자유 입력)
  date: "2026. 7. 1. 1교시"
  # 유의사항(머리글 박스 아래). 생략하면 아래 기본 문구가 그대로 나옵니다.
  #  - '지필평가: 총(N)문항...' 줄은 문항수·쪽수를 자동으로 채웁니다.
  # guidelines:
  #   - "선다형은 반드시 컴퓨터용 사인펜을 사용하여 해당 답란에 정확히 마킹(●)하시오.\n서술형은 서술형 답안지에 흑색 또는 청색 볼펜을 사용하여 정확히 서술하시오."
  #   - "각 문항마다 배점이 다르니 문항 끝에 표시된 배점을 참고하기 바랍니다."

footer: "© 2026 Ortica영어. All rights reserved."
num_forms: 1            # 생성할 세트 수(A형/B형 등)
answer_key: end         # end(맨 뒤) | separate(별도 파일)

paths:
  input: "input"
  output: "output"
