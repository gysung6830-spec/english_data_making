# ============================================================
#  영어 지문 자동 분석 도구 - 설정 파일
#  코딩을 몰라도 아래 숫자/값만 바꾸면 동작이 달라집니다.
# ============================================================

# 사용할 Claude 모델 (특별한 이유가 없으면 그대로 두세요)
model: "claude-opus-4-8"

# 폴더 설정
paths:
  input: "input"     # 분석할 지문 PDF들을 넣는 폴더
  output: "output"   # 완성된 분석 PDF가 저장되는 폴더
  logs: "logs"       # 처리 성공/실패 기록이 남는 폴더

# 어휘 개수 (지문 길이에 따라 이 범위 안에서 뽑습니다)
vocab:
  min: 12
  max: 20

# PDF 지문 추출 방식
extraction:
  # vision = PDF를 이미지로 렌더해 Claude 비전으로 읽음(정확도 최고, 사진 입력 수준, 비용 큼)
  # text   = pdfplumber 텍스트 추출(빠르고 저렴하나 표/다단에서 글자가 깨질 수 있음)
  # auto   = text 로 먼저 시도하고, 비어있거나 깨져 보이면(문제 파일) vision 으로 보완
  # ★ 무인 배치 권장값: "auto"
  #   정상 파일은 저렴한 텍스트로, '문제 파일'만 자동으로 비전으로 다시 읽습니다.
  pdf_mode: "auto"
  dpi: 150

# 처리 방식
processing:
  # 한 지문당 6개 섹션을 동시에 요청할지 여부 (true 면 더 빠름)
  parallel_sections: true
  # 검증 실패(JSON 오류/개수 부족) 시 재요청 횟수
  #   사람이 검수하기 어려운 무인 배치에서는 2 이상을 권장(오류 결과물 감소).
  max_retries: 2
  # 대량 처리 시 Batch API 사용 여부 (지문 수가 많을 때 비용 절감)
  #   run.py --batch 로 실행하면 이 값과 상관없이 배치 모드로 동작합니다.
  use_batch_for_bulk: true

# 출력 PDF 디자인
design:
  # 지문 하단에 넣을 출처/저작권 문구 (비워두면 표시 안 함)
  footer_note: "© 김은아영어연구소  ·  무단 전재·복제·배포 금지"
  # 지문별로 개별 PDF 를 만들지(true), 하나의 PDF 로 합칠지(false)
  one_pdf_per_passage: true
  # 분석지의 '직독직해 made by ~' 문구에 넣는 브랜드 이름.
  #   비우면("") 브랜드 문구 없이 나옵니다. (하단 저작권 footer_note 와는 무관)
  brand: ""

# 어떤 PDF 를 만들지 선택 (true=생성 / false=건너뜀)
#   - analysis : 지문 분석지 (6개 섹션)
#   - wordlist : 직독직해 핵심 어휘만 모은 어휘 리스트
#   - quiz     : 어휘를 무작위로 섞어 뜻을 적게 하는 영단어 시험지(정답 포함)
#   - lecture  : 강의컨셉 교재 (학생 훈련용 문제지 + 강사용 정답지 세트)
#                직독직해 대신 학생이 먼저 스스로 풀도록 만든 5개 훈련 섹션:
#                어휘 힌트 / 오역포인트 교정 / 문장 역할 파악 / 함정포인트 / 패러프레이징 줄잇기
outputs:
  analysis: true      # 교사용 분석지(정답 포함)
  student: false      # 학생용 분석지(정답 빈칸) — 필요하면 true
  wordlist: true
  quiz: true
  lecture: false      # 강의컨셉 교재(학생 훈련용 + 강사용 정답지) — 필요하면 true
