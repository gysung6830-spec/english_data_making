# ============================================================
#  구문해석 파트 — 해석공식 시각화 데이터
#  구문 유형을 '실전 해석 동작'이 같은 것끼리 3 PART로 묶고,
#  각 유형마다 Point(개념) · 실전 전략 · 해석공식 다이어그램 · 기출 예문을 담는다.
#  코딩 몰라도 여기 문구/행/예문만 고치면 교재에 반영됩니다.
# ============================================================
parts:
- id: modifier
  title: 수식어 괄호치기 구문
  subtitle: 뼈대를 숨기는 살(수식어) 걷어내기
  strategy: 명사 뒤 덩어리는 통째로 괄호 → 주어+동사(뼈대)부터 읽는다.
  types:
  - wh_clause
  - participle
  - insertion
  - apposition
  - prep_stack
- id: nounclause
  title: 명사절 묶기 구문
  subtitle: 절을 통째 [한 덩어리 명사]로 묶어 주어·목적어 자리에 넣기
  strategy: what/that절은 건너뛰는 '살'이 아니라 '뼈대'다 — 절 전체를 [ ]로 묶어 하나의 명사(주어·목적어·보어)로 취급한다.
  types:
  - what_clause
  - that_clause
- id: order
  title: 어순·구조 특이구문
  subtitle: 자리가 바뀌어도 자연스럽게 해석하기
  strategy: 자리가 바뀐 채로도 신호만 잡으면 자연스럽게 읽힌다 — 굳이 원위치로 되돌리지 않아도 된다.
  types:
  - inversion
  - emphasis
  - parallel
formulas:
  wh_clause:
    point: who/which/that/where/when/why/how 가 명사를 꾸미거나(관계사) 명사절을 만든다.
    strategy: wh- 앞에 명사가 있으면 '~하는'(수식), 없으면 '누가/어디/왜 ~하는지'(명사절). 어느 쪽이든 wh~끝까지 통째 괄호, 앞 명사만 뼈대.
    diagram:
      symbol: N ← [wh ~]
      rows:
      - en: N + who/which/that + V
        ko: ~하는 (앞 명사를 수식)
      - en: wh + S + V
        ko: 누가/어디/왜 ~하는지 (명사절)
    examples:
    - en: Consider two athletes who both want to play in college.
      src: 2022 고3 6월 20번
      cut: 생각해 보라 / 두 선수를 / [둘 다 대학에서 뛰고 싶어하는].
  participle:
    point: 문두·콤마 뒤 V-ing / V-ed 덩어리는 '부대상황'. 주절의 동작에 곁들여지는 살이다.
    strategy: 분사 덩어리를 통째 괄호 → 주절 뼈대부터 읽고, ~하면서 / ~한 채로 / ~해서로 붙인다. 분사의 의미상 주어=주절 주어.
    diagram:
      symbol: 주절 + (분사)
      rows:
      - en: V-ing ~,
        ko: ~하면서 / ~해서 (능동)
      - en: (being) V-ed ~,
        ko: ~된 채로 / ~되어 (수동)
      - en: Having p.p. ~,
        ko: ~하고 나서 (완료)
    examples:
    - en: Recognizing how she felt about her failure, Ken approached her and said a few encouraging words.
      src: 2023 고3 11월 19번
      cut: (그녀가 실패를 어떻게 느끼는지 알아채고서), / Ken이 그녀에게 다가가 / 몇 마디 격려의 말을 건넸다.
  insertion:
    point: — … — / , which / 콤마 사이에 부가 설명이 끼어든다. 뼈대가 아니라 곁다리.
    strategy: 대시·콤마 삽입을 통째 괄호치고 없는 셈 → 뼈대부터 읽는다. 삽입을 빼도 문장이 성립하면 제대로 괄호친 것.
    diagram:
      symbol: S …(삽입)… V
      rows:
      - en: S — … — V
        ko: 대시 사이 = 부가 설명 (건너뜀)
      - en: N, which ~,
        ko: 앞 문장·명사를 보충 설명
      - en: N, a/the N, ~
        ko: 콤마 동격 (= 같은 대상)
    examples:
    - en: For the present generation of artists, the computer, or more appropriately, the laptop, is one tool.
      src: 2022 고3 6월 31번
      cut: 요즘 세대 예술가에게 / 컴퓨터는, (더 정확히는 노트북은), / 도구 하나다.
  apposition:
    point: the fact/idea/belief + that … 또는 'N, N' 콤마 동격 — 앞 명사와 뒤 내용이 '='.
    strategy: the fact that … 의 that은 관계사가 아니라 동격(=내용). '명사 = that절 내용'으로 등호를 긋는다.
    diagram:
      symbol: N = [내용]
      rows:
      - en: the fact that S+V
        ko: ~라는 사실 (사실 = 내용)
      - en: N, (a/the) N,
        ko: 즉, 다시 말해 (같은 대상)
    examples: []
  prep_stack:
    point: 수능 문장이 '길고 어려운' 결정적 이유 — 명사 뒤에 전치사구가 '계속' 이어붙기 때문이다. 하나씩 뒤에서 앞으로 붙이면 아무리 길어도 안 무너진다.
    strategy: 전치사(of/in/for…)를 만날 때마다 '여기서 새 살 시작'으로 끊는다 → 명사 하나가 완성될 때까지 뒤에서 앞으로 '~의/~에 있는/~을 위한'. 진짜 주어는 맨 앞 명사 하나뿐.
    diagram:
      symbol: N ← of → in → for …
      rows:
      - en: N of N
        ko: ~의 (소유·관련)
      - en: N in / on / at N
        ko: ~에 있는 (장소·범위)
      - en: N for N
        ko: ~을 위한 (목적)
      - en: N with / without N
        ko: ~을 가진 / ~ 없는
      - en: N between / among N
        ko: ~ 사이의
    training:
    - level: ① 쉬움 · 전치사구 1개
      en: the amount [of traffic]
      ko: 교통의 양
    - level: ② 보통 · 2개 연속
      en: the amount [of traffic] [on the highway]
      ko: 고속도로 위 / 교통의 양
    - level: ③ 어려움 · 3개 중첩
      en: the amount [of traffic] [on the highway] [during rush hour]
      ko: 출퇴근 시간 / 고속도로 위 / 교통의 양
    - level: ④ 하드 · 4개+ (주어가 끝없이 길어짐)
      en: the tendency [of people] [in cities] [with limited access] [to public transport]
      ko: 대중교통 이용이 제한된 / 도시의 / 사람들의 / 경향
    examples:
    - en: The amount of traffic on the highway during rush hour has been steadily increasing over the years.
      src: 예문(트레이닝)
      cut: '[출퇴근 시간 / 고속도로 위 / 교통의] 양은 / 수년에 걸쳐 / 꾸준히 늘어왔다.'
      ab: '교통량 → 늘어남 (뼈대: The amount ~ has increased)'
    - en: Last week, I made a reservation for one of your company's swimming pools for our summer swim camp.
      src: 2022 고3 6월 18번
      cut: 지난주에 / 저는 예약을 했습니다 / [귀사의 수영장 중 하나를] / [저희 여름 수영 캠프를 위해].
      ab: '나 → 예약함 (뼈대: I made a reservation)'
  inversion:
    point: 문두 부정어(Never/Not only/Only…)가 오면 도치된다. 하지만 굳이 원위치로 되돌릴 필요 없다 — 도치된 순서 그대로 '신호부터 받고' 자연스럽게 이어 읽으면 된다.
    strategy: 문두 부정어를 '거의/결코 ~않다 · ~뿐 아니라 · 오직 ~해서야'로 먼저 받고, 뒤의 '조동사+주어'는 그냥 주어로 이어 읽는다. 되돌리지 말고 흐르는 대로.
    diagram:
      symbol: 부정어 + V + S → 그대로
      rows:
      - en: Never/Little + aux + S ~
        ko: '''결코/거의 ~않다'' + 이어서 S가 ~'
      - en: Not only A but (also) B
        ko: '''A뿐 아니라'' + 이어서 B도 ~'
      - en: Only + 부사구 + aux + S
        ko: '''오직 ~해서야 비로소'' + S가 ~'
    examples:
    - en: Not only is it less convenient to access locations in cities, but the very process generates negative effects.
      src: 2023 고3 6월 24번
      cut: '''~뿐 아니라'' 받기 → 도시에서 장소 접근이 덜 편할 ''뿐 아니라'', / 이어서 → 이동 과정 자체가 부정적 효과를 낳는다.'
      ab: 도시 이동 → 불편 + 부작용 (둘 다)
  emphasis:
    point: It is/was X that … 는 X를 부각하는 강조구문. do/does/did + 동사원형은 동사 강조.
    strategy: It is ~ that 사이(X)가 '강조 대상=답'인 경우가 많다. that절이 완전하면 강조(X 부각), 불완전하면 가주어·진주어.
    diagram:
      symbol: It is [X] that ~
      rows:
      - en: It is X that ~
        ko: 바로 X가 ~인 것이다 (X 강조)
      - en: do / does / did + V
        ko: 정말 ~하다 (동사 강조)
    examples: []
  parallel:
    point: and / but / or, not only A but also B, both A and B — 같은 급끼리 대칭으로 묶인다.
    strategy: 접속사 앞뒤로 '같은 모양(품사)'을 손가락으로 짚어 짝을 맞춘다. 짝이 안 맞으면 병렬 대상을 잘못 잡은 것.
    diagram:
      symbol: A ∥ B
      rows:
      - en: A and/or/but B
        ko: A와 B (같은 급)
      - en: not only A but also B
        ko: A뿐 아니라 B도
      - en: both A and B / either A or B
        ko: A와 B 둘 다 / 둘 중 하나
    examples:
    - en: Not only musicians and psychologists, but also committed music enthusiasts and experts voice the opinion.
      src: 2022 고3 9월 24번
      cut: 음악가와 심리학자뿐 아니라, / 열성적 애호가와 전문가들도 / 그 의견을 낸다.
  what_clause:
    point: what 은 선행사를 포함(the thing which). what절 전체가 하나의 명사(주어·목적어·보어)다.
    strategy: what절 전체를 [ ]로 묶어 '~하는 것'이라는 한 덩어리 명사로 취급한다.
    diagram:
      symbol: '[what ~] = 명사'
      rows:
      - en: what S + V
        ko: ~하는 것 (명사 덩어리)
      - en: what matters / what counts
        ko: 중요한 것
    examples: []
  that_clause:
    point: 인식·전달 동사 + that S+V 는 '~라는 것을'. 접속사 that 뒤엔 완전한 문장이 온다(관계사 that과 구분).
    strategy: that절 전체를 목적어인 '한 문장(명사절)'으로 묶어 '~라는 것을'로 뒤에 붙인다.
    diagram:
      symbol: '[that S+V] = 명사절'
      rows:
      - en: V that S + V
        ko: ~라는 것을 (목적어절)
      - en: the N that S+V
        ko: 동격/관계 — 뒤 문장이 완전한가로 구분
    examples: []
