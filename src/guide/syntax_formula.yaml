parts:
- id: modifier
  title: 수식어 괄호치기 구문
  subtitle: 뼈대를 숨기는 살(수식어) 걷어내기
  strategy: 명사 뒤 덩어리는 통째로 괄호 → 주어+동사(뼈대)부터 읽는다.
  types:
  - wh_clause
  - participle
  - insertion
  - apposition
  - prep_stack
- id: nounclause
  title: 명사절 묶기 구문
  subtitle: 절을 통째 [한 덩어리 명사]로 묶어 주어·목적어 자리에 넣기
  strategy: what/that절은 건너뛰는 '살'이 아니라 '뼈대'다 — 절 전체를 [ ]로 묶어 하나의 명사(주어·목적어·보어)로 취급한다.
  types:
  - what_clause
  - that_clause
- id: order
  title: 어순·구조 특이구문
  subtitle: 자리가 바뀌어도 자연스럽게 해석하기
  strategy: 자리가 바뀐 채로도 신호만 잡으면 자연스럽게 읽힌다 — 굳이 원위치로 되돌리지 않아도 된다.
  types:
  - inversion
  - emphasis
  - parallel
formulas:
  wh_clause:
    point: who/which/that/where/when/why/how 가 명사를 꾸미거나(관계사) 명사절을 만든다.
    strategy: wh- 앞에 명사가 있으면 '~하는'(수식), 없으면 '누가/어디/왜 ~하는지'(명사절). 어느 쪽이든 wh~끝까지 통째
      괄호, 앞 명사만 뼈대.
    diagram:
      symbol: N ← [wh ~]
      rows:
      - en: N + who/which/that + V
        ko: ~하는 (앞 명사를 수식)
      - en: wh + S + V
        ko: 누가/어디/왜 ~하는지 (명사절)
    examples:
    - en: Consider two athletes who both want to play in college.
      src: 2022 고3 6월 20번
      cut: 생각해 보라 / 두 선수를 / [둘 다 대학에서 뛰고 싶어하는].
      how: 먼저 명령문 뼈대(Consider two athletes)를 잡고, who both want ~ 관계사절은 앞의 two athletes를
        꾸미는 수식어로 뒤에서 앞으로 붙여 읽는다.
    - en: Alternatively, parents who supply reasons, show an emotional understanding
        of difficulties overcoming problems, and use a minimum of external incentives
        are more likely to cultivate a sense of willingness and value for work in
        their child.
      src: 2024 고3 6월 30번
      cut: 그 대신에 / 부모는 [이유를 제시하고, 어려움을 극복하는 데 대한 정서적 이해를 보이며, 외적 유인은 최소로 쓰는] / 자녀에게
        일에 대한 의욕과 가치를 길러 줄 가능성이 더 크다.
      how: who ~ 관계사절이 supply·show·use 세 동사를 하나로 묶어 주어 parents를 수식한다. 관계절을 통째로 괄호치고,
        문장의 진짜 동사는 are임을 찾아 'parents are more likely to ~'를 뼈대로 읽는다.
    - en: A similar idea is supported by further evidence that checklists' can improve
        the quality of expert decisions in a ' range of domains by ensuring that important
        steps or considerations aren't missed when people are feeling overloaded.
      src: 2023 고3 11월 42번
      cut: 비슷한 생각이 / 추가 증거로 뒷받침된다 / [체크리스트가 여러 영역에서 전문가 결정의 질을 높일 수 있다는] / [사람들이 과부하를
        느낄 때 중요한 단계나 고려 사항이 빠지지 않도록 보장함으로써].
      how: evidence 뒤 that은 동격절로 evidence의 내용을 풀어준다(관계사 아님). 이어지는 ensuring that ~은
        '~을 보장함으로써'로 분사구문처럼 붙여 읽는다.
    - en: The critic who wants to write about literature from a formalist perspective
        must first be a close and careful reader who examines all the elements of
        a text individually and questions how they come together to create a work
        of art.
      src: 2022 고3 6월 32번
      cut: 그 비평가는 [형식주의 관점에서 문학에 관해 쓰고 싶어 하는] / 먼저 꼼꼼하고 신중한 독자여야 한다 / [텍스트의 모든 요소를
        개별적으로 검토하고 / 그것들이 어떻게 결합해 예술 작품을 만드는지 묻는].
      how: who가 두 번 나오는데 앞 who는 the critic을, 뒤 who는 reader를 각각 수식한다. 어느 명사를 꾸미는지 짝을
        맞춰 뒤 관계절을 앞 명사에 붙여 읽고, 뒤 who절 안의 how they come together ~는 questions의 목적어
        의문사절로 처리한다.
    - en: Technical mobilities turn human beings into some kind of terminal creatures,
        who spend most of their time at rest ( ) and who need to participate in sports
        in order to balance their daily disproportion of motion and rest.
      src: 2022 고3 6월 40번
      cut: 기술적 이동 수단은 / 인간을 일종의 종착역 같은 존재로 바꾼다 / [대부분의 시간을 쉬며 보내고 / 또 하루의 운동·휴식 불균형을
        맞추기 위해 스포츠에 참여할 필요가 있는].
      how: 콤마 뒤 who는 계속적 용법으로 terminal creatures를 부연 설명한다. and who로 두 관계절이 병렬되므로 앞에서
        뒤로 '~하고, 또 ~하는'으로 이어 읽는다.
  participle:
    point: 문두·콤마 뒤 V-ing / V-ed 덩어리는 '부대상황'. 주절의 동작에 곁들여지는 살이다.
    strategy: 분사 덩어리를 통째 괄호 → 주절 뼈대부터 읽고, ~하면서 / ~한 채로 / ~해서로 붙인다. 분사의 의미상 주어=주절 주어.
    diagram:
      symbol: 주절 + (분사)
      rows:
      - en: V-ing ~,
        ko: ~하면서 / ~해서 (능동)
      - en: (being) V-ed ~,
        ko: ~된 채로 / ~되어 (수동)
      - en: Having p.p. ~,
        ko: ~하고 나서 (완료)
    examples:
    - en: Recognizing how she felt about her failure, Ken approached her and said
        a few encouraging words.
      src: 2023 고3 11월 19번
      cut: (그녀가 자신의 실패를 어떻게 느끼는지 알아채고서) / Ken이 그녀에게 다가가 / 몇 마디 격려의 말을 건넸다.
      how: 문두에 콤마로 분리된 분사구(Recognizing ~)가 오면 먼저 주절 뼈대(Ken approached ~ and said)를
        찾고, 분사는 '~하고서/~하며'로 앞에 붙여 읽는다. how she felt ~는 Recognizing의 목적어절.
    - en: Unless you're comfortable planning your life around a particular scheduled
        trip, speed is worthless without frequency, so a transit map that screams
        about speed and ( ) whispers about frequency may simply be planting confusion.
      src: 2026 고3 11월 23번
      cut: 당신이 특정한 정해진 운행에 맞춰 삶을 계획하는 것이 편치 않다면 / 속도는 빈도 없이는 무가치하다 / 그래서 [속도만 외치고
        빈도는 속삭이는] 교통 노선도는 / 그저 혼란을 심고 있는 것일 수 있다.
      how: comfortable 뒤 planning은 형용사에 이어지는 동명사구(~하는 것에 대해 편하다)로 읽는다. 주절에서는 that
        screams ~ and whispers ~ 관계절이 두 동사를 병렬로 묶어 a transit map을 수식하므로 통째로 괄호치고 map
        may be planting을 뼈대로 잡는다.
    - en: Understanding why and where migration happens requires consideration of
        the political organization of territory, the spatial consequences of discrimination,
        socio‑economic patterns, and the layout of the physical environment.
      src: 2025 고3 6월 34번
      cut: 이주가 왜 어디서 일어나는지를 이해하는 것은 / 요구한다 / 영토의 정치적 구성, 차별의 공간적 결과, 사회·경제적 양상, 물리적
        환경의 배치에 대한 고려를.
      how: Understanding ~ happens가 통째로 동명사 주어이고 동사는 requires다. 긴 주어 덩어리를 하나로 묶어 '~하는
        것은 requires'로 뼈대를 잡은 뒤, of 이하 네 개의 목적어를 나란히 나열해 읽는다.
    - en: Comparing the offices of the 1940s with contemporary office spaces shows
        that they have circled back around to essentially the same style, via a period
        in the 1980s when partitions and cubicles were more the norm.
      src: 2024 고3 9월 24번
      cut: 1940년대 사무실을 현대 사무 공간과 비교하면 / 보여준다 / 그것들이 본질적으로 같은 양식으로 되돌아왔음을 / 칸막이·큐비클이
        더 일반적이던 1980년대 시기를 거쳐.
      how: 문두 Comparing ~은 주어 앞 분사구문으로 '~하면/~해 보면'으로 읽고, 이어지는 동사 shows를 뼈대로 잡는다. via
        a period ~ when ~은 뒤에서 when 관계절이 period를 수식하는 형태로 붙여 읽는다.
  insertion:
    point: — … — / , which / 콤마 사이에 부가 설명이 끼어든다. 뼈대가 아니라 곁다리.
    strategy: 대시·콤마 삽입을 통째 괄호치고 없는 셈 → 뼈대부터 읽는다. 삽입을 빼도 문장이 성립하면 제대로 괄호친 것.
    diagram:
      symbol: S …(삽입)… V
      rows:
      - en: S — … — V
        ko: 대시 사이 = 부가 설명 (건너뜀)
      - en: N, which ~,
        ko: 앞 문장·명사를 보충 설명
      - en: N, a/the N, ~
        ko: 콤마 동격 (= 같은 대상)
    examples:
    - en: For the present generation of artists, the computer, or more appropriately,
        the laptop, is one tool.
      src: 2022 고3 6월 31번
      cut: 요즘 세대 예술가에게 / 컴퓨터는, 더 정확히는 노트북은, / 하나의 도구다.
      how: 콤마 사이 삽입(or more appropriately, the laptop)을 먼저 걷어내 뼈대 the computer ~ is
        one tool를 확인한다. 삽입은 앞 명사를 바꿔 부른 것이므로 '더 정확히는 노트북'으로 가볍게 끼워 읽는다.
    - en: Whatever the nature of the outcome, which may actually favour one party
        more than another, the purpose of negotiation is the identification of areas
        of common interest and conflict.
      src: 2024 고3 11월 36번
      cut: 결과의 성격이 무엇이든 간에 / (실제로 어느 한쪽을 다른 쪽보다 유리하게 할 수도 있지만) / 협상의 목적은 / 공통 관심사와
        갈등의 영역을 확인하는 것이다.
      how: which ~ another는 콤마로 감싼 삽입절이므로 걷어내면 S(the purpose)+V(is)+C 골격이 드러난다. 삽입은
        the outcome을 부연하는 곁가지로 괄호쳐 두고 뼈대를 먼저 읽는다.
    - en: Urban delivery vehicles can be adapted to better suit the density of urban
        distribution, which often involves smaller vehicles such as vans, including
        bicycles.
      src: 2023 고3 11월 22번
      cut: 도시 배송 차량은 / 도시 유통의 밀도에 더 잘 맞도록 조정될 수 있다 / (여기에는 자전거를 포함해 흔히 밴 같은 더 작은 차량이
        포함된다).
      how: which often involves ~ 이하는 콤마로 이어진 계속적 관계절(삽입성 부연)이므로 걷어내면 앞 주절 S+V가 명확해진다.
        including bicycles는 그 안의 예시로 '~까지 포함해'로 덧붙여 읽는다.
    - en: The main institutions of state—parliament, courts, police and so on—along
        with certain of the professions, exhibit this formal character.
      src: 2023 고3 6월 38번
      cut: 국가의 주요 제도들은 / —의회·법원·경찰 등— / 특정 전문직들과 더불어 / 이 공식적 성격을 드러낸다.
      how: 대시(—...—)로 감싼 부분은 앞 명사를 예시로 풀어주는 삽입이므로 먼저 걷어내면 주어(The main institutions)와
        동사(exhibit)가 이어진다. 삽입을 괄호친 뒤 S+V부터 잡고 나열은 나중에 채워 읽는다.
  apposition:
    point: the fact/idea/belief + that … 또는 'N, N' 콤마 동격 — 앞 명사와 뒤 내용이 '='.
    strategy: the fact that … 의 that은 관계사가 아니라 동격(=내용). '명사 = that절 내용'으로 등호를 긋는다.
    diagram:
      symbol: N = [내용]
      rows:
      - en: the fact that S+V
        ko: ~라는 사실 (사실 = 내용)
      - en: N, (a/the) N,
        ko: 즉, 다시 말해 (같은 대상)
    examples:
    - en: 'When trying to establish what is meant by digital preservation, the first
        question that must be addressed is: what are you?'' actually trying to preserve?'
      src: 2024 고3 6월 31번
      cut: 디지털 보존이 뜻하는 바를 확립하려 할 때 / 반드시 다뤄져야 할 첫 번째 질문은 / (콜론) 당신이 실제로 무엇을 보존하려 하는가이다.
      how: 콜론(:)이 the first question의 내용을 그대로 풀어주는 동격 신호다. 콜론 앞까지 '첫 번째 질문은 ~이다'로
        골격을 잡고, 콜론 뒤 절을 그 질문의 실제 내용으로 등치시켜 읽는다.
    - en: For the physicist, understanding the ordinary, the habitual, and the frequent
        thus allows us to account for the frightening and the singular.
      src: 2024 고3 9월 23번
      cut: 물리학자에게 / 평범한 것·습관적인 것·빈번한 것을 이해하는 것은 / 이렇게 우리에게 / 무서운 것과 특이한 것을 설명하도록 허락한다.
      how: 「the+형용사」가 나란히 놓이면 각각 하나의 명사(부류)로 묶어 읽는다. the ordinary·the habitual·the
        frequent는 understanding의 목적어 묶음, the frightening·the singular는 account for의
        목적어 묶음으로 처리한다.
    - en: When the Industrial Revolution arrived with its great innovation, the motor,
        we didn't leave our world to go to! some remote motorspace!
      src: 2023 고3 11월 30번
      cut: 산업혁명이 그 거대한 혁신, 곧 모터와 함께 도래했을 때 / 우리는 / 어떤 먼 모터공간으로 가려고 / 우리 세계를 떠나지 않았다.
      how: 콤마로 감싼 the motor가 앞의 its great innovation을 '='로 다시 지칭하는 동격이다. '그 거대한 혁신,
        즉 모터'로 앞 명사와 뒤 명사를 같은 것으로 겹쳐 읽는다.
    - en: Roads are there all the time, so their speed is the most important fact
        that distinguishes them.
      src: 2026 고3 11월 23번
      cut: 도로는 항상 거기 있다 / 그래서 그 속도가 / 그것들을 구별 짓는 가장 중요한 사실이다.
      how: the most important fact 뒤의 that distinguishes them은 fact의 내용을 규정하는 관계절이다.
        '가장 중요한 사실 = 그것들을 구별 짓는다'로 fact와 관계절을 뒤에서 앞으로 붙여 읽는다.
  prep_stack:
    point: 수능 문장이 '길고 어려운' 결정적 이유 — 명사 뒤에 전치사구가 '계속' 이어붙기 때문이다. 하나씩 뒤에서 앞으로 붙이면 아무리
      길어도 안 무너진다.
    strategy: 전치사(of/in/for…)를 만날 때마다 '여기서 새 살 시작'으로 끊는다 → 명사 하나가 완성될 때까지 뒤에서 앞으로
      '~의/~에 있는/~을 위한'. 진짜 주어는 맨 앞 명사 하나뿐.
    diagram:
      symbol: N ← of → in → for …
      rows:
      - en: N of N
        ko: ~의 (소유·관련)
      - en: N in / on / at N
        ko: ~에 있는 (장소·범위)
      - en: N for N
        ko: ~을 위한 (목적)
      - en: N with / without N
        ko: ~을 가진 / ~ 없는
      - en: N between / among N
        ko: ~ 사이의
    training:
    - level: ① 쉬움 · 전치사구 1개
      en: the amount [of traffic]
      ko: 교통의 양
    - level: ② 보통 · 2개 연속
      en: the amount [of traffic] [on the highway]
      ko: 고속도로 위 / 교통의 양
    - level: ③ 어려움 · 3개 중첩
      en: the amount [of traffic] [on the highway] [during rush hour]
      ko: 출퇴근 시간 / 고속도로 위 / 교통의 양
    - level: ④ 하드 · 4개+ (주어가 끝없이 길어짐)
      en: the tendency [of people] [in cities] [with limited access] [to public transport]
      ko: 대중교통 이용이 제한된 / 도시의 / 사람들의 / 경향
    examples:
    - en: The amount of traffic on the highway during rush hour has been steadily
        increasing over the years.
      src: 예문(트레이닝)
      cut: 출퇴근 시간 고속도로 위 교통의 양은 / 수년에 걸쳐 / 꾸준히 늘어왔다.
      ab: '교통량 → 늘어남 (뼈대: The amount ~ has increased)'
      how: The amount of traffic on the highway during rush hour처럼 전치사구(of·on·during)가
        층층이 겹쳐 앞 명사 amount를 순서대로 수식한다. 겹친 전치사구를 하나로 묶어 '~의 양'까지가 주어임을 잡고, 동사 has been
        increasing을 찾아 뼈대를 읽는다.
    - en: Last week, I made a reservation for one of your company's swimming pools
        for our summer swim camp.
      src: 2022 고3 6월 18번
      cut: 지난주에 / 저는 예약을 했습니다 / 귀사의 수영장 중 하나를 / 저희 여름 수영 캠프를 위해.
      ab: '나 → 예약함 (뼈대: I made a reservation)'
      how: made a reservation 뒤로 for ~ / for ~ 전치사구가 이어 붙는다. 첫 for은 예약 대상(수영장), 둘째
        for은 목적(캠프)으로 역할을 구분해 순서대로 뒤에 붙여 읽는다.
    - en: Many pedestrians in a city are not necessarily an indication of good city
        quality—many people walking around can often be a sign of insufficient transit
        options or long distances between the various functions in the city.
      src: 2024 고3 9월 33번
      cut: 도시 안의 많은 보행자가 / 반드시 좋은 도시 품질의 지표인 것은 아니다 / 돌아다니는 많은 사람은 / 흔히 불충분한 교통 선택지나
        / 그 도시 안 다양한 기능들 사이의 긴 거리의 / 신호일 수 있다.
      how: a sign 뒤로 of insufficient ~ or long distances → between the various functions
        → in the city처럼 전치사구가 of→between→in으로 층층이 겹친다. 각 전치사구가 바로 앞 명사를 수식함을 짚어 안쪽부터
        순서대로 이어 읽는다.
    - en: A physical carrier is necessary, but as long as the source media can be
        read, bit‑perfect copies can be made cheaply and easily on other devices,
        making the preservation of the original carrier of diminishing importance.
      src: 2024 고3 6월 31번
      cut: 물리적 매체가 필요하다 / 하지만 원본 매체를 읽을 수 있는 한 / 비트 단위로 완벽한 사본이 / 다른 장치에서 값싸고 쉽게 만들어질
        수 있다 / 그리하여 원본 매체의 보존을 점점 줄어드는 중요성을 갖는 것으로 만든다.
      how: making 이하는 결과를 나타내는 분사구문이고, 그 안에서 of가 두 번 겹친다. 앞 of the original carrier는
        preservation을 수식하고, 뒤 of diminishing importance는 make A of B(A를 B한 상태로 만들다)의
        보어를 이끄는 것으로 역할을 갈라 읽는다.
  inversion:
    point: 문두 부정어(Never/Not only/Only…)가 오면 도치된다. 하지만 굳이 원위치로 되돌릴 필요 없다 — 도치된 순서 그대로
      '신호부터 받고' 자연스럽게 이어 읽으면 된다.
    strategy: 문두 부정어를 '거의/결코 ~않다 · ~뿐 아니라 · 오직 ~해서야'로 먼저 받고, 뒤의 '조동사+주어'는 그냥 주어로 이어
      읽는다. 되돌리지 말고 흐르는 대로.
    diagram:
      symbol: 부정어 + V + S → 그대로
      rows:
      - en: Never/Little + aux + S ~
        ko: '''결코/거의 ~않다'' + 이어서 S가 ~'
      - en: Not only A but (also) B
        ko: '''A뿐 아니라'' + 이어서 B도 ~'
      - en: Only + 부사구 + aux + S
        ko: '''오직 ~해서야 비로소'' + S가 ~'
    examples:
    - en: Not only is it less convenient to access locations in cities, but the very
        process generates negative effects.
      src: 2023 고3 6월 24번
      cut: 도시에서 장소에 접근하는 것이 덜 편할 뿐 아니라 / 바로 그 (이동) 과정 자체가 / 부정적 효과를 낳는다.
      ab: 도시 이동 → 불편 + 부작용 (둘 다)
      how: 문두 Not only 때문에 뒤 주어·동사가 도치(is it)된 것을 정상 어순(it is)으로 되돌려 읽는다. 'Not only
        A but (also) B' 구조로 'A뿐 아니라 B도'로 이어 잡는다.
  emphasis:
    point: It is/was X that … 는 X를 부각하는 강조구문. do/does/did + 동사원형은 동사 강조.
    strategy: It is ~ that 사이(X)가 '강조 대상=답'인 경우가 많다. that절이 완전하면 강조(X 부각), 불완전하면 가주어·진주어.
    diagram:
      symbol: It is [X] that ~
      rows:
      - en: It is X that ~
        ko: 바로 X가 ~인 것이다 (X 강조)
      - en: do / does / did + V
        ko: 정말 ~하다 (동사 강조)
    examples:
    - en: Many cultures invented gods to explain these eclipses that shocked, frightened,
        or surprised them; but very few imagined a god of falling bodies—to which
        they were so accustomed that they did not even notice them.
      src: 2024 고3 9월 23번
      cut: 많은 문화가 / 신들을 만들어냈다 / 이 일식들을 설명하려고 / (그들을 충격에 빠뜨리거나 겁주거나 놀라게 한) // 그러나 극소수만이
        / 낙하하는 물체의 신을 상상했다 / — 그것에 너무나 익숙해서 / 알아차리지도 못했다.
      how: so ~ that 강조 구문 '너무 …해서 ~하다'를 찾아 인과로 읽는다. so accustomed가 원인, that they
        did not notice가 결과. to which는 앞 falling bodies를 받는 관계사구로 앞에 붙인다.
    - en: ''' If the baby water flea is developing into an adult in water that includes
        the chemical signatures of creatures that prey ( ) on water fleas, it develops
        a helmet and spines to defend itself against predators.'
      src: 2023 고3 11월 36번
      cut: 만약 새끼 물벼룩이 / 성체로 자라고 있다면 / (물벼룩을 잡아먹는 생물의 화학적 흔적을 담은) 물속에서 // 그것은 / 투구와
        가시를 발달시킨다 / 포식자로부터 자신을 방어하려고.
      how: 문두 If 조건절을 하나의 덩어리로 먼저 닫고, 콤마 뒤 주절 S+V(it develops ~)를 찾는다. it이 앞 the baby
        water flea를 받는다. 두 that절은 각각 water와 creatures를 수식.
    - en: The generally close connection between health and what animals want exists
        because wanting to obtain the right things and wanting to avoid the wrong
        ones are major ways in which animals keep themselves healthy.
      src: 2024 고3 9월 37번
      cut: 건강과 (동물이 원하는 것) 사이의 / 대체로 긴밀한 연결은 / 존재한다 / 왜냐하면 / 옳은 것을 얻으려는 것과 / 그른 것을
        피하려는 것이 / 주된 방식이기 때문에 / (그 안에서 동물이 스스로를 건강하게 유지하는).
      how: 긴 주어(The ~ connection between A and B)를 먼저 닫고 동사 exists를 잡는다. because절이
        원인을 강조하며, in which는 major ways를 수식하는 관계사구.
    - en: By way of example, for many years it was thought that ' there would be "one"
        cure for cancer, but it is now realized that cancer takes multiple forms and
        that multiple approaches are needed to provide a cure.
      src: 2024 고3 11월 38번
      cut: 예로써 / 여러 해 동안 / 생각되었다 / (암에 대한 '하나의' 치료법이 있으리라는 것이) // 그러나 / 이제 깨닫는다 /
        (암이 여러 형태를 띤다는 것과 / 여러 접근이 치료법 제공에 필요하다는 것을).
      how: it은 가주어, that절이 진주어. it was thought that ~ 과 it is now realized that ~
        모두 that절을 뒤로 빼 강조한 구조이므로 it을 비워 두고 that절을 주어로 되살려 읽는다.
  parallel:
    point: and / but / or, not only A but also B, both A and B — 같은 급끼리 대칭으로 묶인다.
    strategy: 접속사 앞뒤로 '같은 모양(품사)'을 손가락으로 짚어 짝을 맞춘다. 짝이 안 맞으면 병렬 대상을 잘못 잡은 것.
    diagram:
      symbol: A ∥ B
      rows:
      - en: A and/or/but B
        ko: A와 B (같은 급)
      - en: not only A but also B
        ko: A뿐 아니라 B도
      - en: both A and B / either A or B
        ko: A와 B 둘 다 / 둘 중 하나
    examples:
    - en: Not only musicians and psychologists, but also committed music enthusiasts
        and experts voice the opinion.
      src: 2022 고3 9월 24번
      cut: 음악가와 심리학자뿐 아니라 / 열성적인 음악 애호가와 전문가도 / 그 의견을 낸다.
      how: not only A but also B 병렬. A(musicians and psychologists)와 B(committed music
        enthusiasts and experts)를 같은 급으로 묶어 둘 다 voice의 주어로 읽는다.
    - en: In both the ancient hunter‑gatherer band and our intimate speech communities
        today, the diffusion of speech shaped values.
      src: 2024 고3 6월 22번
      cut: 옛 수렵채집 무리와 / 오늘날 우리의 친밀한 언어 공동체 둘 다에서 / 말의 확산이 / 가치를 형성했다.
      how: both A and B 병렬. both가 묶는 두 명사구(the ancient ~ band / our ~ communities)를
        대등하게 보고, 그 뒤 주절 S(the diffusion) + V(shaped)를 찾는다.
    - en: ( ) People are framed as bounded social actors either playing the role of
        hosts or guests.
      src: 2024 고3 11월 24번
      cut: 사람들은 / 규정된다 / 경계 지어진 사회적 행위자로 / 주인 역할을 하거나 / 손님 역할을 하는 둘 중 하나로.
      how: either A or B 병렬. either 뒤 playing the role of hosts와 or 뒤 guests를 같은 급으로
        묶어 '둘 중 하나'로 읽는다.
    - en: For many people, their work is both a source of income and of meaning.
      src: 2025 고3 6월 40번
      cut: 많은 이에게 / 그들의 일은 / 수입의 원천이자 / 의미의 원천이다.
      how: both A and B 병렬. of income과 of meaning 두 전치사구가 a source에 대등하게 걸리므로 'A이자
        B'로 나란히 읽는다.
  what_clause:
    point: what 은 선행사를 포함(the thing which). what절 전체가 하나의 명사(주어·목적어·보어)다.
    strategy: what절 전체를 [ ]로 묶어 '~하는 것'이라는 한 덩어리 명사로 취급한다.
    diagram:
      symbol: '[what ~] = 명사'
      rows:
      - en: what S + V
        ko: ~하는 것 (명사 덩어리)
      - en: what matters / what counts
        ko: 중요한 것
    examples:
    - en: A compelling argument can be made that what fans love is less the object
        of their fandom than the attachments to ( ) (and differentiations from) one
        another that those affections afford.
      src: 2022 고3 9월 32번
      cut: 설득력 있는 주장이 / 성립될 수 있다 / (팬들이 사랑하는 것은 / 그들이 열광하는 대상이라기보다 / 오히려 서로에 대한 애착(그리고
        서로로부터의 차별화)이라는 것이) / 그 애정이 제공하는.
      how: what fans love를 '~하는 것'이라는 하나의 명사절 주어로 묶는다. 이 절은 주장 내용을 이끄는 that절 안의 주어이며,
        less A than B는 'A라기보다 B'로 읽는다.
    - en: One of the factors determining the use of technologies of communication
        will be the kinds of investments made in equipment and personnel; who makes
        them, and what they expect in return.
      src: 2024 고3 9월 32번
      cut: 통신 기술의 사용을 결정하는 요인 중 하나는 / 장비와 인력에 투입되는 투자의 종류일 것이다 / 즉 누가 그 투자를 하는가 /
        그리고 (그들이 대가로 기대하는 것).
      how: what they expect in return을 '~하는 것'이라는 명사절로 묶어, 앞의 who makes them(의문사절)과
        대등하게 나란히 놓인 것으로 읽는다.
    - en: She had her own ideas like any patron, there were no fashion plates, and
        the tailor was simply at her service, perhaps with helpful suggestions about
        what others were wearing.
      src: 2022 고3 9월 33번
      cut: 그녀는 어떤 후원자처럼 자기 생각이 있었고 / 패션 도안집은 없었으며 / 재단사는 그저 그녀를 위해 대기했다 / 아마 (다른 이들이
        무엇을 입고 있는지에 관한) 유용한 제안과 함께.
      how: what others were wearing을 하나의 명사절로 묶어 전치사 about의 목적어로 읽는다. what은 '무엇을 ~하는지/~하는
        것'으로 처리.
    - en: In fact, what we might now call "shadow studies"—the exploration of shadows
        in their various artistic representations—has its roots in ancient Athens.
      src: 2024 고3 6월 24번
      cut: 사실 / (우리가 이제 '그림자 연구'라 부를 만한 것)은 / —즉 다양한 예술적 표현 속 그림자에 대한 탐구— / 고대 아테네에
        그 뿌리를 둔다.
      how: what we might now call ... 을 통째로 주어 명사절로 묶고, 대시로 삽입된 동격 설명을 걷어낸 뒤 동사 has를
        찾는다. call A B(A를 B라 부르다)의 목적어 자리가 what.
  that_clause:
    point: 인식·전달 동사 + that S+V 는 '~라는 것을'. 접속사 that 뒤엔 완전한 문장이 온다(관계사 that과 구분).
    strategy: that절 전체를 목적어인 '한 문장(명사절)'으로 묶어 '~라는 것을'로 뒤에 붙인다.
    diagram:
      symbol: '[that S+V] = 명사절'
      rows:
      - en: V that S + V
        ko: ~라는 것을 (목적어절)
      - en: the N that S+V
        ko: 동격/관계 — 뒤 문장이 완전한가로 구분
    examples:
    - en: To the extent that an agent relies on the prior knowledge of its designer
        rather than on its own percepts, we say that the agent lacks autonomy.
      src: 2023 고3 6월 30번
      cut: 에이전트가 자신의 지각이 아니라 / 설계자의 사전 지식에 의존하는 만큼 / 우리는 말한다 / (그 에이전트가 자율성이 없다고).
      how: 앞 that은 the extent를 받는 부사절(To the extent that ~ '~하는 만큼'), 뒤 that은 say의
        목적어 명사절이다. 두 that의 역할을 갈라 읽고 rather than은 '~가 아니라'로 처리.
    - en: In a hiring negotiation, a job applicant who assumes that salary is the
        only issue may insist on $75,000 when the employer is offering $70,000.
      src: 2023 고3 6월 42번
      cut: 채용 협상에서 / 구직자는 / (급여가 유일한 쟁점이라고 가정하는) / 75,000달러를 고집할 수 있다 / 고용주가 70,000달러를
        제시할 때.
      how: that salary is the only issue는 assumes의 목적어 명사절. 주어 a job applicant를 who절이
        수식하므로 진짜 주절 동사가 may insist임을 놓치지 않는다.
    - en: Although we'd like to think that our minds are sharp enough to always make
        good decisions with the greatest efficiency, they just aren't.
      src: 2024 고3 11월 35번
      cut: 비록 우리는 생각하고 싶지만 / (우리의 정신이 / 늘 최고 효율로 좋은 결정을 내릴 만큼 / 충분히 예리하다고) / 그것은 그저
        그렇지 않다.
      how: that절은 think의 목적어 명사절이고 전체는 Although 양보절이다. sharp enough to ~ '~할 만큼 충분히
        예리한'으로 읽고, 주절 they just aren't로 반전을 잡는다.
    - en: A hypothesis called the Mach band theory suggests that moths see a dark
        area around a light source and head for it to escape the light.
      src: 2024 고3 9월 31번
      cut: 마흐 밴드 이론이라 불리는 가설은 / 시사한다 / (나방이 광원 주위의 어두운 영역을 보고 / 그리로 향한다는 것을) / 빛을
        피하려고.
      how: that절은 suggests의 목적어 명사절. 절 안에서 see와 head가 and로 병렬된 두 동사임을 잡고, 주어 A hypothesis를
        called 분사구가 수식한다.
