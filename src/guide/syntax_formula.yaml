parts:
- id: modifier
  title: 수식어 괄호치기 구문
  subtitle: 뼈대를 숨기는 살(수식어) 걷어내기
  strategy: 명사 뒤 덩어리는 통째로 괄호 → 주어+동사(뼈대)부터 읽는다.
  types:
  - wh_clause
  - participle
  - insertion
  - apposition
  - prep_stack
- id: nounclause
  title: 명사절 묶기 구문
  subtitle: 절을 통째 [한 덩어리 명사]로 묶어 주어·목적어 자리에 넣기
  strategy: what/that절은 건너뛰는 '살'이 아니라 '뼈대'다 — 절 전체를 [ ]로 묶어 하나의 명사(주어·목적어·보어)로 취급한다.
  types:
  - what_clause
  - that_clause
- id: order
  title: 어순·구조 특이구문
  subtitle: 자리가 바뀌어도 자연스럽게 해석하기
  strategy: 자리가 바뀐 채로도 신호만 잡으면 자연스럽게 읽힌다 — 굳이 원위치로 되돌리지 않아도 된다.
  types:
  - inversion
  - emphasis
  - parallel
- id: signal
  title: 비교·as 신호 구문
  subtitle: as·비교급 = 'A와 B의 동등·우열'을 강조하는 신호
  strategy: as는 뒤를 보고 판별(명사→전치사, S+V→접속사)하고, 비교표현은 '강조'로 읽어 필자가 무엇을 동등·우열로 보는지 잡는다.
  types:
  - as_compare
formulas:
  wh_clause:
    point: who/which/that/where/when/why/how 가 명사를 꾸미거나(관계사) 명사절을 만든다.
    strategy: wh- 앞에 명사가 있으면 '~하는'(수식), 없으면 '누가/어디/왜 ~하는지'(명사절). 어느 쪽이든 wh~끝까지 통째
      괄호, 앞 명사만 뼈대.
    diagram:
      symbol: N ← [wh ~]
      rows:
      - en: N + who/which/that + V
        ko: ~하는 (앞 명사를 수식)
      - en: wh + S + V
        ko: 누가/어디/왜 ~하는지 (명사절)
    examples:
    - en: Consider two athletes who both want to play in college.
      src: 2022 고3 6월 20번
      cut: 생각해 보라 / 두 선수를 / [둘 다 대학에서 뛰고 싶어하는].
      how: who로 시작하면? 바로 앞 명사부터 붙잡으세요. two athletes를 먼저 세우고 who절을 뒤에서 얹어 '~하는 선수'로
        읽습니다.
      catch: 대학 무대에서 뛰고 싶은 두 선수. 딱 그 조건을 가진 둘을 떠올려 보라는 얘기.
    - en: Alternatively, parents who supply reasons, show an emotional understanding
        of difficulties overcoming problems, and use a minimum of external incentives
        are more likely to cultivate a sense of willingness and value for work in
        their child.
      src: 2024 고3 6월 30번
      cut: 그 대신에 / 부모는 [이유를 제시하고, 어려움을 극복하는 데 대한 정서적 이해를 보이며, 외적 유인은 최소로 쓰는] / 자녀에게
        일에 대한 의욕과 가치를 길러 줄 가능성이 더 크다.
      how: who가 supply·show·use 세 동사를 몽땅 끌고 parents에 매달려요. 이 긴 덩어리는 통째로 괄호 치고, 진짜
        동사 are부터 찾으세요.
      catch: 이유를 대고, 어려움을 정서적으로 이해하고, 유인은 최소로. 이런 부모라야 자녀의 의욕과 가치를 키운다.
    - en: The critic who wants to write about literature from a formalist perspective
        must first be a close and careful reader who examines all the elements of
        a text individually and questions how they come together to create a work
        of art.
      src: 2022 고3 6월 32번
      cut: 그 비평가는 [형식주의 관점에서 문학에 관해 쓰고 싶어 하는] / 먼저 꼼꼼하고 신중한 독자여야 한다 / [텍스트의 모든 요소를
        개별적으로 검토하고 / 그것들이 어떻게 결합해 예술 작품을 만드는지 묻는].
      how: who가 두 번. 하나는 critic, 하나는 reader에 각각 붙습니다. how they~는 questions가 받는 목적어절로
        떼어 처리.
      catch: 형식주의 비평가는 우선 꼼꼼한 독자여야 한다. 요소 하나하나를 뜯어보는 사람 말이다.
    - en: Technical mobilities turn human beings into some kind of terminal creatures,
        who spend most of their time at rest ( ) and who need to participate in sports
        in order to balance their daily disproportion of motion and rest.
      src: 2022 고3 6월 40번
      cut: 기술적 이동 수단은 / 인간을 일종의 종착역 같은 존재로 바꾼다 / [대부분의 시간을 쉬며 보내고 / 또 하루의 운동·휴식 불균형을
        맞추기 위해 스포츠에 참여할 필요가 있는].
      how: 콤마 뒤 who는 앞을 죽 이어 설명하는 계속적 용법. and who로 묶인 두 절을 '~하고, 또 ~하는'으로 매끄럽게 이으세요.
      catch: 기술적 이동수단이 인간을 어떤 존재로 바꾸나. 쉬기만 하다 균형 맞추려 스포츠가 필요해진 존재로.
    coach: "▸ <b>앞에 명사 있나 없나</b> — 그것만 봐요. 있으면 → <b>‘~하는’(수식)</b>, 없으면 → <b>명사절(‘~하는지’)</b>.<br>▸ 명사절이면 <b>동사까지 밀고 가</b> ‘~하는지’로 받기.<br>▸ 관계사절 — <b>콤마 없으면 반드시 해석</b>, <b>콤마 있으면 부연</b>(가볍게).<br>▸ 선행사가 뻔하면 → <b>those (people) who~</b>처럼 생략."
  participle:
    point: 문두·콤마 뒤 V-ing / V-ed 덩어리는 '부대상황'. 주절의 동작에 곁들여지는 살이다.
    strategy: 분사 덩어리를 통째 괄호 → 주절 뼈대부터 읽고, ~하면서 / ~한 채로 / ~해서로 붙인다. 분사의 의미상 주어=주절 주어.
    diagram:
      symbol: 주절 + (분사)
      rows:
      - en: V-ing ~,
        ko: ~하면서 / ~해서 (능동)
      - en: (being) V-ed ~,
        ko: ~된 채로 / ~되어 (수동)
      - en: Having p.p. ~,
        ko: ~하고 나서 (완료)
    examples:
    - en: Recognizing how she felt about her failure, Ken approached her and said
        a few encouraging words.
      src: 2023 고3 11월 19번
      cut: (그녀가 자신의 실패를 어떻게 느끼는지 알아채고서) / Ken이 그녀에게 다가가 / 몇 마디 격려의 말을 건넸다.
      how: 콤마 앞 -ing가 보이면 뒤 주절부터. Ken approached가 뼈대고, Recognizing~은 '~하고서'로 앞에 붙이면
        끝.
      catch: 움직인 사람은 Ken. 실패로 힘겨워하는 그녀 마음을 읽고 다가가 격려를 건넨 겁니다.
    - en: Seeing vivid red and green colors for the first time ever, he started to
        cry.
      src: 2023 고3 11월 45번
      cut: (생생한 빨강과 초록 색을 난생처음으로 보고서) / 그는 / 울기 시작했다.
      how: Seeing~은 분사구문. 주어는 뒤 he입니다. he started를 먼저 세우고 '~하고서'로 앞머리를 끼워 넣으세요.
      catch: 빨강과 초록을 난생처음 본 그 순간, 그가 울음을 터뜨렸다. 첫 색채의 감격이 눈물이 된 장면.
    - en: Surveying office spaces from the past eighty years, one can see a cycle
        that repeats.
      src: 2024 고3 9월 24번
      cut: (지난 80년의 사무 공간을 훑어보면) / 우리는 / 반복되는 하나의 순환을 볼 수 있다.
      how: Surveying~은 조건처럼 쓰인 분사구문. 주절 one can see를 잡고 이 구는 '~해 보면'으로 풀어 얹습니다.
      catch: 지난 80년 사무공간을 훑으면 보이는 것 하나. 되풀이되는 순환입니다.
    - en: The moths, attempting to escape the light, fly toward that imagined "portal,"
        bringing them closer to the source.
      src: 2024 고3 9월 31번
      cut: 나방은, (빛에서 벗어나려 애쓰며), / 그 상상된 '통로'를 향해 날아간다 / (그리하여 광원에 더 가까워진다).
      how: 콤마 사이 attempting~에 낚이지 마세요. 주어 moths를 감싼 분사구일 뿐. 주절은 moths fly, 이 부분은 '~하며'로.
      catch: 빛에서 벗어나려던 나방이 되레 광원 코앞까지 간다. 이 역설을 놓치면 안 됩니다.
    coach: "▸ <b>이게 분사구문 맞나?</b> — 문두·콤마 뒤 V-ing/V-ed가 주어가 아니고, 뒤에 진짜 주어·동사(주절)가 따로 있으면 → 분사구문. (주어 자리면 → <b>동명사</b>!)<br>▸ <b>의미상 주어 = 언제나 주절 주어.</b> 앞 명사에 낚이지 마요.<br>▸ <b>도치와 구별</b> — 형용사·분사로 시작 → 뒤에 진짜 동사 없으면 분사구문, 있으면 도치(<i>Enclosed is a copy…</i>).<br>▸ 분사구문은 <b>배경·부연(가벼운 살)</b> — 생략된 접속사 굳이 유추 X."
  insertion:
    point: — … — / , which / 콤마 사이에 부가 설명이 끼어든다. 뼈대가 아니라 곁다리.
    strategy: 대시·콤마 삽입을 통째 괄호치고 없는 셈 → 뼈대부터 읽는다. 삽입을 빼도 문장이 성립하면 제대로 괄호친 것.
    diagram:
      symbol: S …(삽입)… V
      rows:
      - en: S — … — V
        ko: 대시 사이 = 부가 설명 (건너뜀)
      - en: N, which ~,
        ko: 앞 문장·명사를 보충 설명
      - en: N, a/the N, ~
        ko: 콤마 동격 (= 같은 대상)
    examples:
    - en: For the present generation of artists, the computer, or more appropriately,
        the laptop, is one tool.
      src: 2022 고3 6월 31번
      cut: 요즘 세대 예술가에게 / 컴퓨터는, 더 정확히는 노트북은, / 하나의 도구다.
      how: more appropriately~는 콤마로 잠깐 끼워 넣은 군더더기. 걷어내 보세요. the computer is one tool,
        뼈대가 툭 드러납니다.
      catch: 삽입을 지우면 남는 문장은 하나. 컴퓨터, 정확히는 노트북이 하나의 도구라는 것.
    - en: Whatever the nature of the outcome, which may actually favour one party
        more than another, the purpose of negotiation is the identification of areas
        of common interest and conflict.
      src: 2024 고3 11월 36번
      cut: 결과의 성격이 무엇이든 간에 / (실제로 어느 한쪽을 다른 쪽보다 유리하게 할 수도 있지만) / 협상의 목적은 / 공통 관심사와
        갈등의 영역을 확인하는 것이다.
      how: which~another를 괄호 치듯 들어내세요. 그러면 주어 purpose와 동사 is, 보어가 나란히 이어집니다.
      catch: 결과가 한쪽에 유리하든 말든, 협상이 노리는 건 공통 관심사와 갈등 지점을 짚어내는 일.
    - en: The main institutions of state—parliament, courts, police and so on—along
        with certain of the professions, exhibit this formal character.
      src: 2023 고3 6월 38번
      cut: 국가의 주요 제도들은 / —의회·법원·경찰 등— / 특정 전문직들과 더불어 / 이 공식적 성격을 드러낸다.
      how: 대시로 감싼 parliament·courts·police 나열은 예시 삽입. 건너뛰면 institutions와 exhibit가
        곧장 만납니다.
      catch: 삽입된 의회·법원·경찰을 빼면? 국가의 주요 제도들이 이 공식적 성격을 드러낸다, 이게 골자.
    - en: No offices or factories need to be built, no local regulations are observed,
        and—in most cases—no local taxes are paid.
      src: 2026 고3 11월 21번
      cut: 어떤 사무실도 공장도 지어질 필요가 없고 / 어떤 지역 규제도 준수되지 않으며 / (대부분의 경우) / 어떤 지역 세금도 납부되지
        않는다.
      how: in most cases는 대시 두 개로 끼운 삽입. 지우면 no local taxes are paid만 깔끔히 남습니다.
      catch: 사무실도 안 짓고, 규제도 안 지키고, 지역세도 안 낸다. 세 개의 부정이 줄지어 서 있는 문장.
    coach: "▸ <b>콤마 둘 · 대시 둘</b>이 보이면 → 손으로 가려 봐요.<br>▸ 가리고도 말이 되면 → <b>그게 뼈대</b>. 삽입은 맨 나중에 껴 넣기."
  apposition:
    point: the fact/idea/belief + that … 또는 'N, N' 콤마 동격 — 앞 명사와 뒤 내용이 '='.
    strategy: the fact that … 의 that은 관계사가 아니라 동격(=내용). '명사 = that절 내용'으로 등호를 긋는다.
    diagram:
      symbol: N = [내용]
      rows:
      - en: the fact that S+V
        ko: ~라는 사실 (사실 = 내용)
      - en: N, (a/the) N,
        ko: 즉, 다시 말해 (같은 대상)
    examples:
    - en: 'When trying to establish what is meant by digital preservation, the first
        question that must be addressed is: what are you?'' actually trying to preserve?'
      src: 2024 고3 6월 31번
      cut: 디지털 보존이 뜻하는 바를 확립하려 할 때 / 반드시 다뤄져야 할 첫 번째 질문은 / (콜론) 당신이 실제로 무엇을 보존하려 하는가이다.
      how: 콜론 뒤가 the first question의 정체를 풀어 줍니다. 콜론 앞뒤를 같은 것으로 포개어 읽으세요.
      catch: 그 첫 질문의 알맹이는 콜론 뒤. '정말로 무엇을 보존하려는가'가 곧 그 질문.
    - en: When the Industrial Revolution arrived with its great innovation, the motor,
        we didn't leave our world to go to! some remote motorspace!
      src: 2023 고3 11월 30번
      cut: 산업혁명이 그 거대한 혁신, 곧 모터와 함께 도래했을 때 / 우리는 / 어떤 먼 모터공간으로 가려고 / 우리 세계를 떠나지 않았다.
      how: 콤마로 낀 the motor는 앞 its great innovation과 같은 대상. '그 혁신, 곧 모터'로 등호처럼 겹치세요.
      catch: 거대한 혁신이 바로 모터라는 동격. 모터가 왔어도 우리는 세상을 떠나 딴 공간으로 가지 않았다.
    coach: "▸ ‘<b>명사, 명사</b>’ 또는 ‘<b>명사 + that절</b>’ → <b>‘=’</b>를 떠올려요(뒤가 앞을 다시 풂). 새 정보 아님.<br>▸ <b>콤마+관계사(, which)</b>도 같은 식구 — 앞 명사를 이미 알면 <b>건너뛰어도</b> OK, 때론 <b>앞 문장 전체</b>를 받아요."
  prep_stack:
    point: 수능 문장이 '길고 어려운' 결정적 이유 — 명사 뒤에 전치사구가 '계속' 이어붙기 때문이다. 하나씩 뒤에서 앞으로 붙이면 아무리
      길어도 안 무너진다.
    strategy: 전치사(of/in/for…)를 만날 때마다 '여기서 새 살 시작'으로 끊는다 → 명사 하나가 완성될 때까지 뒤에서 앞으로
      '~의/~에 있는/~을 위한'. 진짜 주어는 맨 앞 명사 하나뿐.
    diagram:
      symbol: N ← of → in → for …
      rows:
      - en: N of N
        ko: ~의 (소유·관련)
      - en: N in / on / at N
        ko: ~에 있는 (장소·범위)
      - en: N for N
        ko: ~을 위한 (목적)
      - en: N with / without N
        ko: ~을 가진 / ~ 없는
      - en: N between / among N
        ko: ~ 사이의
    training:
    - level: ① 쉬움 · 전치사구 1개
      en: the amount [of traffic]
      ko: 교통의 양
    - level: ② 보통 · 2개 연속
      en: the amount [of traffic] [on the highway]
      ko: 고속도로 위 / 교통의 양
    - level: ③ 어려움 · 3개 중첩
      en: the amount [of traffic] [on the highway] [during rush hour]
      ko: 출퇴근 시간 / 고속도로 위 / 교통의 양
    - level: ④ 하드 · 4개+ (주어가 끝없이 길어짐)
      en: the tendency [of people] [in cities] [with limited access] [to public transport]
      ko: 대중교통 이용이 제한된 / 도시의 / 사람들의 / 경향
    examples:
    - en: The amount of traffic on the highway during rush hour has been steadily
        increasing over the years.
      src: 예문(트레이닝)
      cut: 출퇴근 시간 고속도로 위 교통의 양은 / 수년에 걸쳐 / 꾸준히 늘어왔다.
      how: of·on·during가 주어를 층층이 늘려 놨네요. '~의 양(amount)'까지 한 덩어리로 묶고 동사 has been increasing으로
        넘어가세요.
      catch: 길게 늘어진 주어의 알맹이는 '교통량' 하나. 그게 수년째 꾸준히 불어났다는 말.
    - en: Many pedestrians in a city are not necessarily an indication of good city
        quality—many people walking around can often be a sign of insufficient transit
        options or long distances between the various functions in the city.
      src: 2024 고3 9월 33번
      cut: 도시 안의 많은 보행자가 / 반드시 좋은 도시 품질의 지표인 것은 아니다 / 돌아다니는 많은 사람은 / 흔히 불충분한 교통 선택지나
        / 그 도시 안 다양한 기능들 사이의 긴 거리의 / 신호일 수 있다.
      how: a sign 뒤로 of·between·in이 줄줄이. 각 전치사구는 바로 앞 명사를 꾸미니 앞에서 뒤로 차례차례 이으면 됩니다.
      catch: 보행자가 많다고 좋은 도시는 아니다. 되레 교통편 부족이나 먼 거리를 알리는 신호일 수도.
    - en: But, in fact, the moral questions of taxation are at the very heart of the
        creation of tax laws.
      src: 2022 고3 9월 22번
      cut: 하지만 사실 / 과세의 도덕적 문제들은 / 바로 그 핵심에 있다 / 세법 제정의.
      how: of가 계속 반복되죠. questions, heart, creation 순으로 각 of를 바로 앞 명사에 착착 붙이면 술술 풀립니다.
      catch: 과세의 도덕적 문제, 그게 세법을 만드는 일의 정중앙에 놓여 있다.
    - en: The studied nonchalance of patients in a dentist's waiting room is a poor
        indication of their inner anxiety.
      src: 2022 고3 6월 42번
      cut: 짐짓 태연한 척함은 / 환자들의 / 치과 대기실 안 / 서투른 지표다 / 그들의 내적 불안의.
      how: of 전치사구가 nonchalance에 겹겹이 매달려요. 수식을 앞 명사에 차곡차곡 쌓아 주어 덩어리를 끝까지 밀고 가세요.
      catch: 짐짓 태연한 척, 그게 오히려 환자 속 불안을 드러내는 서툰 지표라는 말.
    coach: "▸ of·in·for가 줄줄이? → 전부 <b>앞 명사 꾸미기</b>일 뿐.<br>▸ <b>진짜 동사 하나</b>만 찾으면 → 문장이 순식간에 짧아져요."
  inversion:
    point: 문두 부정어(Never/Not only/Only…)나 보어·장소부사가 앞으로 나오면 어순이 도치된다.
    strategy: 문두 부정어를 '거의/결코 ~않다 · ~뿐 아니라 · 오직 ~해서야'로 먼저 받고, 뒤의 '조동사+주어'는 그냥 주어로 이어
      읽는다. 되돌리지 말고 흐르는 대로.
    diagram:
      symbol: 부정어 + V + S → 그대로
      rows:
      - en: Never/Little + aux + S ~
        ko: '''결코/거의 ~않다'' + 이어서 S가 ~'
      - en: Not only A but (also) B
        ko: '''A뿐 아니라'' + 이어서 B도 ~'
      - en: Only + 부사구 + aux + S
        ko: '''오직 ~해서야 비로소'' + S가 ~'
    examples:
    - en: Not only is it less convenient to access locations in cities, but the very
        process generates negative effects.
      src: 2023 고3 6월 24번
      cut: 도시에서 장소에 접근하는 것이 덜 편할 뿐 아니라 / 바로 그 (이동) 과정 자체가 / 부정적 효과를 낳는다.
      how: Not only이 앞에 나오면 뒤는 무조건 도치. 되돌리지 말고 'A뿐 아니라'로 신호부터 받고, is it은 그냥 주어(it)로 이어 'B도 ~'로 앞으로 읽으세요.
      catch: 덜 편한 것도 문제지만, 그 이동 과정 자체가 부정적 효과까지 낳는다.
    coach: "▸ <b>Not·Never·Only</b>가 맨 앞 → ‘뒤집히겠구나’ 각오. 도치는 <b>예고된 신호</b>(놀랄 일 X).<br>▸ 부정어 말고도 <b>보어(형용사)·장소부사</b>가 앞으로 나가면 도치(<i>In the darkness was heard a kiss</i>)."
  emphasis:
    point: It is/was X that … 는 X를 부각하는 강조구문. do/does/did + 동사원형은 동사 강조.
    strategy: It is ~ that 사이(X)가 '강조 대상=답'인 경우가 많다. that절이 완전하면 강조(X 부각), 불완전하면 관계사(앞 명사 수식).
    diagram:
      symbol: It is [X] that ~
      rows:
      - en: It is X that ~
        ko: 바로 X가 ~인 것이다 (X 강조)
      - en: do / does / did + V
        ko: 정말 ~하다 (동사 강조)
    examples:
    - en: However, the emotional states themselves are likely to be quite invariant
        across cultures.
      src: 2022 고3 6월 23번
      cut: 그러나 / 감정 상태 그 자체는 / 문화 전반에 걸쳐 / 상당히 변하지 않을 가능성이 크다.
      how: themselves는 앞의 감정 상태를 되받아 '바로 그 자체'로 힘주는 말. 그 명사를 콕 찍어 읽으면 끝.
      catch: 감정 상태 그 자체는 문화가 달라져도 거의 변하지 않는다.
    - en: Apart from demonstrating that evolution did occur, the fossil record also
        provides tests of the predictions made from evolutionary theory.
      src: 2022 고3 6월 36번
      cut: 진화가 실제로 일어났음을 보여 주는 것 외에도 / 화석 기록은 또한 / 진화론에서 도출된 예측들의 검증을 / 제공한다.
      how: did occur의 did, 뭘까요? 뒤 동사에 힘을 싣는 강조사입니다. '정말로 일어났다'로 살려 읽어요.
      catch: 화석 기록은 진화가 실제로 일어났음을 넘어, 진화론 예측까지 검증해 준다.
    - en: Beginning in the late nineteenth century, with the hugely successful rise
        of the artistic male couturier, it was the designer who became celebrated,
        and the client elevated by his inspired attention.
      src: 2022 고3 9월 33번
      cut: 19세기 후반부터 / 예술가적 남성 재단사의 크게 성공적인 부상과 함께 / 유명해진 것은 바로 그 디자이너였고 / 고객은 그의
        영감 어린 관심으로 격상되었다.
      how: It was ~ who 사이에 낀 말이 진짜 주인공. 여기선 the designer를 '바로 그가'로 부각해 읽습니다.
      catch: 주역이 뒤집혔다. 유명해진 쪽은 디자이너, 고객은 그 관심에 격상됐을 뿐.
    coach: "▸ <b>It ~ that</b> 사이에 낀 게 진짜 강조하려는 말 — 가주어 it과 혼동 X.<br>▸ <b>do/does/did + 동사원형</b>도 강조 — <i>I do like you</i> = ‘정말 좋아한다’.<br>▸ <b>What/All you have to do is ~</b>도 ‘is + 강조 대상’으로 콕 집어 줘요."
  parallel:
    point: and / but / or, not only A but also B, both A and B — 같은 급끼리 대칭으로 묶인다.
    strategy: 접속사 앞뒤로 '같은 모양(품사)'을 손가락으로 짚어 짝을 맞춘다. 짝이 안 맞으면 병렬 대상을 잘못 잡은 것.
    diagram:
      symbol: A ∥ B
      rows:
      - en: A and/or/but B
        ko: A와 B (같은 급)
      - en: not only A but also B
        ko: A뿐 아니라 B도
      - en: both A and B / either A or B
        ko: A와 B 둘 다 / 둘 중 하나
    examples:
    - en: Not only musicians and psychologists, but also committed music enthusiasts
        and experts voice the opinion.
      src: 2022 고3 9월 24번
      cut: 음악가와 심리학자뿐 아니라 / 열성적인 음악 애호가와 전문가도 / 그 의견을 낸다.
      how: not only A but also B는 A와 B를 같은 급으로 묶는 짝. 두 명사구를 나란히 놓고 둘 다 voice의 주어로.
      catch: 음악가·심리학자는 물론 애호가·전문가까지 한목소리로 그 의견을 낸다.
    - en: In both the ancient hunter‑gatherer band and our intimate speech communities
        today, the diffusion of speech shaped values.
      src: 2024 고3 6월 22번
      cut: 옛 수렵채집 무리와 / 오늘날 우리의 친밀한 언어 공동체 둘 다에서 / 말의 확산이 / 가치를 형성했다.
      how: both A and B, 두 덩어리를 대등하게 묶습니다. 이 둘을 세운 뒤 진짜 주어 diffusion과 동사 shaped를 찾으세요.
      catch: 옛 수렵채집 무리든 오늘의 언어 공동체든, 말의 확산이 가치를 빚어냈다.
    - en: ( ) People are framed as bounded social actors either playing the role of
        hosts or guests.
      src: 2024 고3 11월 24번
      cut: 사람들은 / 규정된다 / 경계 지어진 사회적 행위자로 / 주인 역할을 하거나 / 손님 역할을 하는 둘 중 하나로.
      how: either A or B, 둘 중 하나라는 뜻. playing~hosts와 guests를 같은 저울에 올려 읽어요. 주인 아니면
        손님.
      catch: 주인이거나 손님이거나 — 사람은 둘 중 한 역할의 행위자로 그려진다.
    - en: For many people, their work is both a source of income and of meaning.
      src: 2025 고3 6월 40번
      cut: 많은 이에게 / 그들의 일은 / 수입의 원천이자 / 의미의 원천이다.
      how: 여기 both A and B는 of income과 of meaning을 나란히 묶어요. 둘 다 source에 걸리니 'A이자 B'로.
      catch: 일이란 수입의 원천인 동시에 의미의 원천 — 어느 한쪽 아닌 둘 다다.
    coach: "▸ <b>and·or·but</b>이 보이면 → <b>앞뒤 짝(같은 급)</b>을 맞춰요.<br>▸ 짝이 안 맞으면 → <b>끊는 지점</b>을 잘못 잡은 것."
  what_clause:
    point: what 은 선행사를 포함(the thing which). what절 전체가 하나의 명사(주어·목적어·보어)다.
    strategy: what절 전체를 [ ]로 묶어 '~하는 것'이라는 한 덩어리 명사로 취급한다.
    diagram:
      symbol: '[what ~] = 명사'
      rows:
      - en: what S + V
        ko: ~하는 것 (명사 덩어리)
      - en: what matters / what counts
        ko: 중요한 것
    examples:
    - en: A compelling argument can be made that what fans love is less the object
        of their fandom than the attachments to ( ) (and differentiations from) one
        another that those affections afford.
      src: 2022 고3 9월 32번
      cut: 설득력 있는 주장이 / 성립될 수 있다 / (팬들이 사랑하는 것은 / 그들이 열광하는 대상이라기보다 / 오히려 서로에 대한 애착(그리고
        서로로부터의 차별화)이라는 것이) / 그 애정이 제공하는.
      how: what fans love는 '팬이 사랑하는 것'이란 명사절 주어. 뒤의 less A than B는 'A라기보다 B'로 잡으면
        술술.
      catch: 팬이 진짜 사랑하는 건 열광 대상이 아니라 서로에 대한 애착 쪽이다.
    - en: One of the factors determining the use of technologies of communication
        will be the kinds of investments made in equipment and personnel; who makes
        them, and what they expect in return.
      src: 2024 고3 9월 32번
      cut: 통신 기술의 사용을 결정하는 요인 중 하나는 / 장비와 인력에 투입되는 투자의 종류일 것이다 / 즉 누가 그 투자를 하는가 /
        그리고 (그들이 대가로 기대하는 것).
      how: what they expect도 '~하는 것' 명사절. 앞의 who makes them과 짝을 이루니 나란히 이어 읽어요.
      catch: 통신 기술 사용을 가르는 건 투자의 종류 — 누가 하고, 대가로 뭘 바라느냐.
    - en: She had her own ideas like any patron, there were no fashion plates, and
        the tailor was simply at her service, perhaps with helpful suggestions about
        what others were wearing.
      src: 2022 고3 9월 33번
      cut: 그녀는 어떤 후원자처럼 자기 생각이 있었고 / 패션 도안집은 없었으며 / 재단사는 그저 그녀를 위해 대기했다 / 아마 (다른 이들이
        무엇을 입고 있는지에 관한) 유용한 제안과 함께.
      how: what others were wearing은 '남들이 뭘 입는지'로 통째 묶이는 명사절. 그대로 about의 목적어로 넣으세요.
      catch: 재단사는 그저 대기했고, 남들이 뭘 입는지 귀띔만 얹었을 뿐.
    - en: In fact, what we might now call "shadow studies"—the exploration of shadows
        in their various artistic representations—has its roots in ancient Athens.
      src: 2024 고3 6월 24번
      cut: 사실 / (우리가 이제 '그림자 연구'라 부를 만한 것)은 / —즉 다양한 예술적 표현 속 그림자에 대한 탐구— / 고대 아테네에
        그 뿌리를 둔다.
      how: what we might now call~은 '~라 부를 만한 것' 주어절. 대시 사이 동격을 걷어내면 곧장 has가 나옵니다.
      catch: '''그림자 연구''라 할 만한 것의 뿌리가 실은 고대 아테네에 닿아 있다.'
    coach: "▸ 뒤 문장에서 <b>한 자리(주어·목적어)가 비면</b> → 거기가 what이 채운 자리.<br>▸ <b>‘~하는 것’(관계대명사)</b>이든 <b>‘무엇을 ~하는지’(의문사)</b>든 <b>뜻은 거의 같아요</b> — 자연스러운 쪽으로."
  that_clause:
    point: 인식·전달 동사 + that S+V 는 '~라는 것을'. 접속사 that 뒤엔 완전한 문장이 온다(관계사 that과 구분).
    strategy: that절 전체를 목적어인 '한 문장(명사절)'으로 묶어 '~라는 것을'로 뒤에 붙인다.
    diagram:
      symbol: '[that S+V] = 명사절'
      rows:
      - en: V that S + V
        ko: ~라는 것을 (목적어절)
      - en: the N that S+V
        ko: 동격/관계 — 뒤 문장이 완전한가로 구분
    examples:
    - en: To the extent that an agent relies on the prior knowledge of its designer
        rather than on its own percepts, we say that the agent lacks autonomy.
      src: 2023 고3 6월 30번
      cut: 에이전트가 자신의 지각이 아니라 / 설계자의 사전 지식에 의존하는 만큼 / 우리는 말한다 / (그 에이전트가 자율성이 없다고).
      how: that이 둘. 앞 that은 extent를 받는 부사절, 뒤 that은 say의 목적어절. 역할을 갈라 두면 안 꼬여요.
      catch: 제 지각 대신 설계자 지식에 기댈수록, 그 에이전트는 자율성이 없다고 본다.
    - en: In a hiring negotiation, a job applicant who assumes that salary is the
        only issue may insist on $75,000 when the employer is offering $70,000.
      src: 2023 고3 6월 42번
      cut: 채용 협상에서 / 구직자는 / (급여가 유일한 쟁점이라고 가정하는) / 75,000달러를 고집할 수 있다 / 고용주가 70,000달러를
        제시할 때.
      how: that salary~는 assumes의 목적어절. 이 절을 괄호로 묶어 치우면 주절 동사 may insist가 드러납니다.
      catch: 급여가 유일한 쟁점이라 믿는 지원자는 7만 제안에도 7만5천을 고집한다.
    - en: Although we'd like to think that our minds are sharp enough to always make
        good decisions with the greatest efficiency, they just aren't.
      src: 2024 고3 11월 35번
      cut: 비록 우리는 생각하고 싶지만 / (우리의 정신이 / 늘 최고 효율로 좋은 결정을 내릴 만큼 / 충분히 예리하다고) / 그것은 그저
        그렇지 않다.
      how: that절은 think의 목적어, 문장 전체는 Although 양보절. 양보를 걷어내면 주절 they just aren't만 남죠.
      catch: 정신이 늘 최고 효율로 옳은 결정을 내린다 믿고 싶지만, 현실은 아니다.
    - en: A hypothesis called the Mach band theory suggests that moths see a dark
        area around a light source and head for it to escape the light.
      src: 2024 고3 9월 31번
      cut: 마흐 밴드 이론이라 불리는 가설은 / 시사한다 / (나방이 광원 주위의 어두운 영역을 보고 / 그리로 향한다는 것을) / 빛을
        피하려고.
      how: that절은 suggests의 목적어절. 그 안 see와 head가 and로 병렬, called 분사는 앞 주어를 꾸밉니다.
      catch: '마흐 밴드 가설: 나방은 광원 둘레의 어둠을 보고 빛을 피해 그리로 간다고.'
    coach: "▸ that은 <b>딱 셋 중 하나</b> — 접속사 / 관계사 / 동격.<br>▸ <b>뒤 문장이 완전한지</b>만 봐요 → 완전=접속사(‘~라는 것’), 불완전=관계사, 앞 명사 설명=동격."
  as_compare:
    point: as는 전치사·부사·접속사로 두루 쓰이고, as A as B·비교급은 'A와 B가 동등/우열'임을 강조하는 신호다.
    strategy: as 뒤가 명사면 전치사(~로서/처럼), S+V면 접속사(~할 때/때문에). as A as B는 'B만큼 A한'. not always·not
      all은 부분부정('항상/모두 ~인 건 아니다').
    diagram:
      symbol: A as B → 동등·우열 강조
      rows:
      - en: as + 명사
        ko: 전치사 → ~로서 / ~처럼
      - en: as + S V
        ko: 접속사 → ~할 때 / ~때문에
      - en: as A as B
        ko: 뒤 as에만 '만큼' → B만큼 A한
      - en: not all / not always
        ko: 부분부정 → 모두/항상 ~인 건 아니다
    examples:
    - en: In the latter case, management organization and processes can be equally as
        relevant as designers' creativity.
      src: 2022 고3 9월 40번
      cut: 후자의 경우 / 관리 조직과 과정이 / 디자이너의 창의성만큼이나 / 똑같이 중요할 수 있다.
      how: as A as B는 'B만큼 A한'. 뒤 as에만 '만큼'을 붙여 relevant를 '창의성만큼 중요한'으로 받으세요.
      catch: 관리·과정도 디자이너의 창의성 '못지않게' 중요하다 — 둘을 동등하게 본다.
    - en: Services using electrically assisted delivery tricycles have been successfully
        implemented in France and are gradually being adopted across Europe for services
        as varied as parcel and catering deliveries.
      src: 2023 고3 11월 22번
      cut: 전기 보조 배달 세발자전거를 이용한 서비스가 / 프랑스에서 시행되었고 / 유럽 전역으로 점차 도입되고 있다 / 소포·케이터링 배달만큼
        다양한 서비스에.
      how: as varied as = '~만큼 다양한'. varied를 뒤 명사에 걸어 '소포·케이터링 배달만큼 다양한 서비스'로 받으세요.
      catch: 배달 자전거 서비스가 소포부터 음식까지 그만큼 폭넓게 유럽에 퍼지고 있다.
    - en: In a climate of admiration for male artists and their female creations, the
        dress-designer first flourished as the same sort of creator.
      src: 2022 고3 9월 33번
      cut: 남성 예술가와 그들의 여성 창작물에 대한 찬미의 분위기 속에서 / 드레스 디자이너는 / 처음으로 / 똑같은 종류의 창작자로서 / 번성했다.
      how: as 뒤가 명사(the same sort of creator)죠? 그럼 전치사 as='~로서'. '창작자로서 번성했다'로 받으세요.
      catch: 드레스 디자이너가 (남성 예술가와) 같은 반열의 '창작자'로 대우받으며 떠올랐다.
    - en: Chaotic systems are generated by iteration, though not all iteration leads to
        chaos.
      src: 2025 고3 6월 37번
      cut: 혼돈 시스템은 / 반복에 의해 생성된다 / 하지만 모든 반복이 / 혼돈으로 이어지는 것은 아니다.
      how: not all은 '모두 ~인 건 아니다'(부분부정)이지 '모두 ~아니다'(전체부정)가 아니에요. '반복이 다 혼돈이 되진 않는다'로.
      catch: 반복이 혼돈을 만들지만, 반복이라고 다 혼돈이 되는 건 아니다 — 일부만.
    coach: "▸ as를 만나면 <b>일단 뒤부터</b> — 명사면 전치사, 주어+동사면 접속사.<br>▸ 비교표현(as A as B·비교급)은 <b>일종의 강조</b> → 필자가 무엇을 <b>동등·우열</b>로 보는지가 요지 단서.<br>▸ 함정 — <b>not all·not always</b>는 부분부정. 전체부정(‘결코’)으로 뒤집지 마요."
