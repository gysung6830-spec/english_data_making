categories:
- id: causation
  title: 인과
  day: 19
  signal: 원인과 결과를 잇는 표현
  misread: 화살표 방향을 놓쳐 원인과 결과를 뒤바꿔 읽는다
  tip: 코드를 보면 먼저 화살표 방향부터 고정하라 — 누가 원인이고 누가 결과인지.
  core_tip: 코드 앞뒤의 두 명사에 'A(원인)→B(결과)' 화살표를 직접 그려라. 나머지 수식어는 다 지워도 인과 관계 한 줄이 문장의 뼈대다.
  infer_tip: 코드 뜻을 몰라도, 앞이 '행동/조건'이고 뒤가 '변화/결과'로 보이면 앞이 원인일 확률이 높다. 상식적 선후관계로 방향을 검증하라.
  groups:
  - label: 정방향 (A → B · A가 원인)
    codes:
    - en: lead to
      ko: A가 B로 이어지다
      dir: forward
    - en: result in
      ko: A가 B를 야기하다
      dir: forward
    - en: cause
      ko: A가 B를 야기하다
      dir: forward
    - en: bring about
      ko: A가 B를 가져오다
      dir: forward
    - en: trigger
      ko: A가 B를 촉발하다
      dir: forward
    - en: give rise to
      ko: A가 B를 일으키다
      dir: forward
    - en: contribute to
      ko: A가 B의 원인이 되다
      dir: forward
  - label: 역방향 (B ← A · A가 결과)
    codes:
    - en: result from
      ko: A가 B에서 기인하다
      dir: backward
    - en: stem from
      ko: A가 B로부터 비롯되다
      dir: backward
    - en: arise from
      ko: A가 B로부터 발생하다
      dir: backward
    - en: be attributable to
      ko: A가 B에 기인하다
      dir: backward
    - en: be derived from
      ko: A가 B로부터 파생되다
      dir: backward
    - en: be due to
      ko: A가 B 때문이다
      dir: backward
    - en: be rooted in
      ko: A가 B에 뿌리를 두다
      dir: backward
- id: contrast
  title: 대조·반의
  day: 17
  signal: 앞뒤 내용을 반대로 뒤집는 신호
  misread: 대조 신호를 놓쳐 앞뒤를 같은 방향으로 읽는다
  tip: 이 코드가 보이면 앞뒤가 '반대'다 — 뒤 내용을 앞과 뒤집어 이해하라.
  groups:
  - label: 대조 접속·전치사
    codes:
    - en: unlike
      ko: ~와는 달리
    - en: whereas
      ko: ~인 반면에
    - en: while
      ko: ~인 반면에(대조)
    - en: contrary to
      ko: ~와 반대로
    - en: as opposed to
      ko: ~와 대조적으로
    - en: in contrast
      ko: 대조적으로
    - en: on the contrary
      ko: 그와는 반대로
  - label: 양보 (겉과 속이 다름)
    codes:
    - en: although
      ko: 비록 ~일지라도
    - en: even though
      ko: ~에도 불구하고
    - en: despite
      ko: ~에도 불구하고
    - en: nevertheless
      ko: 그럼에도 불구하고
    - en: rather than
      ko: ~라기보다는
- id: equivalence
  title: 등호·구별·재진술
  day: 18
  signal: A와 B가 같은지(=) 다른지(≠)를 정하는 표현
  misread: A=B(재진술·동격)를 놓쳐 새 정보로 읽거나, 구별을 동일시한다
  tip: 등호(A=B)면 뒤는 앞의 재진술이다 — 새 내용이 아니라 같은 말임을 알아채라.
  groups:
  - label: 등호 (A = B · 재진술/정의)
    codes:
    - en: in other words
      ko: 즉, 다시 말해
    - en: that is
      ko: 즉
      strict: comma
    - en: namely
      ko: 즉, 다시 말해
      strict: comma
    - en: be equivalent to
      ko: A가 B에 상응하다
    - en: amount to
      ko: A가 B와 마찬가지다
    - en: in essence
      ko: 본질적으로(=)
  - label: 구별 (A ≠ B · 다름)
    codes:
    - en: distinguish A from B
      ko: A를 B와 구별하다
    - en: differ from
      ko: A가 B와 다르다
    - en: as distinct from
      ko: ~와 구별되게
    - en: set apart from
      ko: A를 B와 구별짓다
- id: comparison
  title: 비교·대체·선호
  day: 16
  signal: 둘 중 어느 쪽이 더/우선인지를 정하는 표현
  misread: 우열·선호의 대상이 뒤바뀐다 (A를 택했는지 B를 택했는지)
  tip: 무엇이 무엇보다 위인지, 무엇이 무엇을 대신하는지 — 두 대상의 관계부터 확정하라.
  groups:
  - label: 선호·선택 (A를 택함)
    codes:
    - en: prefer A to B
      ko: B보다 A를 선호하다
    - en: favor A over B
      ko: B보다 A를 선호하다
    - en: choose A over B
      ko: B보다 A를 택하다
    - en: rather than
      ko: B가 아니라 A를(선호)
  - label: 우열·비교 (A가 위)
    codes:
    - en: outweigh
      ko: A가 B보다 더 중요하다
    - en: be superior to
      ko: A가 B보다 우월하다
    - en: surpass
      ko: A가 B를 능가하다
    - en: take precedence over
      ko: A가 B에 우선하다
  - label: 대체 (A가 B를 대신)
    codes:
    - en: replace
      ko: A가 B를 대체하다
    - en: give way to
      ko: A가 B에게 자리를 내주다
    - en: be replaced by
      ko: A가 B로 대체되다
- id: polarity_positive
  title: 긍정·강조 신호
  day: 31
  signal: 필자가 '중요하다 · 지지한다 · 핵심이다'라고 힘주는 대목
  misread: 강조 신호를 흘려 읽어 필자가 무엇을 '지지·중시'하는지(=필자 입장)를 놓친다
  tip: 긍정·강조어가 나오면 거기가 필자의 핵심 주장이다 — 밑줄 긋고 답의 근거로 삼아라.
  groups:
  - label: 핵심·중요 (필자가 미는 것)
    codes:
    - en: essential
      ko: 필수적인, 본질적인
    - en: crucial
      ko: 결정적으로 중요한
    - en: vital
      ko: 필수적인
    - en: central
      ko: 핵심적인
    - en: fundamental
      ko: 근본적인, 핵심적인
    - en: key
      ko: 핵심적인
    - en: significant
      ko: 중요한, 상당한
    - en: indispensable
      ko: 없어서는 안 될
  - label: 강조·지지 (필자의 태도)
    codes:
    - en: emphasize
      ko: 강조하다
    - en: prioritize
      ko: 우선시하다
    - en: reinforce
      ko: 강화하다
    - en: matter
      ko: 중요하다
    - en: in favor of
      ko: ~을 지지하여
    - en: beneficial
      ko: 유익한
- id: polarity_negative
  title: 부정·부재·거부 신호
  day: 32
  signal: '''아니다 · 없다 · 거부한다 · 거의 안 한다''로 문장의 극성을 뒤집는 말'
  misread: 부정·부재어(hardly, lack, far from, rather than 등)를 놓쳐 필자 의견을 정반대(긍정)로 읽는다
  tip: 부정·부재어가 보이면 극성이 뒤집힌다 — 필자는 '아니다/부족하다'고 말하는 중이다. 놓치면 필자 의견과 정반대로 멀어진다.
  core_tip: 부정어에 동그라미 치고 문장 끝에 '(−)' 표시를 하라. 그 문장은 '~하지 않는다/못한다'가 핵심이다. 필자의 진짜 주장은 대개 이 부정 뒤에 온다.
  infer_tip: 모르는 단어라도 hardly/rarely/no/lack 같은 부정 신호만 잡으면 '그건 아니다'라는 극성은 확정된다. 세부 뜻은 몰라도 방향은 안 틀린다.
  groups:
  - label: 빈도 부정 (거의 ~않다)
    codes:
    - en: hardly
      ko: 거의 ~않다
    - en: rarely
      ko: 좀처럼 ~않다
    - en: seldom
      ko: 좀처럼 ~않다
    - en: little
      ko: 거의 없는
    - en: few
      ko: 거의 없는
    - en: by no means
      ko: 결코 ~이 아닌
  - label: 부재·결핍·실패
    codes:
    - en: lack
      ko: ~가 없다, 부족
    - en: absence
      ko: 부재, 없음
    - en: far from
      ko: 결코 ~이 아닌
    - en: unlikely to
      ko: ~할 가능성이 없는
    - en: fail to
      ko: ~하지 못하다
  - label: 거부·무시·평가절하
    codes:
    - en: rather than
      ko: ~라기보다는(뒤를 부정)
    - en: ignore
      ko: 무시하다
    - en: dismiss
      ko: 묵살하다
    - en: irrelevant
      ko: 무관한, 중요치 않은
    - en: mere
      ko: 겨우 ~에 불과한
    - en: nothing but
      ko: ~에 불과한
- id: connective
  title: 연결어·예시
  day: 20
  signal: 글의 논리 흐름(부연·예시·인과·양보)을 알리는 신호
  misread: 연결어의 논리 종류를 오해해 글의 흐름을 반대로/엉뚱하게 잡는다
  tip: 연결어의 '논리 종류'부터 판정하라 — 부연인지, 대조인지, 인과인지, 예시인지.
  groups:
  - label: 부연·첨가 (같은 방향 강화)
    codes:
    - en: moreover
      ko: 게다가
    - en: furthermore
      ko: 게다가
    - en: in addition
      ko: 게다가
    - en: likewise
      ko: 마찬가지로
  - label: 결과·귀결
    codes:
    - en: thus
      ko: 그래서
    - en: hence
      ko: 그래서
    - en: consequently
      ko: 그 결과
    - en: accordingly
      ko: 따라서
    - en: thereby
      ko: 그렇게 함으로써
  - label: 전환·역접
    codes:
    - en: however
      ko: 하지만
    - en: yet
      ko: 그러나
    - en: nonetheless
      ko: 그럼에도
    - en: instead
      ko: 대신에
