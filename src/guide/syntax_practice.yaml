practice:
  wh_clause:
  - kind: mc
    sentence: Indeed, there are examples of particular attractions that have limited capacity and where there is actually no room for more visitors.
    source: 2024 고3 11월 24번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “수용 능력을 어떻게 제한하고 어디에 더 많은 방문객을 위한 공간이 없는지를 보여 주는 명소들”'
    options:
    - that·where를 '어떻게/어디에 ~인지' 의문사로 읽은 부분.
    - have limited capacity를 '수용 능력이 제한된'으로 옮긴 부분.
    - no room for more visitors를 '더 많은 방문객을 위한 공간이 없다'로 옮긴 부분.
    answer_index: 0
    vocab:
    - word: attraction
      meaning: 명소, 볼거리
    - word: capacity
      meaning: 수용 능력
    - word: room
      meaning: 공간, 여지
    solution:
      cut: 실제로 / 사례들이 있다 / [수용 능력이 제한되어 있고 / 더 많은 방문객을 위한 공간이 실제로 없는] 특정 명소들의.
      wrong: 수용 능력을 어떻게 제한하고 어디에 방문객을 위한 공간이 없는지를 보여 주는 명소들
      wrong_why: that과 where 둘 다 attractions(명소)를 꾸미는 관계사절이다. where는 '어디에'라는 의문사가 아니라 '~한 (장소)'을 뜻하는 관계부사(= in which)이므로 '어디에 ~인지'로 옮기면 안 된다.
      author_msg: 수용 인원이 꽉 차 더는 손님을 받을 수 없는 명소들이 실제로 존재한다.
      key_points:
      - 'where there is no room : 관계부사(=in which, ''~한 명소'')인데 ''어디에 ~인지'' 의문사절로 읽기 쉽다.'
      - 'that have ... and where ... : 두 관계사절이 선행사 attractions를 병렬 수식하는데, 이를 놓치면 ''어떻게 제한하고 어디에 없는지''로 갈라 읽게 된다.'
      cut_en: Indeed, / there are examples / of particular attractions / [that have limited capacity / and where there is actually no room for more visitors].
      cloze:
        en: Indeed, there are examples / of particular attractions that have limited capacity and where there is actually no room for more visitors
        ko:
        - t: 실제로 사례들이 있다
          v: 사례
        - t: 수용 능력이 제한되어 있고 더 많은 방문객을 위한 공간이 실제로 없는 특정 명소들의
          trap: true
  - kind: mc
    sentence: The scientific thinker looks for features of the thing that can be stripped of subjectivity, ideally, those aspects that can be quantified and whose values will thus never change from one observer to the next.
    source: 2023 고3 6월 33번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “어떤 측면이 정량화될 수 있고 누구의 값이 관찰자마다 변하지 않는지 하는 문제”'
    options:
    - can be quantified를 '정량화될 수 있는'으로 옮긴 부분.
    - whose values를 '누구의 값이 ~인지' 의문사로 읽은 부분.
    - never change from one observer to the next를 '관찰자에 따라 변하지 않는'으로 옮긴 부분.
    answer_index: 1
    vocab:
    - word: quantify
      meaning: 정량화하다, 수치화하다
    - word: subjectivity
      meaning: 주관성
    - word: aspect
      meaning: 측면
    solution:
      cut: 과학적 사고자는 찾는다 / 그 대상의 특징들을 / [주관성이 제거될 수 있는], / 이상적으로는 / [정량화될 수 있고 / 그래서 그 값이 관찰자마다 결코 변하지 않는] 그런 측면들을.
      wrong: 어떤 측면이 정량화될 수 있고 누구의 값이 변하지 않는지
      wrong_why: that은 aspects를 꾸미는 주격 관계대명사, whose values는 '그 (측면들의) 값'을 뜻하는 소유격 관계대명사다. '어떤/누구의 ~인지'를 묻는 의문사절이 아니다.
      author_msg: 과학적 사고는 주관을 걷어내고, 수치화할 수 있으며 관찰자가 바뀌어도 변치 않는 속성에 주목한다.
      key_points:
      - 'whose values will never change : 소유격 관계대명사(''그 값이 ~한'')인데 ''누구의 값이 ~인지'' 의문사절로 읽기 쉽다.'
      - 'those aspects that can be quantified : that을 ''어떤 측면이 ~인지'' 의문사로 읽기 쉽지만 aspects를 꾸미는 주격 관계대명사.'
      cut_en: The scientific thinker looks for / features of the thing / [that can be stripped of subjectivity], / ideally, / those aspects [that can be quantified / and whose values will thus never change from one observer to the next].
      cloze:
        en: The scientific thinker looks for features of the thing / that can be stripped of subjectivity / ideally, those aspects that can be quantified and whose values will thus never change from one observer to the next
        ko:
        - t: 과학적 사고자는 찾는다 그 대상의 특징들을
          v: 특징들
        - t: 주관성이 제거될 수 있는
          v: 주관성
        - t: 이상적으로는 정량화될 수 있고 그래서 그 값이 관찰자마다 결코 변하지 않는 그런 측면들을
          trap: true
  - kind: mc
    sentence: If you listen to someone who is not clear, who cannot stay on the topic, or who offers too much or too little information, you will quickly lose interest in the conversation.
    source: 2026 고3 11월 32번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “누가 명확하지 않고, 누가 주제에서 벗어나며, 누가 정보를 너무 많거나 적게 주는지를 (듣는다면)”'
    options:
    - cannot stay on the topic를 '주제에서 벗어나며'로 옮긴 부분.
    - too much or too little information을 '정보를 너무 많거나 적게'로 옮긴 부분.
    - 세 who를 '누가 ~인지' 의문사로 읽은 부분.
    answer_index: 2
    vocab:
    - word: stay on the topic
      meaning: 주제에서 벗어나지 않다
    - word: offer
      meaning: 주다, 제공하다
    - word: lose interest
      meaning: 흥미를 잃다
    solution:
      cut: 만약 당신이 듣는다면 / [명확하지 않고 / 주제에 머물지 못하며 / 정보를 너무 많거나 적게 주는] 사람의 말을, / 당신은 곧 흥미를 잃을 것이다 / 대화에.
      wrong: 누가 명확하지 않고 누가 주제에서 벗어나는지를 듣는다면
      wrong_why: 세 개의 who는 모두 someone을 꾸미는 주격 관계대명사(병렬)다. '누가 ~인지'를 묻는 의문사 명사절이 아니라 '~한 사람'이라는 수식이다.
      author_msg: 말이 불분명하고 주제를 못 지키며 정보량 조절을 못 하는 사람과의 대화엔 금세 흥미가 식는다.
      key_points:
      - 'someone who ~, who ~, or who ~ : 세 who를 ''누가 ~인지'' 의문사로 읽기 쉽지만 모두 someone을 병렬 수식하는 주격 관계대명사.'
      cut_en: If you listen to / someone [who is not clear, / who cannot stay on the topic, / or who offers too much or too little information], / you will quickly lose interest / in the conversation.
      cloze:
        en: If you listen to / someone who is not clear, who cannot stay on the topic, or who offers too much or too little information / you will quickly lose interest in the conversation
        ko:
        - t: 만약 당신이 듣는다면
          v: 듣는다면
        - t: 명확하지 않고 주제에 머물지 못하며 정보를 너무 많거나 적게 주는 사람의 말을
          trap: true
        - t: 당신은 곧 흥미를 잃을 것이다 대화에
          v: 흥미를 잃을
  - kind: short
    sentence: Conversely, it can be claimed that a city in which many people are not walking often indicates good city quality.
    source: 2024 고3 9월 33번
    prompt: in which 관계사절에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 반대로, 많은 사람이 걷고 있지 않은 도시가 흔히 좋은 도시의 질을 나타낸다고 주장될 수도 있다.
    vocab:
    - word: conversely
      meaning: 반대로
    - word: indicate
      meaning: 나타내다
    - word: quality
      meaning: 질
    solution:
      cut: 반대로 / 주장될 수 있다 / [많은 사람이 걷고 있지 않은] 도시가 / 흔히 나타낸다고 / 좋은 도시의 질을.
      wrong: 많은 사람이 걷지 않는 곳이 어디인지가 도시의 질을 보여 준다.
      wrong_why: in which many people are not walking은 a city를 꾸미는 관계사절('~한 도시')이다. in which를 '어디에 ~인지'로 읽으면 안 되고, indicates의 주어는 a city다.
      author_msg: 굳이 걷지 않아도 되는(교통과 편의가 잘 갖춰진) 도시가 오히려 좋은 도시일 수 있다.
      key_points:
      - 'a city in which S+V : in which를 ''어디에 ~인지''로 읽어 주어를 흐리기 쉽다 → ''a city''를 꾸미는 관계사절이고 indicates의 주어는 a city.'
      cut_en: Conversely, / it can be claimed that / a city [in which many people are not walking] / often indicates / good city quality.
      cloze:
        en: Conversely, it can be claimed that / a city in which many people are not walking / often indicates good city quality
        ko:
        - t: 반대로 주장될 수 있다
          v: 주장될
        - t: 많은 사람이 걷고 있지 않은 도시가
          trap: true
        - t: 흔히 나타낸다고 좋은 도시의 질을
          v: 질
  - kind: mc
    sentence: 'If we understand critical thinking as: the identification and evaluation of evidence to guide decision‑making'', then '' ethical thinking is about identifying ethical issues and evaluating these issues from different perspectives to guide how to respond.'
    source: 2024 고3 6월 42번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “얼마나 많이 대응하는지를 안내하기 위해”'
    options:
    - how to respond의 how를 '얼마나(정도)'로 읽은 부분.
    - to guide를 '안내하기 위해'로 옮긴 부분.
    - respond를 '대응하다'로 옮긴 부분.
    answer_index: 0
    vocab:
    - word: critical thinking
      meaning: 비판적 사고
    - word: identification
      meaning: 확인
    - word: evaluation
      meaning: 평가
    - word: ethical
      meaning: 윤리적인
    - word: perspective
      meaning: 관점
    solution:
      cut: 안내하기 위해 / 어떻게 대응할지를.
      wrong: how를 정도(얼마나 많이)를 묻는 것으로 보아 '얼마나 대응하는지'로 옮긴 해석
      wrong_why: how to respond의 how는 뒤에 형용사·부사(much/many 등)를 동반하지 않고 to부정사와 결합해 '어떻게 ~할지'라는 방법을 나타내는 의문사이다. 정도의 how라면 how much/how many처럼 수량 표현이 뒤따라야 한다. 여기서는 guide의 목적어인 '어떻게 대응할지'라는 의문사+to부정사 명사구다.
      author_msg: 비판적 사고가 증거의 식별·평가라면, 윤리적 사고는 윤리적 쟁점을 여러 관점에서 평가해 어떻게 대응할지를 이끄는 것이다.
      key_points:
      - '의문사 how + to부정사 : ''어떻게 ~할지''(방법) — 정도의 how(얼마나)와 혼동 금지, 수량어가 뒤따르지 않음'
      cut_en: to guide / how to respond.
      cloze:
        en: to guide / how to respond
        ko:
        - t: 안내하기 위해
          v: 안내하기
        - t: 어떻게 대응할지를
          trap: true
  - kind: short
    sentence: To illustrate this, consider the uncertainties involved in predicting climatic changes, how ecosystems are likely to respond to climatic changes, and the likely efficacy of actions that might be taken to counter adverse effects of climatic changes.
    source: 2024 고3 9월 39번
    prompt: how절의 역할(consider의 목적어 병렬)에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 이것을 설명하기 위해, 기후 변화를 예측하는 데 관련된 불확실성, 생태계가 기후 변화에 어떻게 반응할 가능성이 있는지, 그리고 기후 변화의 부정적 영향에 대응하기 위해 취해질 수 있는 조치들의 있음직한 효능을 고려해 보라.
    vocab:
    - word: uncertainty
      meaning: 불확실성
    - word: ecosystem
      meaning: 생태계
    - word: efficacy
      meaning: 효능
    - word: counter
      meaning: 대응하다
    - word: adverse
      meaning: 부정적인
    solution:
      cut: 고려하라 / (기후 변화를 예측하는 데 관련된) 불확실성을, / 생태계가 기후 변화에 어떻게 반응할 가능성이 있는지를, / 그리고 (기후 변화의 부정적 영향에 대응하려 취해질 수 있는) 조치들의 있음직한 효능을.
      wrong: how절을 앞 명사 uncertainties를 꾸미는 수식어로 보거나, consider의 목적어가 아니라 부사적으로 처리한 해석
      wrong_why: how ecosystems ... respond는 consider의 세 목적어(the uncertainties / how ... / the likely efficacy) 중 두 번째로, 콤마와 and로 나란히 연결된 의문사 명사절이다. '어떻게 반응할지'라는 명사 덩어리로서 동사 consider의 목적어 자리를 채운다.
      author_msg: 기후 변화 대응은 예측의 불확실성, 생태계 반응 방식, 대응 조치의 효능이라는 여러 불확실 요소를 함께 고려해야 한다.
      key_points:
      - 'consider A, how ..., and B : how 의문사절이 동사의 목적어로 명사 A·B와 병렬 — 앞 명사 수식으로 오독 금지'
      cut_en: To illustrate this, consider / the uncertainties (involved in predicting climatic changes), / how ecosystems are likely to respond to climatic changes, / and the likely efficacy of actions (that might be taken to counter adverse effects of climatic changes).
      cloze:
        en: To illustrate this, consider the uncertainties involved in predicting climatic changes / how ecosystems are likely to respond to climatic changes / and the likely efficacy of actions that might be taken to counter adverse effects of climatic changes
        ko:
        - t: 고려하라 기후 변화를 예측하는 데 관련된 불확실성을
          v: 불확실성
        - t: 생태계가 기후 변화에 어떻게 반응할 가능성이 있는지를
          trap: true
        - t: 그리고 기후 변화의 부정적 영향에 대응하려 취해질 수 있는 조치들의 있음직한 효능을
          v: 효능
  - kind: short
    sentence: Just as we don't always see the intricate brushwork that goes into the creation of a painting, we may not always Beethoven notice how Beethoven keeps finding fresh uses for his motto or how he develops his material into a large, cohesive statement.
    source: 2022 고3 6월 34번
    prompt: 두 개의 how절과 that절의 성격에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 우리가 한 그림의 창작에 들어가는 정교한 붓놀림을 항상 보지는 못하는 것처럼, 우리는 베토벤이 자신의 모티프(motto)에 대한 참신한 쓰임새를 어떻게 계속 찾아내는지, 또는 그가 자신의 소재를 어떻게 크고 응집력 있는 작품으로 발전시키는지를 항상 알아차리지는 못할 수도 있다.
    vocab:
    - word: intricate
      meaning: 정교한
    - word: brushwork
      meaning: 붓놀림
    - word: motto
      meaning: 모티프
    - word: cohesive
      meaning: 응집력 있는
    - word: statement
      meaning: (예술적) 표현
    solution:
      cut: 우리가 항상 보지는 못하듯이 / (그림 창작에 들어가는) 정교한 붓놀림을 / 우리는 항상 알아차리지는 못할 수도 있다 / 베토벤이 자신의 모티프의 참신한 쓰임을 어떻게 계속 찾아내는지 / 또는 자신의 소재를 어떻게 크고 응집력 있는 작품으로 발전시키는지를.
      wrong: how를 '~하는 방식'이라는 관계부사(선행사 수식)로 보아 앞 명사를 꾸미는 것으로 옮기거나, 두 how절이 병렬임을 놓친 해석
      wrong_why: 두 how절은 모두 동사 notice의 목적어인 의문사 명사절('어떻게 ~하는지')로, or로 병렬 연결된다. 앞 that(brushwork that goes ...)은 주어가 빠진 주격 관계대명사절이다. how가 관계부사가 되려면 the way 등의 선행사가 있어야 하는데 여기서는 notice의 목적어 자리를 직접 채운다.
      author_msg: 그림의 정교한 붓질을 흔히 못 알아채듯, 베토벤이 모티프를 어떻게 변주·발전시키는지도 우리는 좀처럼 알아차리지 못한다.
      key_points:
      - 'notice how ... or how ... : 두 how 의문사절이 동사 목적어로 병렬(or)'
      - 'brushwork that goes into ... : 주격 관계대명사 that(주어 결여)'
      cut_en: Just as we don't always see / the intricate brushwork (that goes into the creation of a painting), / we may not always Beethoven notice / how Beethoven keeps finding fresh uses for his motto / or how he develops his material into a large, cohesive statement.
      cloze:
        en: Just as we don't always see the intricate brushwork that goes into the creation of a painting / we may not always notice / how Beethoven keeps finding fresh uses for his motto / or how he develops his material into a large, cohesive statement
