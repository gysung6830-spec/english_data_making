practice:
  wh_clause:
  - kind: mc
    sentence: Indeed, there are examples of particular attractions that have limited
      capacity and where there is actually no room for more visitors.
    source: 2024 고3 11월 24번
    prompt: 밑줄 친 부분의 올바른 해석을 고르시오.
    options:
    - 수용 능력을 어떻게 제한하고 어디에 더 많은 방문객을 위한 공간이 없는지를 보여 주는 명소들
    - 수용 능력이 제한되어 있고 더 많은 방문객을 위한 공간이 실제로 없는 명소들
    answer_index: 1
    vocab:
    - word: attraction
      meaning: 명소, 볼거리
    - word: capacity
      meaning: 수용 능력
    - word: room
      meaning: 공간, 여지
    solution:
      cut: 실제로 / 사례들이 있다 / [수용 능력이 제한되어 있고(that have ~) / 더 많은 방문객을 위한 공간이 실제로 없는(where
        there is ~)] 특정 명소들의.
      wrong: 수용 능력을 어떻게 제한하고 어디에 방문객을 위한 공간이 없는지를 보여 주는 명소들
      wrong_why: that과 where 둘 다 attractions(명소)를 꾸미는 관계사절이다. where는 '어디에'라는 의문사가
        아니라 '~한 (장소)'을 뜻하는 관계부사(= in which)이므로 '어디에 ~인지'로 옮기면 안 된다.
      author_msg: 수용 인원이 꽉 차 더는 손님을 받을 수 없는 명소들이 실제로 존재한다.
      key_points:
      - 'where there is no room : 관계부사(=in which, ''~한 명소'')인데 ''어디에 ~인지'' 의문사절로 읽기
        쉽다.'
      - 'that have ... and where ... : 두 관계사절이 선행사 attractions를 병렬 수식하는데, 이를 놓치면 ''어떻게
        제한하고 어디에 없는지''로 갈라 읽게 된다.'
  - kind: mc
    sentence: The scientific thinker looks for features of the thing that can be stripped
      of subjectivity, ideally, those aspects that can be quantified and whose values
      will thus never change from one observer to the next.
    source: 2023 고3 6월 33번
    prompt: 밑줄 친 부분의 올바른 해석을 고르시오.
    options:
    - 정량화될 수 있고 그래서 그 값이 관찰자에 따라 결코 변하지 않는 (그런) 측면들
    - 어떤 측면이 정량화될 수 있고 누구의 값이 관찰자마다 변하지 않는지 (하는 문제)
    answer_index: 0
    vocab:
    - word: quantify
      meaning: 정량화하다, 수치화하다
    - word: subjectivity
      meaning: 주관성
    - word: aspect
      meaning: 측면
    solution:
      cut: 과학적 사고자는 찾는다 / 그 대상의 특징들을 / [주관성이 제거될 수 있는(that ~)], 이상적으로는 / [정량화될 수 있고(that
        ~) / 그래서 그 값이 관찰자마다 결코 변하지 않는(whose values ~)] 그런 측면들을.
      wrong: 어떤 측면이 정량화될 수 있고 누구의 값이 변하지 않는지
      wrong_why: that은 aspects를 꾸미는 주격 관계대명사, whose values는 '그 (측면들의) 값'을 뜻하는 소유격
        관계대명사다. '어떤/누구의 ~인지'를 묻는 의문사절이 아니다.
      author_msg: 과학적 사고는 주관을 걷어내고, 수치화할 수 있으며 관찰자가 바뀌어도 변치 않는 속성에 주목한다.
      key_points:
      - 'whose values will never change : 소유격 관계대명사(''그 값이 ~한'')인데 ''누구의 값이 ~인지''
        의문사절로 읽기 쉽다.'
      - 'those aspects that can be quantified : that을 ''어떤 측면이 ~인지'' 의문사로 읽기 쉽지만 aspects를
        꾸미는 주격 관계대명사.'
  - kind: mc
    sentence: If you listen to someone who is not clear, who cannot stay on the topic,
      or who offers too much or too little information, you will quickly lose interest
      in the conversation.
    source: 2026 고3 11월 32번
    prompt: 밑줄 친 부분의 올바른 해석을 고르시오.
    options:
    - 누가 명확하지 않고, 누가 주제에서 벗어나며, 누가 정보를 너무 많거나 적게 주는지를
    - 명확하지 않고, 주제에서 벗어나며, 정보를 너무 많거나 너무 적게 주는 사람의 (말을)
    answer_index: 1
    vocab:
    - word: stay on the topic
      meaning: 주제에서 벗어나지 않다
    - word: offer
      meaning: 주다, 제공하다
    - word: lose interest
      meaning: 흥미를 잃다
    solution:
      cut: 만약 당신이 듣는다면 / [명확하지 않고(who is ~) / 주제에 머물지 못하며(who cannot ~) / 정보를 너무 많거나
        적게 주는(who offers ~)] 사람의 말을, / 당신은 곧 흥미를 잃을 것이다 / 대화에.
      wrong: 누가 명확하지 않고 누가 주제에서 벗어나는지를 듣는다면
      wrong_why: 세 개의 who는 모두 someone을 꾸미는 주격 관계대명사(병렬)다. '누가 ~인지'를 묻는 의문사 명사절이 아니라
        '~한 사람'이라는 수식이다.
      author_msg: 말이 불분명하고 주제를 못 지키며 정보량 조절을 못 하는 사람과의 대화엔 금세 흥미가 식는다.
      key_points:
      - 'someone who ~, who ~, or who ~ : 세 who를 ''누가 ~인지'' 의문사로 읽기 쉽지만 모두 someone을
        병렬 수식하는 주격 관계대명사.'
  - kind: short
    sentence: Animals have evolved many different ways of maintaining their health
      and then regaining it again once it has been damaged, such as an ability to
      heal wounds when they are injured and an amazingly complex immune system for
      warding off infection.
    source: 2024 고3 9월 37번
    prompt: wh절에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 동물들은 자신의 건강을 유지하고, 일단 손상되면 그것을 다시 회복하는 여러 다른 방법들을 진화시켜 왔는데, 예를 들어 다쳤을
      때 상처를 치유하는 능력과 감염을 물리치는 놀라울 만큼 복잡한 면역 체계 같은 것들이다.
    vocab:
    - word: regain
      meaning: 되찾다, 회복하다
    - word: ward off
      meaning: 물리치다, 막아 내다
    - word: immune system
      meaning: 면역 체계
    solution:
      cut: 동물들은 진화시켜 왔다 / 건강을 유지하고 / 일단 손상되면(once it has been damaged) 다시 회복하는 / 여러
        방법을, / 예컨대 / 다쳤을 때(when they are injured) 상처를 치유하는 능력과 / 감염을 물리치는 놀랍도록 복잡한
        면역 체계 같은.
      wrong: 언제 다치는지, 언제 손상되는지를 유지하고 회복하는 방법을 진화시켰다.
      wrong_why: when they are injured, once it has been damaged는 각각 '다쳤을 때', '일단
        손상되면'이라는 부사절(시간/조건)이다. '언제 ~인지'라는 의문사 명사절이 아니다.
      author_msg: 동물은 상처 치유, 면역처럼 건강을 지키고 되찾는 다양한 자기 방어 수단을 진화시켜 왔다.
      key_points:
      - 'when they are injured / once it has been damaged : ''언제 다치는지'' 의문사절로 읽기 쉽지만
        ''다쳤을 때/일단 손상되면''의 시간·조건 부사절.'
  - kind: short
    sentence: Conversely, it can be claimed that a city in which many people are not
      walking often indicates good city quality.
    source: 2024 고3 9월 33번
    prompt: in which 관계사절에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 반대로, 많은 사람이 걷고 있지 않은 도시가 흔히 좋은 도시의 질을 나타낸다고 주장될 수도 있다.
    vocab:
    - word: conversely
      meaning: 반대로
    - word: indicate
      meaning: 나타내다
    - word: quality
      meaning: 질
    solution:
      cut: 반대로 / 주장될 수 있다 / [많은 사람이 걷고 있지 않은(in which ~)] 도시가 / 흔히 나타낸다고 / 좋은 도시의
        질을.
      wrong: 많은 사람이 걷지 않는 곳이 어디인지가 도시의 질을 보여 준다.
      wrong_why: in which many people are not walking은 a city를 꾸미는 관계사절('~한 도시')이다.
        in which를 '어디에 ~인지'로 읽으면 안 되고, indicates의 주어는 a city다.
      author_msg: 굳이 걷지 않아도 되는(교통과 편의가 잘 갖춰진) 도시가 오히려 좋은 도시일 수 있다.
      key_points:
      - 'a city in which S+V : in which를 ''어디에 ~인지''로 읽어 주어를 흐리기 쉽다 → ''a city''를
        꾸미는 관계사절이고 indicates의 주어는 a city.'
  - kind: mc
    sentence: When there are a lot of different factors involved and a situation is
      very uncertain, simple formulas can win out by focusing on the most important
      factors and being consistent, while human judgement is too easily influenced
      by particularly salient and perhaps irrelevant considerations.
    source: 2023 고3 11월 42번
    prompt: 밑줄 친 부분(When there are a lot of different factors involved and a situation
      is very uncertain)의 올바른 해석을 고르시오.
    options:
    - 언제 많은 다른 요인들이 관련되고 상황이 매우 불확실해지는지는
    - 많은 다른 요인들이 관련되어 있고 상황이 매우 불확실할 때(그런 경우에)
    answer_index: 1
    vocab:
    - word: factor
      meaning: 요인
    - word: win out
      meaning: 이기다
    - word: consistent
      meaning: 일관된
    - word: salient
      meaning: 두드러진
    - word: irrelevant
      meaning: 무관한
    solution:
      cut: When there are a lot of different factors involved / and a situation is
        very uncertain, / simple formulas can win out — 많은 다른 요인들이 관련되어 있고 / 상황이 매우
        불확실할 때, / 단순한 공식이 이길 수 있다
      wrong: 문두 When을 '언제 ~하는지'라는 의문사(명사절)로 보아 주어처럼 옮긴 해석
      wrong_why: 여기서 When절은 뒤에 주절(simple formulas can win out)이 이어지는 시간·조건의 부사절로 '~할
        때'의 뜻이다. 의문사 명사절이라면 그 명사절이 문장의 주어·목적어 자리를 차지해야 하는데, 뒤에 독립된 주어(simple formulas)와
        동사가 그대로 있으므로 When은 접속사이다.
      author_msg: 요인이 많고 상황이 불확실할 때는, 핵심 요인에 집중해 일관되게 판단하는 단순한 공식이 산만해지기 쉬운 인간 판단보다
        낫다.
      key_points:
      - '문두 When절 : 뒤에 완전한 주절이 오면 부사절(~할 때) / 명사(주어·목적어) 자리를 채우면 의문사절(언제 ~하는지) — 여기서는
        부사절'
  - kind: mc
    sentence: 'If we understand critical thinking as: the identification and evaluation
      of evidence to guide decision‑making'', then '' ethical thinking is about identifying
      ethical issues and evaluating these issues from different perspectives to guide
      how to respond.'
    source: 2024 고3 6월 42번
    prompt: 밑줄 친 부분(to guide how to respond)의 올바른 해석을 고르시오.
    options:
    - 어떻게 대응할지를 안내하기 위해
    - 얼마나 많이 대응하는지를 안내하기 위해
    answer_index: 0
    vocab:
    - word: critical thinking
      meaning: 비판적 사고
    - word: identification
      meaning: 확인
    - word: evaluation
      meaning: 평가
    - word: ethical
      meaning: 윤리적인
    - word: perspective
      meaning: 관점
    solution:
      cut: to guide / how to respond — 안내하기 위해 / 어떻게 대응할지를
      wrong: how를 정도(얼마나 많이)를 묻는 것으로 보아 '얼마나 대응하는지'로 옮긴 해석
      wrong_why: how to respond의 how는 뒤에 형용사·부사(much/many 등)를 동반하지 않고 to부정사와 결합해 '어떻게
        ~할지'라는 방법을 나타내는 의문사이다. 정도의 how라면 how much/how many처럼 수량 표현이 뒤따라야 한다. 여기서는
        guide의 목적어인 '어떻게 대응할지'라는 의문사+to부정사 명사구다.
      author_msg: 비판적 사고가 증거의 식별·평가라면, 윤리적 사고는 윤리적 쟁점을 여러 관점에서 평가해 어떻게 대응할지를 이끄는 것이다.
      key_points:
      - '의문사 how + to부정사 : ''어떻게 ~할지''(방법) — 정도의 how(얼마나)와 혼동 금지, 수량어가 뒤따르지 않음'
  - kind: short
    sentence: To illustrate this, consider the uncertainties involved in predicting
      climatic changes, how ecosystems are likely to respond to climatic changes,
      and the likely efficacy of actions that might be taken to counter adverse effects
      of climatic changes.
    source: 2024 고3 9월 39번
    prompt: how절의 역할(consider의 목적어 병렬)에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 이것을 설명하기 위해, 기후 변화를 예측하는 데 관련된 불확실성, 생태계가 기후 변화에 어떻게 반응할 가능성이 있는지, 그리고
      기후 변화의 부정적 영향에 대응하기 위해 취해질 수 있는 조치들의 있음직한 효능을 고려해 보라.
    vocab:
    - word: uncertainty
      meaning: 불확실성
    - word: ecosystem
      meaning: 생태계
    - word: efficacy
      meaning: 효능
    - word: counter
      meaning: 대응하다
    - word: adverse
      meaning: 부정적인
    solution:
      cut: consider / the uncertainties (involved in predicting climatic changes),
        / how ecosystems are likely to respond to climatic changes, / and the likely
        efficacy of actions (that might be taken ...) — 고려하라 / (기후 변화 예측에 관련된) 불확실성을,
        / 생태계가 기후 변화에 어떻게 반응할 가능성이 있는지를, / 그리고 (…취해질 수 있는) 조치들의 있음직한 효능을
      wrong: how절을 앞 명사 uncertainties를 꾸미는 수식어로 보거나, consider의 목적어가 아니라 부사적으로 처리한
        해석
      wrong_why: how ecosystems ... respond는 consider의 세 목적어(the uncertainties / how
        ... / the likely efficacy) 중 두 번째로, 콤마와 and로 나란히 연결된 의문사 명사절이다. '어떻게 반응할지'라는
        명사 덩어리로서 동사 consider의 목적어 자리를 채운다.
      author_msg: 기후 변화 대응은 예측의 불확실성, 생태계 반응 방식, 대응 조치의 효능이라는 여러 불확실 요소를 함께 고려해야 한다.
      key_points:
      - 'consider A, how ..., and B : how 의문사절이 동사의 목적어로 명사 A·B와 병렬 — 앞 명사 수식으로 오독
        금지'
  - kind: short
    sentence: Just as we don't always see the intricate brushwork that goes into the
      creation of a painting, we may not always Beethoven notice how Beethoven keeps
      finding fresh uses for his motto or how he develops his material into a large,
      cohesive statement.
    source: 2022 고3 6월 34번
    prompt: 두 개의 how절과 that절의 성격에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 우리가 한 그림의 창작에 들어가는 정교한 붓놀림을 항상 보지는 못하는 것처럼, 우리는 베토벤이 자신의 모티프(motto)에 대한
      참신한 쓰임새를 어떻게 계속 찾아내는지, 또는 그가 자신의 소재를 어떻게 크고 응집력 있는 작품으로 발전시키는지를 항상 알아차리지는 못할
      수도 있다.
    vocab:
    - word: intricate
      meaning: 정교한
    - word: brushwork
      meaning: 붓놀림
    - word: motto
      meaning: 모티프
    - word: cohesive
      meaning: 응집력 있는
    - word: statement
      meaning: (예술적) 표현
    solution:
      cut: Just as we don't always see / the intricate brushwork (that goes into the
        creation of a painting), / we may not always notice / how Beethoven keeps
        finding fresh uses for his motto / or how he develops his material into a
        large, cohesive statement — 우리가 …을 항상 보지는 못하듯이 / (그림 창작에 들어가는) 정교한 붓놀림을 /
        우리는 항상 알아차리지는 못할 수도 있다 / 베토벤이 모티프의 참신한 쓰임을 어떻게 계속 찾아내는지 / 또는 소재를 어떻게 크고 응집력
        있는 작품으로 발전시키는지를
