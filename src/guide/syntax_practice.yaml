        모두 갖춘 완전한 절이다. 관계대명사 that이라면 뒤 문장에 빠진 성분이 있어야 하는데 없다. 따라서 이 that은 conclude의
        목적어절을 이끄는 접속사 that이다.
      author_msg: 원근법 보정을 거쳐 이성이 지각의 오도(誤導)를 결론짓더라도 대상은 여전히 작게 보이며, 진실은 지각이 아니라 이성적
        표상에서 드러난다.
      key_points:
      - '접속사 that vs 관계대명사 that : 뒤 절이 완전하면 접속사(목적어절), 성분이 빠졌으면 관계사 — 여기서는 완전한 절이므로
        접속사 that'
  - kind: short
    sentence: The longer we continue to believe that computers will take us to a magical
      new world, the longer we will delay their natural fusion with our lives, the
      hallmark of every major movement that aspires to be called a socioeconomic revolution.
    source: 2023 고3 11월 30번
    prompt: that절의 성격(접속사 that / 관계사 that)에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 우리가 컴퓨터가 우리를 마법 같은 새로운 세계로 데려다줄 것이라고 계속 믿을수록, 우리는 컴퓨터와 우리 삶의 자연스러운 융합을,
      즉 사회경제적 혁명이라 불리기를 열망하는 모든 주요 운동의 특징(전형)을 그만큼 더 지연시킬 것이다.
    vocab:
    - word: fusion
      meaning: 융합
    - word: hallmark
      meaning: 특징
    - word: aspire to
      meaning: ~을 열망하다
    - word: socioeconomic revolution
      meaning: 사회경제적 혁명
    solution:
      cut: The longer we continue to believe / that computers will take us to a magical
        new world, / the longer we will delay / their natural fusion with our lives,
        / the hallmark of every major movement / that aspires to be called a socioeconomic
        revolution — 우리가 …라고 계속 믿을수록 / 컴퓨터가 우리를 마법의 신세계로 데려가리라고 / 우리는 그만큼 더 지연시킬 것이다
        / 컴퓨터와 우리 삶의 자연스러운 융합을 / 즉 모든 주요 운동의 특징을 / 사회경제적 혁명이라 불리기를 열망하는 (운동의)
      wrong: 두 that을 같은 종류로 보아, 특히 movement 뒤 that을 believe 뒤 that처럼 명사절로 옮겨 '~라는
        것' 식으로 처리한 해석
      wrong_why: 첫 번째 that(believe 뒤)은 뒤에 완전한 절이 와서 believe의 목적어절을 이끄는 접속사 that이다.
        두 번째 that(movement 뒤)은 뒤에 주어가 빠진 채 aspires라는 동사가 바로 오므로 movement를 선행사로 하는
        주격 관계대명사이다. the hallmark ...는 앞의 natural fusion을 다시 말하는 동격 명사구다.
      author_msg: 컴퓨터가 마법의 신세계를 열어 줄 것이라 믿을수록, 컴퓨터가 삶에 자연스럽게 녹아드는 진정한 혁명은 더 늦어진다.
      key_points:
      - 'believe that (완전한 절) : 접속사 that, 목적어절'
      - 'movement that aspires ... : 주어가 빠진 관계사절 → 주격 관계대명사 that'
      - 'the hallmark of ... : natural fusion을 다시 말하는 동격 명사구(콤마 동격)'
  - kind: short
    sentence: However, sound graphs of songs recorded over several weeks or months
      reveal that during this practice period the bird fine‑tunes his efforts until
      he produces an accurate copy of the memorized template.
    source: 2024 고3 6월 35번
    prompt: reveal 뒤 that절의 구조에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 그러나 여러 주 또는 몇 달에 걸쳐 녹음된 노래의 음향 그래프는, 이 연습 기간 동안 그 새가 기억된 원형(견본)의 정확한 복제본을
      만들어낼 때까지 자신의 노력을 미세하게 조정한다는 것을 보여준다.
    vocab:
    - word: sound graph
      meaning: 음향 그래프
    - word: fine-tune
      meaning: 미세하게 조정하다
    - word: accurate copy
      meaning: 정확한 복제본
    - word: memorized template
      meaning: 기억된 원형(견본)
    solution:
      cut: sound graphs of songs (recorded over several weeks or months) / reveal
        / that ... the bird fine-tunes his efforts / until he produces an accurate
        copy of the memorized template — (…에 걸쳐 녹음된) 노래의 음향 그래프는 / 보여준다 / 그 새가 자신의
        노력을 미세 조정한다는 것을 / 기억된 원형의 정확한 복제본을 만들어낼 때까지
      wrong: reveal 뒤 that절의 앞머리 부사구 during this practice period를 주어로 오인하거나, that을
        songs를 꾸미는 관계사로 본 해석
      wrong_why: that 뒤에는 부사구 during this practice period가 먼저 나오고 그다음 진짜 주어 the bird와
        동사 fine-tunes가 온다. that절 전체가 reveal의 목적어이며, 뒤 절은 완전하므로 관계사가 아니라 접속사 that이다.
      author_msg: 장기간 녹음된 음향 그래프는, 새가 연습 기간 동안 기억한 견본의 정확한 복제에 이를 때까지 지저귐을 다듬어 감을
        보여준다.
      key_points:
      - 'reveal that + (부사구) + S + V : that 직후 부사구에 속지 말고 뒤의 진짜 주어(the bird)를 찾을 것
        — 접속사 that 목적어절'
  - kind: short
    sentence: Olivia Spikes Millstown Before you attend the world championships next
      month, on behalf of everyone in Millstown, I wish to let you Millstown know
      that we are supporting you all the way.
    source: 2022 고3 9월 18번
    prompt: know 뒤 that절에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 다음 달에 당신이 세계 선수권 대회에 참가하기 전에, Millstown의 모든 사람을 대표하여, 저는 우리가 끝까지 당신을 응원하고
      있다는 것을 당신에게 알려 드리고 싶습니다.
    vocab:
    - word: on behalf of
      meaning: ~을 대표하여
    - word: world championships
      meaning: 세계 선수권 대회
    - word: all the way
      meaning: 끝까지
    - word: wish to
      meaning: ~하고 싶다
    solution:
      cut: Before you attend the world championships next month, / on behalf of everyone
        in Millstown, / I wish to let you know / that we are supporting you all the
        way — 다음 달 세계 선수권 대회에 참가하기 전에 / Millstown 모두를 대표하여 / 저는 당신에게 알려 드리고 싶습니다 /
        우리가 끝까지 응원하고 있다는 것을
