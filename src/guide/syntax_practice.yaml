# 3부 구문해석 · 세부목차별 실전적용(문제↔해설). 실제 평가원 기출. 코딩 없이 편집.
practice:
  negation:
  - kind: mc
    sentence: 'While this definition is widely used in research, an important aspect of creativity is often ignored: Generating creative ideas rarely is the final goal.'
    source: 2024 고3 6월 32번
    prompt: rarely에 유의하여 올바른 해석을 고르시오.
    options:
    - 창의적 아이디어를 만드는 것이 대개 최종 목표다.
    - 창의적 아이디어를 만드는 것이 최종 목표인 경우는 좀처럼 없다.
    answer_index: 1
    vocab:
    - word: definition
      meaning: 정의
    - word: aspect
      meaning: 측면
    - word: rarely
      meaning: 좀처럼 ~않다
    solution:
      cut: 이 정의가 연구에서 널리 쓰이지만 / 창의성의 중요한 한 측면이 흔히 간과된다 / 콜론(:) → 즉, 창의적 아이디어를 만드는 것이 / 최종 목표인 경우는 좀처럼 없다(rarely is the final goal).
      wrong: 창의적 아이디어를 만드는 것이 대개 최종 목표다.
      wrong_why: rarely(좀처럼 ~않다)를 놓치면 극성이 정반대. rarely가 문장 전체의 극성을 (−)로 뒤집는다.
      author_msg: 아이디어를 '내는 것' 자체가 끝이 아니라, 그 뒤(실행·평가)가 더 중요하다.
      key_points:
      - 'rarely : 빈도부정(좀처럼 ~않다) — 극성 (−).'
      - '콜론(:) : 앞의 ''간과된 측면''을 구체화.'
      - 'Generating ~ : 동명사 주어(''~을 만드는 것'').'
  - kind: mc
    sentence: 'Fashion is among the simplest and cheapest methods of self-expression: clothes can be inexpensively purchased while making it easy to convey notions of wealth, intellectual stature, relaxation or environmental consciousness, even if none of these is true.'
    source: 2023 고3 11월 29번
    prompt: even if none of these is true의 범위와 극성에 유의하여 올바른 해석을 고르시오.
    options:
    - 이러한 것들 중 일부만 사실이 아닐지라도.
    - 이러한 것들 중 어느 하나도 사실이 아닐지라도.
    answer_index: 1
    vocab:
    - word: convey
      meaning: 전달하다
    - word: stature
      meaning: 위상, 지위
    - word: none
      meaning: 어느 것도 ~않다(전체부정)
    solution:
      cut: 패션은 가장 단순하고 저렴한 자기표현 방법 중 하나다 / 콜론(:) → 옷은 저렴하게 구입될 수 있다 / 부·지적 위상·여유·환경 의식 같은 관념을 전달하기 쉽게 하면서 / 이러한 것들 중 어느 하나도 사실이 아닐지라도(even if none of these is true).
      wrong: 이러한 것들 중 일부만 사실이 아닐지라도.
      wrong_why: none은 '일부'가 아니라 '어느 것도 ~않다'는 전체부정. 'these(이러한 관념들) 전부가 사실이 아니어도'로 범위가 전체에 걸린다.
      author_msg: 옷은 실제 부·교양이 전혀 없어도 그런 인상을 '싸게' 살 수 있게 해 준다는 냉소적 논지.
      key_points:
      - 'none of these : 전체부정(''어느 것도 ~아니다'') — 극성 (−).'
      - 'even if : 양보(''~일지라도'')가 부정과 결합.'
      - 'making it easy to convey : 가목적어 it — 진목적어는 to convey.'
  - kind: short
    sentence: Science is sometimes described as a winner-take-all contest, meaning that there are no rewards for being second or third.
    source: 2024 고3 11월 38번
    prompt: there are no rewards의 부정 범위에 유의하여 밑줄 부분을 우리말로 해석하시오.
    answer: 2등이나 3등을 하는 것에 대해서는 아무런 보상도 없다는 것을 의미하면서.
    vocab:
    - word: describe
      meaning: 묘사하다, 설명하다
    - word: contest
      meaning: 경쟁, 겨루기
    - word: no rewards
      meaning: 아무런 보상도 없음(전체부정)
    solution:
      cut: 과학은 때때로 승자독식 경쟁으로 묘사된다 / meaning that ~ (분사구문) → 즉, 2등이나 3등을 하는 것에 대해서는 / 아무런 보상도 없다는 것을 의미하면서.
      wrong: 2등이나 3등에게는 보상이 적다.
      wrong_why: no rewards는 '적다'가 아니라 '전혀 없다'는 전체부정. no가 rewards 전체를 부정해 극성이 (−)로 확정된다.
      author_msg: 1등만 전부를 가져가는 구조 — 2·3등의 몫은 '조금'이 아니라 '0'이라는 점을 강조.
      key_points:
      - 'no rewards : 명사 부정(전체부정, ''전혀 없다'') — 극성 (−).'
      - 'meaning that ~ : 분사구문(''~을 의미하면서'').'
      - 'for being second or third : 전치사 for + 동명사(보상의 ''대상'').'
  comparison:
  - kind: mc
    sentence: Free recall tests, in which students need to recall as much as they can remember without prompting, tend to result in better retention than cued recall tests, in which students are given hints about what they need to remember.
    source: 2024 고3 6월 29번
    prompt: better ~ than 비교 구문에 유의하여 알맞은 해석을 고르시오.
    options:
    - 학생들이 자유롭게 떠올리는 시험은, 힌트가 주어지는 단서 회상 시험만큼 기억 유지에 좋은 결과를 내지는 못하는 경향이 있다.
    - 학생들이 어떤 유도도 없이 기억나는 만큼 떠올려야 하는 자유 회상 시험은, 기억해야 할 것에 대한 힌트가 주어지는 단서 회상 시험보다 더 나은 기억 유지 결과를 내는 경향이 있다.
    answer_index: 1
    vocab:
    - word: recall
      meaning: 떠올리다, 회상
    - word: retention
      meaning: 기억 유지, 보유
    - word: prompting
      meaning: 유도, 자극
    solution:
      cut: 자유 회상 시험은 / [유도 없이 기억나는 만큼 떠올려야 하는] / 내는 경향이 있다 / [단서 회상 시험보다 / 더 나은] 기억 유지를 / [기억할 것의 힌트가 주어지는].
      wrong: 자유 회상 시험이 단서 회상 시험만큼 좋지는 못하다.
      wrong_why: better A than B = 'B보다 더 나은 A'(우등 비교). 자유 회상 시험이 '더 나은' 쪽이다. 열등/동등으로 읽으면 우열이 뒤집힌다. 비교 대상은 '자유 회상 시험' ↔ '단서 회상 시험'.
      author_msg: than 앞뒤에 놓인 두 시험을 먼저 찾고, 어느 쪽이 우등인지 better의 방향을 확정하라.
      key_points:
      - 'better A than B : B보다 더 나은 A(우등 비교).'
      - '비교 대상 : Free recall tests ↔ cued recall tests.'
      - 'in which ~ : 각 시험을 부연하는 관계사절, 비교의 주역이 아님.'
  - kind: mc
    sentence: There is no single, universal or authoritative version that makes sense, other than as a theoretical construct.
    source: 2022 고3 6월 21번
    prompt: other than에 유의하여 알맞은 해석을 고르시오.
    options:
    - 이론적 구성 개념을 포함하여, 말이 되는 단일하고 보편적이거나 권위 있는 판본이 존재한다.
    - 이론적 구성 개념으로서를 제외하고는, 말이 되는 단일하고 보편적이거나 권위 있는 판본은 존재하지 않는다.
    answer_index: 1
    vocab:
    - word: other than
      meaning: ~외에는, ~을 제외하고는
    - word: authoritative
      meaning: 권위 있는
    - word: construct
      meaning: 구성 개념
    solution:
      cut: 존재하지 않는다 / [단일하고 보편적이거나 권위 있는] 판본은 / [말이 되는] / 이론적 구성 개념으로서를 제외하고는.
      wrong: 이론적 구성 개념을 포함하여 그런 판본이 존재한다.
      wrong_why: other than A = 'A를 제외하고는'(A 외에는). 문장은 no ~ version으로 전체 부정이며, 유일한 예외가 '이론적 구성 개념으로서'다. 포함으로 읽으면 정반대. 비교(대조) 대상은 '실재하는 판본' ↔ '이론적 구성 개념으로서의 판본'.
      author_msg: other than은 '그것 외에는 없다'는 예외 표시다. no와 함께 '오직 그것만이 예외'라는 골격을 잡아라.
      key_points:
      - 'other than A : A를 제외하고는, A 외에는.'
      - 'no ~ version ... other than B : B 말고는 그런 판본이 없다(B가 유일 예외).'
      - '비교(대조) 대상 : 실재하는 판본 ↔ 이론적 구성 개념으로서의 판본.'
  - kind: short
    sentence: Even a small child, who can communicate by only one word at a time, uses a system for communication that is infinitely superior to any system utilized by any other animal.
    source: 2024 고3 9월 40번
    prompt: superior to에 유의하여 해석하시오.
    answer: 한 번에 한 단어로만 의사소통할 수 있는 어린아이조차, 다른 어떤 동물이 사용하는 그 어떤 체계보다 무한히 우월한 의사소통 체계를 사용한다.
    vocab:
    - word: superior to
      meaning: ~보다 우월한
    - word: infinitely
      meaning: 무한히
    - word: utilize
      meaning: 사용하다
    solution:
      cut: '[한 번에 한 단어만 쓰는] 어린아이조차 / 사용한다 / [다른 어떤 동물이 쓰는 그 어떤 체계보다 / 무한히 우월한] 의사소통 체계를.'
      wrong: 어린아이의 의사소통 체계는 다른 동물의 체계보다 열등하다.
      wrong_why: superior to A = 'A보다 우월한'(우등). 열등으로 읽으면 정반대. 비교 대상은 '아이의 체계' ↔ '다른 동물의 체계'.
      author_msg: than 없이 to로 비교하는 라틴계 비교급이다. superior 다음의 to를 than으로 바꿔 두 대상을 짚어라.
      key_points:
      - 'A superior to B : A가 B보다 우월한(than 대신 to).'
      - '비교 대상 : 아이의 언어 체계 ↔ 다른 동물의 체계.'
      - 'who ~ : a small child를 꾸미는 삽입 관계사절.'
  wh_clause:
  - kind: mc
    sentence: Indeed, there are examples of particular attractions that have limited capacity and where there is actually no room for more visitors.
    source: 2024 고3 11월 24번
    prompt: 밑줄 친 부분의 올바른 해석을 고르시오.
    options:
    - 수용 능력을 어떻게 제한하고 어디에 더 많은 방문객을 위한 공간이 없는지를 보여 주는 명소들
    - 수용 능력이 제한되어 있고 더 많은 방문객을 위한 공간이 실제로 없는 명소들
    answer_index: 1
    vocab:
    - word: attraction
      meaning: 명소, 볼거리
    - word: capacity
      meaning: 수용 능력
    - word: room
      meaning: 공간, 여지
    solution:
      cut: 실제로 / 사례들이 있다 / [수용 능력이 제한되어 있고(that have ~) / 더 많은 방문객을 위한 공간이 실제로 없는(where there is ~)] 특정 명소들의.
      wrong: 수용 능력을 어떻게 제한하고 어디에 방문객을 위한 공간이 없는지를 보여 주는 명소들
      wrong_why: that과 where 둘 다 attractions(명소)를 꾸미는 관계사절이다. where는 '어디에'라는 의문사가 아니라 '~한 (장소)'을 뜻하는 관계부사(= in which)이므로 '어디에 ~인지'로 옮기면 안 된다.
      author_msg: 수용 인원이 꽉 차 더는 손님을 받을 수 없는 명소들이 실제로 존재한다.
      key_points:
      - 'that have limited capacity : attractions를 꾸미는 주격 관계대명사절(''~한 명소'').'
      - 'where there is no room : 관계부사 where(= in which), ''~한'' 수식이지 ''어디에 ~인지'' 의문사절이 아니다.'
      - 선행사 attractions에 두 관계사절(that ~ / where ~)이 and로 병렬 연결.
  - kind: mc
    sentence: The scientific thinker looks for features of the thing that can be stripped of subjectivity, ideally, those aspects that can be quantified and whose values will thus never change from one observer to the next.
    source: 2023 고3 6월 33번
    prompt: 밑줄 친 부분의 올바른 해석을 고르시오.
    options:
    - 정량화될 수 있고 그래서 그 값이 관찰자에 따라 결코 변하지 않는 (그런) 측면들
    - 어떤 측면이 정량화될 수 있고 누구의 값이 관찰자마다 변하지 않는지 (하는 문제)
    answer_index: 0
    vocab:
    - word: quantify
      meaning: 정량화하다, 수치화하다
    - word: subjectivity
      meaning: 주관성
    - word: aspect
      meaning: 측면
    solution:
      cut: 과학적 사고자는 찾는다 / 그 대상의 특징들을 / [주관성이 제거될 수 있는(that ~)], 이상적으로는 / [정량화될 수 있고(that ~) / 그래서 그 값이 관찰자마다 결코 변하지 않는(whose values ~)] 그런 측면들을.
      wrong: 어떤 측면이 정량화될 수 있고 누구의 값이 변하지 않는지
      wrong_why: that은 aspects를 꾸미는 주격 관계대명사, whose values는 '그 (측면들의) 값'을 뜻하는 소유격 관계대명사다. '어떤/누구의 ~인지'를 묻는 의문사절이 아니다.
      author_msg: 과학적 사고는 주관을 걷어내고, 수치화할 수 있으며 관찰자가 바뀌어도 변치 않는 속성에 주목한다.
      key_points:
      - 'those aspects that can be quantified : that = 주격 관계대명사, aspects 수식(''정량화될 수 있는 측면'').'
      - 'whose values will never change : 소유격 관계대명사(''그 값이 ~한''), aspects를 수식.'
      - 'from one observer to the next : ''관찰자가 바뀌어도'', 즉 관찰자마다.'
  - kind: mc
    sentence: If you listen to someone who is not clear, who cannot stay on the topic, or who offers too much or too little information, you will quickly lose interest in the conversation.
    source: 2026 고3 11월 32번
    prompt: 밑줄 친 부분의 올바른 해석을 고르시오.
    options:
    - 누가 명확하지 않고, 누가 주제에서 벗어나며, 누가 정보를 너무 많거나 적게 주는지를
    - 명확하지 않고, 주제에서 벗어나며, 정보를 너무 많거나 너무 적게 주는 사람의 (말을)
    answer_index: 1
    vocab:
    - word: stay on the topic
      meaning: 주제에서 벗어나지 않다
    - word: offer
      meaning: 주다, 제공하다
    - word: lose interest
      meaning: 흥미를 잃다
    solution:
      cut: 만약 당신이 듣는다면 / [명확하지 않고(who is ~) / 주제에 머물지 못하며(who cannot ~) / 정보를 너무 많거나 적게 주는(who offers ~)] 사람의 말을, / 당신은 곧 흥미를 잃을 것이다 / 대화에.
      wrong: 누가 명확하지 않고 누가 주제에서 벗어나는지를 듣는다면
      wrong_why: 세 개의 who는 모두 someone을 꾸미는 주격 관계대명사(병렬)다. '누가 ~인지'를 묻는 의문사 명사절이 아니라 '~한 사람'이라는 수식이다.
      author_msg: 말이 불분명하고 주제를 못 지키며 정보량 조절을 못 하는 사람과의 대화엔 금세 흥미가 식는다.
      key_points:
      - 'someone who ~, who ~, or who ~ : 선행사 someone에 who 관계사절 3개가 or로 병렬 수식.'
      - 'who is not clear : ''명확하지 않은 (사람)'' 수식이지 ''누가 명확하지 않은지''가 아니다.'
      - 'stay on the topic : 주제에서 벗어나지 않다, 주제를 지키다.'
  - kind: short
    sentence: Animals have evolved many different ways of maintaining their health and then regaining it again once it has been damaged, such as an ability to heal wounds when they are injured and an amazingly complex immune system for warding off infection.
    source: 2024 고3 9월 37번
    prompt: wh절에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 동물들은 자신의 건강을 유지하고, 일단 손상되면 그것을 다시 회복하는 여러 다른 방법들을 진화시켜 왔는데, 예를 들어 다쳤을 때 상처를 치유하는 능력과 감염을 물리치는 놀라울 만큼 복잡한 면역 체계 같은 것들이다.
