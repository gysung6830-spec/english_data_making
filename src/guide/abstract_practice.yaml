practice:
  nominalization:
  - sentence: Whether it be due to the growing presence of AI assistants or the emergence of self-driving cars, the necessity of the role of humans as the decision makers would appear to be in decline.
    source: 2024 고3 6월 20번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “자율주행차의 출현이라는 결과나 의사결정자로서의 인간 역할의 필요성이라는 원인 때문에, 인간은 이미 사라지고 있는 것으로 보인다.”'
    options:
    - '''the growing presence of AI assistants''를 ''AI 비서의 증가하는 존재''로 본 곳'
    - '''would appear to be in decline''을 ''쇠퇴하는 것으로 보인다''로 본 곳'
    - '''the emergence of''·''the necessity of''를 명사 그대로 두고 인과로 엮어 읽은 곳'
    answer_index: 2
    vocab:
    - word: emergence
      meaning: 출현, 생겨남
    - word: necessity
      meaning: 필요성
    - word: in decline
      meaning: 쇠퇴하는
    solution:
      cut: 자율주행차가 생겨나는 것 / 인간 역할이 필요하다는 것
      wrong: 명사 덩어리를 명사 그대로 두고 억지로 인과(결과·원인)로 붙임
      wrong_why: the emergence of A는 'A가 생겨나는 것', the necessity of B는 'B가 필요하다는 것'으로 동사로 풀어야 하는데, 명사화를 그대로 둔 채 없는 인과관계를 만들어 오역했다.
      author_msg: of 앞의 추상명사(emergence/necessity)를 동사(생겨나다/필요하다)로 바꿔 읽으면 문장 뼈대가 보인다.
      key_points:
      - 'the emergence of self-driving cars : ''출현(명사)''로 굳혀 앞 growing presence of AI와 억지로 원인·결과로 엮기 쉽다 → ''A가 생겨나는 것''으로 동사화.'
      - 'the necessity of the role of humans : ''필요성(명사)''로 두면 무엇이 in decline인지 안 잡힌다 → ''인간 역할이 필요하다는 것''으로 동사화.'
      cut_en: Whether it be due to the growing presence of AI assistants / or the emergence of self-driving cars, / the necessity of the role of humans as the decision makers / would appear to be in decline.
    kind: mc
  - sentence: Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment experiences.
    source: 2026 고3 11월 24번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “새로운 문화의 출현물과 그것들이 지닌 새로운 컬처테인먼트 경험을 이끄는 것이다.”'
    options:
    - '''lead to the emergence of new cultures''의 emergence를 ''출현물''이라는 사물 명사로 본 곳'
    - '''Changing political, social and religious landscapes''를 ''변화하는 정치·사회·종교적 지형''으로 본 곳'
    - '''with them new culturtainment experiences''를 ''그와 함께 새로운 컬처테인먼트 경험''으로 본 곳'
    answer_index: 0
    vocab:
    - word: landscape
      meaning: 지형, 상황, 판도
    - word: emergence
      meaning: 출현, 생겨남
    - word: lead to
      meaning: ~로 이어지다
    solution:
      cut: 변화하는 정치·사회·종교적 지형은 / 이어질 것이다 / 새로운 문화가 생겨나는 것으로 / 그리고 그와 함께 / 새로운 '컬처테인먼트' 경험으로
      wrong: emergence를 '출현물'이라는 사물 명사로 굳혀 읽음
      wrong_why: lead to the emergence of A는 'A가 생겨나게 된다'로 동사로 풀어야 하는데, emergence를 명사 사물로 처리해 뜻이 어색해졌다.
      author_msg: lead to the emergence of A는 'A가 생겨나는 결과로 이어진다 = A가 생겨난다'로 통째로 동사화하라.
      key_points:
      - 'the emergence of new cultures : emergence를 ''출현물(사물)''로 굳혀 새 문화를 결과물로 오독하기 쉽다 → ''A가 생겨나는 것''으로 동사화.'
      - 'lead to A : 사물 목적어로 받아 ''A를 이끌다''로 오독하기 쉽다 → ''A가 생겨나게 된다''로 통째 동사화.'
      cut_en: Changing political, social and religious landscapes / will lead to / the emergence of new cultures, / and with them / new culturtainment experiences.
    kind: mc
  - sentence: In other words, they not only have an innate capacity for matching their own kinaesthetically experienced bodily movements with those of others that are visually perceived; they have an innate drive to do so.
    source: 2024 고3 11월 29번
    prompt: 밑줄 친 an innate capacity for matching ...를 명사화(capacity for)를 풀어 우리말로 옮기시오.
    answer: 그들은 자신의 운동감각으로 경험된 신체 움직임을 시각적으로 지각되는 타인의 움직임과 맞춰 볼 수 있는 타고난 능력을 지닐 뿐만 아니라, 그렇게 하려는 타고난 욕구도 지닌다.
    vocab:
    - word: innate
      meaning: 타고난
    - word: capacity for
      meaning: ~할 수 있는 능력
    - word: kinaesthetically
      meaning: 운동감각적으로
    solution:
      cut: 다시 말해 / 그들은 타고난 능력을 가질 뿐 아니라 / 자신의 운동감각으로 경험한 신체 움직임을 / 시각적으로 지각된 타인의 움직임과 맞추는 / 그렇게 하려는 타고난 욕구도 가진다
      wrong: capacity for matching을 '맞춤이라는 능력'처럼 명사 덩어리로 굳혀 옮김
      wrong_why: capacity for -ing는 '~할 수 있는 능력'으로 동사로 풀어야 하는데, matching을 명사로 두면 무엇을 무엇과 맞추는지 관계가 흐려진다.
      author_msg: capacity for -ing = '-할 수 있다는 것', drive to do = '-하려 한다는 것'으로 동사화해 A(자기 움직임)와 B(타인 움직임)의 연결을 드러내라.
      key_points:
      - 'capacity for matching A with B : matching을 ''맞춤(명사)''으로 굳히면 무엇을 무엇과 맞추는지 A·B 관계가 흐려진다 → ''~할 수 있다는 것''으로 동사화.'
      - 'those of others that are visually perceived : those가 앞 movements를 받는 것을 놓쳐 엉뚱한 대상과 맞추기 쉽다 → ''타인의 (움직임)''으로 복원.'
      cut_en: In other words, / they not only have an innate capacity / for matching their own kinaesthetically experienced bodily movements / with those of others that are visually perceived; / they have an innate drive to do so.
    kind: short
  - kind: mc
    sentence: Scattered attention harms your ability to let go of stress, because even though your attention is scattered, it is narrowly focused, for you are able to fixate only on the stressful parts of your experience.
    source: 2024 고3 11월 21번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “흩어진 주의력은 스트레스를 떨쳐 버리기 위해 당신의 능력을 해친다.”'
    options:
    - '''Scattered attention''을 ''흩어진 주의력''으로 본 곳'
    - '''ability to let go of stress''의 to를 목적으로 본 곳'
    - '''harms your ability''를 ''당신의 능력을 해친다''로 본 곳'
    answer_index: 1
    vocab:
    - word: scattered
      meaning: 흩어진, 분산된
    - word: attention
      meaning: 주의(력)
    - word: let go of
      meaning: ~을 놓아 버리다, 떨쳐 버리다
    - word: fixate on
      meaning: ~에 집착하다, 고정되다
    solution:
      cut: 흩어진 주의력은 / 스트레스를 떨쳐 버리는 당신의 능력을 해친다 / 당신의 주의력이 흩어져 있어도 / 그것은 좁게 집중되어 있다 / 당신이 경험의 스트레스를 주는 부분에만 집착할 수 있기 때문이다
      wrong: to let go of stress를 목적(~하기 위해)의 부사구로 보아 '스트레스를 떨쳐 버리기 위해 능력을 해친다'로 읽음.
      wrong_why: 'to부정사는 앞의 추상명사 ability를 뒤에서 구체화하는 형용사적 용법이다(ability to V: ~할 능력). 목적의 부사적 용법이 아니므로 harms의 목적어는 ''your ability to let go of stress'' 전체다.'
      author_msg: 흩어진 주의력은 오히려 스트레스를 떨쳐 내는 능력을 해친다.
      key_points:
      - 'ability to V : to를 목적(~하기 위해)으로 오독 → 추상명사 ability를 뒤에서 구체화하는 ''~할 능력''으로 붙여 읽기'
      cut_en: Scattered attention / harms your ability to let go of stress, / because even though your attention is scattered, / it is narrowly focused, / for you are able to fixate only on the stressful parts of your experience.
  - kind: mc
    sentence: Our view of the world is not given to us from the outside in a pure, objective form; it is shaped by our mental abilities, our shared cultural perspectives and our unique values and beliefs.
    source: 2022 고3 6월 21번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “세계의 풍경(전망)은 순수하고 객관적인 형태로 외부에서 우리에게 주어지는 것이 아니다.”'
    options:
    - '''in a pure, objective form''을 ''순수하고 객관적인 형태로''로 본 곳'
    - '''is not given to us from the outside''를 ''외부에서 우리에게 주어지는 것이 아니다''로 본 곳'
    - '''Our view of the world''의 view를 ''풍경·경치''로, of를 소유격으로 본 곳'
    answer_index: 2
    vocab:
    - word: view
      meaning: 관점, 견해
    - word: objective
      meaning: 객관적인
    - word: shape
      meaning: 형성하다
    - word: perspective
      meaning: 관점, 시각
    solution:
      cut: 세계에 대한 우리의 관점은 / 순수하고 객관적인 형태로 외부에서 우리에게 주어지는 것이 아니다 / 그것은 우리의 정신적 능력, 공유된 문화적 관점, 그리고 고유한 가치관과 신념에 의해 형성된다
      wrong: view를 '경치·풍경'으로, of the world를 소유격 '세계의'로 보아 '세계의 풍경'으로 읽음.
      wrong_why: '여기서 view는 추상명사 ''관점·견해''이고, of the world는 ''무엇에 대한 관점인지'' 그 내용을 구체화한다(view of ~: ~에 대한 관점). 뒤의 shaped by our mental abilities, cultural perspectives, values and beliefs가 정신적 ''관점''임을 확인해 준다.'
      author_msg: 세계를 보는 우리의 관점은 외부에서 주어진 것이 아니라 우리의 정신·문화·가치관이 빚어낸 것이다.
      key_points:
      - 'view of N : view를 ''경치'', of를 소유격으로 오독 → 추상명사 view를 구체화하는 ''N에 대한 관점''으로 처리'
      cut_en: Our view of the world / is not given to us from the outside in a pure, objective form; / it is shaped by our mental abilities, our shared cultural perspectives and our unique values and beliefs.
  - kind: mc
    sentence: People involved in the conception and engineering of robots designed to perceive and act know how fundamental is the ability to discriminate oneself from other entities in the environment.
    source: 2024 고3 9월 38번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “자기 자신을 다른 개체들과 구별하기 위해 그 능력이 얼마나 근본적인지를 안다.”'
    options:
    - '''the ability to discriminate oneself''의 to를 목적으로 본 곳'
    - '''how fundamental is the ability''를 ''그 능력이 얼마나 근본적인지''로 본 곳'
    - '''other entities in the environment''를 ''환경 속의 다른 개체들''로 본 곳'
    answer_index: 0
    vocab:
    - word: conception
      meaning: 구상, 착상
    - word: discriminate A from B
      meaning: A를 B와 구별하다
    - word: entity
      meaning: 개체, 실체
    - word: fundamental
      meaning: 근본적인
    solution:
      cut: 지각하고 행동하도록 설계된 로봇의 구상과 공학에 관여하는 사람들은 / 자기 자신을 환경 속의 다른 개체들과 구별하는 능력이 얼마나 근본적인지를 안다
      wrong: to discriminate 이하를 목적(~하기 위해)의 부사구로 떼어 '다른 개체들과 구별하기 위해 그 능력이 근본적이다'로 읽음.
      wrong_why: the ability to discriminate ~는 '추상명사 + to부정사'로, to부정사가 ability의 내용(무엇을 하는 능력인지)을 구체화한다. 따라서 '~을 구별하는 능력'으로 붙여 읽어야 한다.
      author_msg: 환경 속에서 자기와 남을 구별하는 능력은 지각·행동 로봇에게 근본적이다.
      key_points:
      - 'ability to V : to를 목적으로 오독 → 추상명사 ability를 구체화하는 ''~하는 능력''으로 붙여 읽기'
      cut_en: People involved in the conception and engineering of robots designed to perceive and act / know how fundamental is the ability to discriminate oneself from other entities in the environment.
  - kind: mc
    sentence: To decide whether and how to intervene in ecosystems, protected area managers normally need a reasonably clear idea of what future ecosystems would be like if they did not intervene.
    source: 2024 고3 9월 39번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “미래의 생태계가 무엇을 좋아할지에 대한 상당히 명확한 개념.”'
    options:
    - '''a reasonably clear idea of''를 ''상당히 명확한 개념''으로 본 곳'
    - '''what future ecosystems would be like''의 like를 ''좋아하다''로 본 곳'
    - '''future ecosystems''를 ''미래의 생태계''로 본 곳'
    answer_index: 1
    vocab:
    - word: intervene
      meaning: 개입하다
    - word: ecosystem
      meaning: 생태계
    - word: protected area
      meaning: 보호구역
    - word: reasonably
      meaning: 상당히, 꽤
    solution:
      cut: 생태계에 개입할지 여부와 어떻게 개입할지를 결정하기 위해 / 보호구역 관리자들은 보통 상당히 명확한 개념을 필요로 한다 / 만약 그들이 개입하지 않는다면 미래의 생태계가 어떤 모습일지에 대한
      wrong: what future ecosystems would be like의 like를 동사 '좋아하다'로 보아 '미래 생태계가 무엇을 좋아할지'로 읽음.
      wrong_why: of what future ecosystems would be like는 추상명사 idea의 내용을 구체화하는 부분이고, what ~ would be like는 'be like(~과 같다, 어떠하다)'의 what 명사절로 '어떤 모습일지'를 뜻한다. like는 전치사이며 동사 '좋아하다'가 아니다.
      author_msg: 관리자는 개입 여부를 정하려면 개입하지 않았을 때 생태계가 어떻게 될지를 명확히 그려 봐야 한다.
      key_points:
      - 'idea of what ~ would be like : like를 동사 ''좋아하다''로 오독 → 추상명사 idea를 구체화하는 ''무엇과 같을지(어떤 모습일지)에 대한 개념'''
      cut_en: To decide whether and how to intervene in ecosystems, / protected area managers normally need a reasonably clear idea / of what future ecosystems would be like if they did not intervene.
  - kind: short
    sentence: In some cases, however, we are far less aware of why we believe a certain claim to be true, or how we are to explain why certain social realities exist.
    source: 2022 고3 9월 37번
    prompt: of·why·how가 무엇의 내용을 구체화하는지에 유의하여, 밑줄 친 문장을 우리말로 해석하시오.
    answer: 그러나 어떤 경우에는, 우리는 우리가 어떤 주장을 참이라고 믿는 이유나, 특정한 사회적 현실이 왜 존재하는지를 어떻게 설명해야 하는지에 대해 훨씬 덜 인식하고 있다.
    vocab:
    - word: aware of
      meaning: ~을 인식하는, 알고 있는
    - word: claim
      meaning: 주장
    - word: be to (we are to explain)
      meaning: ~해야 하는 (당위·방법)
    - word: social reality
      meaning: 사회적 현실
    solution:
      cut: 그러나 어떤 경우에는 / 우리는 ~을 훨씬 덜 인식한다 / 우리가 어떤 주장을 참이라고 믿는 이유 / 또는 특정한 사회적 현실이 왜 존재하는지를 우리가 어떻게 설명해야 하는지를
      wrong: how we are to explain을 'how we explain(어떻게 설명하는가)'으로 보아 be to의 당위·방법 의미를 놓치고, aware of 뒤의 절을 본동사와 분리해 읽음.
      wrong_why: aware of 뒤의 why절과 how절이 병렬로 '무엇을 인식하는지' 그 내용을 구체화한다. how we are to explain의 be to부정사는 '어떻게 설명해야 하는가(방법·당위)'를 나타낸다.
      author_msg: 우리는 자신이 무언가를 믿는 이유나 사회 현실을 설명하는 방식을 잘 인식하지 못할 때가 있다.
      key_points:
      - 'aware of + why/how절 : of의 목적어를 놓치고 절을 따로 읽음 → of가 이끄는 why·how 명사절이 인식 대상을 구체화'
      - 'be to부정사 : 단순 현재로 오독 → ''~해야 한다(당위·방법)'''
      cut_en: In some cases, however, / we are far less aware / of why we believe a certain claim to be true, / or how we are to explain why certain social realities exist.
  - kind: short
    sentence: Learning to understand the built‑in limitations of our mental processes can also help us improve our ability to inform others more effectively.
    source: 2024 고3 9월 30번
