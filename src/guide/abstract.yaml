# ============================================================
#  추상 → 구체 · 추상적 표현을 손에 잡히게
#  평가원 문장은 추상적이다. 이 파트는 '추상 표현을 구체화하는 6가지 길'을
#  목차로 잡고, 각 길에 해당하는 표현·기출 예문(실제 출처 표기)을 익히게 한다.
#  (표현/예문은 여기서 바로 편집 가능 — 코딩 불필요)
# ============================================================
title: "추상 → 구체 · 추상적 표현을 손에 잡히게"
intro: >-
  평가원 문장이 어려운 건 추상적이기 때문이다. 아래 6가지 '구체화의 길'을 익히면,
  추상 표현도 실제 상황으로 풀어 읽을 수 있다. ('이런 내용'을 만드는 바로 그 능력.)

chapters:
  - id: nominalization
    title: "명사화 풀기 — 추상명사를 동사로 되돌린다"
    point: "영어는 동작을 '추상명사'로 굳혀 쓴다(the emergence of ~). 이를 동사로 풀면(생겨나는 것) 구체적으로 잡힌다. 특히 'the/a + 추상명사 + of/to' 형태를 노려라."
    strategy: "'the + 추상명사 + of A' 를 보면 → 'A가 ~하는 것 / A를 ~하는 것' 으로 동사처럼 풀어 읽는다. 명사 속에 숨은 '동사'를 꺼내는 것이 핵심."
    exprs:
      - {en: "the emergence / rise of A", ko: "A가 생겨나는 것 / 등장·부상"}
      - {en: "a shift / change in A", ko: "A가 바뀌는 것 / 변화"}
      - {en: "the recombination of A", ko: "A를 재조합하는 것"}
      - {en: "the ability / capacity to V", ko: "V할 수 있다는 것 / 능력"}
      - {en: "the tendency to V", ko: "V하려는 경향"}
      - {en: "the absence / decline of A", ko: "A가 없다는 것 / 줄어드는 것"}
    examples:
      - {en: "Whether it be due to the growing presence of AI assistants or the emergence of self-driving cars, the necessity of the role of humans as the decision makers would appear to be in decline.",
         src: "2024 고3 6월 20번",
         cut: "AI 비서가 점점 많아지든 / 자율주행차가 '등장하든'(the emergence of = 새로 생겨나든) / 의사결정자로서 인간의 역할은 줄고 있다(in decline = 줄어드는 것)."}
      - {en: "Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment experiences.",
         src: "2026 고3 11월 24번",
         cut: "정치·사회·종교 지형이 바뀌면 / '새로운 문화의 등장'으로 이어진다(the emergence of = 새 문화가 생겨난다) / 그와 함께 새로운 문화 체험도 (생겨난다)."}

  - id: restate
    title: "재진술 신호로 구체화 — 옆에 쉬운 말이 있다"
    point: "추상 문장 뒤엔 대개 쉬운 말이 따라온다. that is / in other words / namely, 그리고 콜론(:)이 그 신호다. 신호 뒤가 곧 앞의 '쉬운 번역'이다."
    strategy: "이 신호가 보이면 → 바로 뒤(또는 앞)의 '구체 설명'을 잡아 추상 문장을 갈음한다. 추상 문장과 재진술은 '같은 말'이므로, 둘 중 쉬운 쪽으로 이해하면 된다."
    exprs:
      - {en: "that is / namely", ko: "즉, 다시 말해 (재진술)"}
      - {en: "in other words", ko: "다시 말해 (재진술)"}
      - {en: "in short / to put it simply", ko: "요컨대 (요약)"}
      - {en: "N : (콜론) 뒤 설명", ko: "즉, 다음과 같은 것 (콜론 재진술)"}
    examples:
      - {en: "In other words, as museums struggle to survive in a competitive economy, their budgets often prioritise those parts of themselves that are consumable: infotainment in the galleries, goods and services in the cafes and the shops.",
         src: "2023 고3 6월 23번",
         cut: "다시 말해(= 앞 문장을 쉽게 풀면), / 박물관이 경쟁 경제에서 살아남으려 애쓰며 / 예산을 '소비 가능한 부분'에 우선 둔다 / 콜론(:) 뒤 = 즉, 전시관의 인포테인먼트, 카페·상점의 상품·서비스."}
      - {en: "Instead, they should concentrate attention on one subject after another, that is, in different periods of time.",
         src: "2024 고3 11월 40번",
         cut: "대신 그들은 / 한 주제에 차례차례 집중해야 한다 / that is(= 즉, 다시 말해) / '서로 다른 시기에' 나눠서."}

  - id: example
    title: "예시·나열로 구체화 — 상위 개념을 사례로 편다"
    point: "추상적인 '상위 개념(biometrics, ecosystem services)' 뒤에 such as / like / for example 로 구체 사례가 나열된다. 그 사례 목록이 곧 상위 개념의 '정체'다."
    strategy: "such as / like / for example / including 을 보면 → 뒤의 나열을 '상위 개념 = 이런 것들'로 묶어 읽는다. 사례를 보면 모르던 상위 개념도 손에 잡힌다."
    exprs:
      - {en: "A such as B, C, D", ko: "B·C·D 같은 A (A의 예시)"}
      - {en: "like B, C", ko: "B·C 같은 (예시)"}
      - {en: "for example / for instance", ko: "예를 들어 (예시)"}
      - {en: "including B, C", ko: "B·C를 포함해 (나열)"}
    examples:
      - {en: "Passwords, double-key identification, and biometrics such as fingerprint, iris, and voice recognition are all ways of keeping the account details hidden from potential fraudsters.",
         src: "2022 고3 9월 39번",
         cut: "비밀번호, 이중 키 인증, / 그리고 생체 인식(biometrics such as = 예를 들어 지문·홍채·음성 인식) / 모두 계정 정보를 사기꾼에게서 숨기는 방법이다. (biometrics = 지문·홍채·음성 인식)"}
      - {en: "Owners of forest lands have a market incentive to cut down trees rather than manage the forest for carbon capture, wildlife habitat, flood protection, and other ecosystem services.",
         src: "2024 고3 11월 23번",
         cut: "산림 소유자는 / 나무를 베려는 시장 유인이 있다 / 숲을 '생태계 서비스'로 관리하기보다 / (ecosystem services = 탄소 포집·야생동물 서식지·홍수 방지 등)."}

  - id: contrast
    title: "대비로 구체화 — 'A가 아니라 B'로 정체를 잡는다"
    point: "추상어는 '반대말'과 나란히 놓일 때 뜻이 선명해진다. not A but B / rather than / unlike 는 'B는 A의 반대'라고 알려주는 구체화 장치다."
    strategy: "not A but B, rather than, unlike 를 보면 → 아는 쪽(A 또는 B)의 '반대'로 모르는 쪽을 잡는다. 대비 자체가 추상어의 정의를 대신한다."
    exprs:
      - {en: "not A but B", ko: "A가 아니라 B (B로 확정)"}
      - {en: "B rather than A", ko: "A가 아니라 B (A를 부정)"}
      - {en: "unlike A, B ~", ko: "A와 달리 B는 ~ (A의 반대)"}
      - {en: "B, not A", ko: "A가 아니라 B"}
    examples:
      - {en: "Even after reason concludes that perception is misleading, the truth of the matter is revealed not in the perception of the figure but in its rational representation.",
         src: "2023 고3 6월 34번",
         cut: "이성이 '지각은 오해를 부른다'고 결론 내린 뒤에도 / 진실은 드러난다 / '도형을 지각하는 데'서가 아니라(not A) / '그것을 이성적으로 표상하는 데'서(but B). (진실의 위치 = 지각 X, 이성적 표상 O)"}
      - {en: "Urban transport professionals have largely acquiesced to the view that automobile demand in cities needs to be managed rather than accommodated.",
         src: "2022 고3 6월 30번",
         cut: "도시 교통 전문가들은 / 대체로 이 견해를 받아들였다 / 도시의 자동차 수요는 '관리'되어야 한다는 / '수용'되기보다(rather than = 수용 X, 관리 O). (관리 ↔ 수용 대비로 뜻 확정)"}

  - id: metaphor
    title: "비유·은유 읽기 — 그림·비유를 실제 뜻으로 바꾼다"
    point: "평가원은 추상 개념을 비유로 감춘다(그림자 vs 실체, 옷의 솔기 등). 비유의 '진짜 대상'을 대입해야 뜻이 열린다."
    strategy: "비유 표현이 나오면 → 'A는 사실 무엇을 빗댄 걸까?'를 묻고, 문맥이 주는 실제 대상으로 치환한다. 비유는 장식이 아니라 '핵심 주장'을 담는 그릇이다."
    exprs:
      - {en: "hunt the shadow, not the substance", ko: "실체가 아니라 겉모습(그림자)만 좇다"}
      - {en: "seamless / seams", ko: "이음매 없는(매끄러운) / 이음매(감춰야 할 흔적)"}
      - {en: "the tip of the iceberg", ko: "빙산의 일각 (드러난 일부)"}
      - {en: "a double-edged sword", ko: "양날의 검 (장단 양면)"}
    examples:
      - {en: "Those who rely only upon theories were obviously hunting the shadow, not the substance.",
         src: "2025 수능 21번",
         cut: "이론에만 의존한 사람들은 / 분명 '그림자를 좇고 있었다, 실체가 아니라'(hunt the shadow, not the substance) / (= 겉핥기 지식만 좇고 알맹이는 놓쳤다)."}
      - {en: "We aspire to seamless aesthetics by stitching the seams closely, pressing them flat and making sure they are hidden on the inside so that we wear clothing rather than pieces of fabric.",
         src: "2025 고3 6월 42번",
         cut: "우리는 '이음매 없는(seamless) 미학'을 추구한다 / 솔기를 촘촘히 꿰매고 눌러 감춰서 / '천 조각'이 아니라 '옷'을 입도록 / (= 기술·과정의 '이음매'를 감춰 매끄럽게 완성된 것처럼 보이게 한다는 비유)."}
