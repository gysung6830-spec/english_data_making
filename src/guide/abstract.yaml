title: 추상 → 구체 · 추상적 표현을 손에 잡히게
intro: 평가원 문장이 어려운 건 추상적이기 때문이다. 재진술·예시·대비 같은 '논리 신호'는 2부에서 이미 익혔으니, 여기서는 신호 없이 추상어 자체를 실제 의미로 푸는 2가지 — 명사화 풀기와 비유 읽기 — 에 집중한다. 결국 '이런 내용'을 스스로 만들어내는 바로 그 힘이다.
chapters:
- id: nominalization
  title: 명사화 풀기 — 추상명사를 동사로 되돌린다
  point: 영어는 동작을 '추상명사'로 굳혀 쓴다 — the emergence of ~ 처럼. 'the/a + 추상명사 + of/to' 형태가 그 신호다.
  strategy: '''the + 추상명사 + of A'' 를 보면 → ''A가 ~하는 것 / A를 ~하는 것'' 으로 동사처럼 풀어 읽는다. 명사 속에 숨은 ''동사''를 꺼내는 게 요령이다.'
  exprs:
  - en: the emergence / rise of A
    ko: A가 생겨나는 것 / 등장·부상
  - en: a shift / change in A
    ko: A가 바뀌는 것 / 변화
  - en: the recombination of A
    ko: A를 재조합하는 것
  - en: the ability / capacity to V
    ko: V할 수 있다는 것 / 능력
  - en: the tendency to V
    ko: V하려는 경향
  - en: the absence / decline of A
    ko: A가 없다는 것 / 줄어드는 것
  examples:
  - en: Whether it be due to the growing presence of AI assistants or the emergence of self-driving cars, the necessity of the role of humans as the decision makers would appear to be in decline.
    src: 2024 고3 6월 20번
    cut: AI 비서가 점점 많아져서든 / 자율주행차가 등장해서든 / 의사결정자로서 인간 역할의 필요성은 / 줄어드는 것처럼 보인다.
    how: the emergence of, in decline — 명사 속에 동사가 숨어 있죠? '생겨난다, 줄어든다'로 되살리면 뜻이 확 또렷해져요.
    catch: 결론은 간단. AI 비서든 자율주행이든, 의사결정자로서 인간이 덜 필요해진다는 얘기.
    cut_en: Whether it be due to the growing presence of AI assistants / or the emergence of self-driving cars, / the necessity of the role of humans as the decision makers / would appear to be in decline.
  - en: Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment experiences.
    src: 2026 고3 11월 24번
    cut: 변화하는 정치·사회·종교 지형은 / 새로운 문화의 등장으로 이어질 것이다 / 그리고 그와 함께 새로운 컬처테인먼트 체험(의 등장)으로.
    how: the emergence of new cultures, 명사 덩어리에 겁먹지 마세요. '새 문화가 생겨난다'로 동사처럼 풀면 술술 읽힙니다.
    catch: 원인은 정치·사회·종교 지형의 변화, 결과는 새 문화와 그에 딸린 컬처테인먼트 체험.
    cut_en: Changing political, social and religious landscapes / will lead to the emergence of new cultures, / and with them new culturtainment experiences.
  - en: However, in the virtual world, we have a tendency to be less defensive, as there appears to be no physical threat to our well‑being.
    src: 2023 고3 6월 22번
    cut: 하지만 / 가상 세계에서는 / 우리는 덜 방어적이게 되는 경향이 있다 / 우리 안녕에 물리적 위협이 없어 보이기 때문에.
    how: a tendency 하나만 보면 막연하죠. 바로 뒤 to부정사가 '무슨 경향인지' 채워 주니, 거기 붙여서 읽으면 돼요.
    catch: 가상 세계엔 물리적 위협이 없어 보이니, 우리 경계심이 슬며시 느슨해진다는 말.
    cut_en: However, / in the virtual world, / we have a tendency to be less defensive, / as there appears to be no physical threat to our well‑being.
  - en: Often overlooked, but just as important a stakeholder, is the consumer who plays a large role in the notion of the privacy paradox.
    src: 2022 고3 6월 22번
    cut: 종종 간과되지만 / 똑같이 중요한 이해당사자인 것은 / 바로 소비자다 / 프라이버시 역설이라는 개념에서 큰 역할을 하는.
    how: 보어가 앞으로 나온 도치예요. 되돌리지 말고 튀어나온 보어부터 받고 뒤의 주어(the consumer)로 이어 앞으로 읽으세요. the notion은 뒤 of구가 무슨 개념인지 설명해 줍니다.
    catch: 간과되지만 알고 보면 중요한 당사자가 소비자, 프라이버시 역설에서 한 축을 맡죠.
    cut_en: Often overlooked, but / just as important a stakeholder, / is the consumer / who plays a large role in the notion of the privacy paradox.
  - en: One very important distinction is that all other animals use one call for one message as the general principle of communication.
    src: 2024 고3 9월 40번
    cut: 매우 중요한 한 가지 구별은 / 다른 모든 동물은 한 메시지에 한 신호를 쓴다는 것이다 / 의사소통의 일반 원리로서.
    how: distinction만 딱 있으면 '무슨 구별?' 싶잖아요. 뒤 that절이 그 내용을 통째로 채워 주니 '~라는 구별'로 묶으면 끝.
    catch: 다른 동물은 한 메시지에 신호 하나씩 — 이게 바로 그 '중요한 구별'의 알맹이.
    cut_en: One very important distinction / is that all other animals use one call for one message / as the general principle of communication.
- id: metaphor
  title: 비유·은유 읽기 — 그림·비유를 실제 뜻으로 바꾼다
  point: 평가원은 추상 개념을 비유로 감춘다 — 그림자 vs 실체, 옷의 솔기처럼.
  strategy: 비유 표현이 나오면 → 'A는 사실 무엇을 빗댄 걸까?'를 묻고, 문맥이 주는 실제 대상으로 치환한다. 비유는 장식이 아니라 '핵심 주장'을 담는 그릇이다.
  exprs:
  - en: hunt the shadow, not the substance
    ko: 실체가 아니라 겉모습(그림자)만 좇다
  - en: seamless / seams
    ko: 이음매 없는(매끄러운) / 이음매(감춰야 할 흔적)
  - en: the tip of the iceberg
    ko: 빙산의 일각 (드러난 일부)
  - en: a double-edged sword
    ko: 양날의 검 (장단 양면)
  examples:
  - en: Those who rely only upon theories were obviously hunting the shadow, not the substance.
    src: 2025 수능 21번
    cut: 이론에만 의존한 사람들은 / 분명 그림자를 좇고 있었다 / 실체가 아니라.
    how: the shadow와 the substance, 무슨 비유일까요? 그림자는 겉핥기, 실체는 알맹이 — 이렇게 치환하면 대비가 살아납니다.
    catch: 그림자=겉, 실체=속. 이론에만 매달린 이들은 알맹이 아닌 껍데기만 좇았다는 뜻.
    cut_en: Those who rely only upon theories / were obviously hunting the shadow, / not the substance.
  - en: We aspire to seamless aesthetics by stitching the seams closely, pressing them flat and making sure they are hidden on the inside so that we wear clothing rather than pieces of fabric.
    src: 2025 고3 6월 42번
    cut: 우리는 이음매 없는 미학을 추구한다 / 솔기를 촘촘히 꿰매고 / 눌러 펴고 / 안쪽에 감춰서 / 천 조각이 아니라 옷을 입도록.
    how: 솔기를 촘촘히 꿰매 감춘다는 바느질 비유예요. 이음매는 곧 '기술의 흔적', 그걸 숨겨 매끈하게 만든다는 얘기.
    catch: 솔기(기술 흔적)를 감추듯 이음매 없는 매끄러움을 좇아, 천 조각이 아닌 '옷'을 걸치게 한다.
    cut_en: We aspire to seamless aesthetics / by stitching the seams closely, / pressing them flat / and making sure they are hidden on the inside / so that we wear clothing rather than pieces of fabric.
  - en: Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of exploitation.
    src: 2026 고3 11월 24번
    cut: 전반적으로 이것은 / 오락 산업의 건강하게 성장하는 부문이다 / 하지만 / 본질상 착취 앞에서는 연약한 (부문이다).
    how: healthy·delicate로 산업을 생명체처럼 그렸어요. by its very nature 삽입구는 잠깐 떼어 두고 뼈대부터 이으면 편합니다.
    catch: 산업 = 생명체. 자라나긴 하지만 착취 앞에선 여리다, healthy↔delicate 대비가 요지.
    cut_en: Overall this is / a healthy growth sector of the entertainment industry, / but / one that by its very nature is delicate in the face of exploitation.
  - en: The team consists of at least one robot and one human and is often called a mixed team because it is a mixture of human and robot agents.
    src: 2022 고3 6월 24번
    cut: 그 팀은 / 최소 로봇 하나와 인간 하나로 이루어진다 / 그래서 흔히 혼합 팀이라 불린다 / 왜냐하면 그것은 인간과 로봇 행위자의 혼합체이기 때문이다.
    how: 명칭 a mixed team이 먼저, because 뒤에 mixture of~로 정의가 따라와요. 이름과 뜻을 짝지어 읽는 게 요령.
    catch: '''혼합 팀''이라 부르는 까닭 = 인간과 로봇의 혼합체라서. 명칭과 정의를 포개면 뜻 확정.'
    cut_en: The team / consists of at least one robot and one human / and is often called a mixed team / because it is a mixture of human and robot agents.
