    - word: defensive
      meaning: 방어적인
    - word: well-being
      meaning: 안녕, 행복
    solution:
      cut: 그러나 가상 세계에서 / 우리는 경향이 있다 / 덜 방어적인(less defensive) (−) / 왜냐하면 없어 보이기 때문이다(there appears to be no) (−) / 우리의 안녕에 대한 물리적 위협이.
      wrong: 가상 세계에서 우리는 더 방어적인 경향이 있는데, 안녕에 대한 물리적 위협이 있어 보이기 때문이다.
