    vocab:
    - word: contingency pricing
      meaning: 조건부 가격 책정, 성공 보수제
    - word: ensure
      meaning: 보장하다
    - word: settlement
      meaning: 합의(금)
    solution:
      cut: 조건부 가격 책정을 이용함으로써 / 의뢰인은 보장받는다 / 그들이 어떠한 수수료도 내지 않는다는 것을(pay no fees) (−) / 합의금을 받을 때까지.
      wrong: 의뢰인은 합의금을 받을 때까지 수수료를 낸다는 것을 보장받는다.
      wrong_why: pay no fees는 '어떠한 수수료도 내지 않는다'는 부정이다. no를 놓치면 '수수료를 낸다'는 긍정이 되어 극성이 정반대로 뒤집힌다 (−).
      author_msg: 성공 보수제에서는 결과(합의)를 받기 전까지 의뢰인이 돈을 낼 필요가 없다는 것이 핵심이다.
      key_points:
      - 'pay no fees : ''어떠한 수수료도 내지 않는다'' — no가 목적어를 부정 (−).'
      - 'clients are ensured that ~ : ''의뢰인은 ~을 보장받는다''(수동태).'
      - 'until they receive a settlement : ''합의금을 받을 때까지'' — 비용이 없는 기간을 한정.'
  - kind: short
    sentence: In his early studies on musical performance, Carl Seashore discovered that musicians only rarely play two equal notes in exactly the same way.
    source: 2022 고3 9월 24번
    prompt: only rarely에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 음악 연주에 관한 초기 연구에서, Carl Seashore는 음악가들이 두 개의 같은 음을 정확히 같은 방식으로 연주하는 경우가 극히 드물다는 것을 발견했다.
    vocab:
    - word: performance
      meaning: 연주, 공연
    - word: rarely
      meaning: 좀처럼 ~않다, 드물게
    - word: note
      meaning: 음(音)
    solution:
      cut: 음악 연주에 관한 그의 초기 연구에서 / Carl Seashore는 발견했다 / 음악가들이 극히 드물게만 연주한다는 것을(only rarely) (−) / 두 개의 같은 음을 / 정확히 같은 방식으로.
      wrong: 음악가들이 두 개의 같은 음을 정확히 같은 방식으로 자주 연주한다는 것을 발견했다.
      wrong_why: only rarely는 '극히 드물게만'이라는 준부정 표현이다. rarely를 놓쳐 '자주'로 읽으면 빈도의 극성이 정반대로 뒤집힌다 (−).
      author_msg: 같은 음이라도 음악가는 매번 미묘하게 다르게 연주한다는 것을, 드물다는 표현으로 강조한다.
      key_points:
      - 'only rarely : ''극히 드물게만'' — rarely(준부정)를 only가 더욱 강조 (−).'
      - 'discovered that ~ : discover의 목적어절을 이끄는 접속사 that.'
      - 'in exactly the same way : ''정확히 같은 방식으로'' — play를 수식하는 부사구.'
  - kind: short
    sentence: We can see the world only as it appears to us, not as it truly is, because there is no as it truly is without a perspective to give it form.
    source: 2022 고3 6월 21번
    prompt: no에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 우리는 세계를 그것이 진정으로 존재하는 대로가 아니라 오직 우리에게 보이는 대로만 볼 수 있는데, 왜냐하면 그것에 형태를 부여하는 관점 없이는 '진정으로 존재하는 대로'라는 것이 없기 때문이다.
    vocab:
    - word: appear to
      meaning: ~에게 보이다, 나타나다
    - word: perspective
      meaning: 관점
    - word: give A form
      meaning: A에 형태를 부여하다
    solution:
      cut: 우리는 세계를 볼 수 있다 / 오직 그것이 우리에게 보이는 대로만 / 그것이 진정으로 존재하는 대로가 아니라(not) / 왜냐하면 ~라는 것이 없기 때문이다(there is no) (−) / '진정으로 존재하는 대로'가 / 그것에 형태를 부여하는 관점 없이는.
      wrong: 그것에 형태를 부여하는 관점 없이도 '진정으로 존재하는 대로'가 있기 때문이다.
      wrong_why: there is no ... without ~은 '~ 없이는 ...가 없다'는 이중의 부정 구조다. no를 놓쳐 '~가 있다'로 읽으면 극성이 정반대로 뒤집힌다 (−).
      author_msg: 관점이 있어야 비로소 세계가 형태를 얻으므로, 관점 없는 '있는 그대로'는 존재하지 않는다는 뜻이다.
      key_points:
      - 'there is no as it truly is : ''진정으로 존재하는 대로가 없다'' — 존재의 부정 (−).'
      - 'only ~, not ~ : ''오직 ~만, ~가 아니라'' — 두 방식의 대조.'
      - 'without a perspective to give it form : ''형태를 부여하는 관점 없이는'' — 조건을 나타내는 부사구.'
