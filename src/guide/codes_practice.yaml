        author_msg: "사람은 집단에서 완전히 독립하려 하기보다, 어느 정도는 집단에 기대는 게 보통이다."
        key_points:
          - "seldom : 빈도 부정(좀처럼 ~않다) — 문장 전체 극성을 뒤집는다."
          - "as a practical matter : 삽입 부사구(실질적으로) — 뼈대에서 빼고 읽는다."
          - "complete autonomy from the group : 'from ~'은 autonomy를 꾸미는 전치사구."
