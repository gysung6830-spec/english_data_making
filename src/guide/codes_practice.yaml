practice:
  causation:
  - kind: mc
    sentence: When our worries exceed our control, however, they cause us unnecessary suffering.
    source: 2025 고3 6월 20번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “불필요한 고통이 우리의 걱정을 통제 밖으로 밀어낸다.”'
    options:
    - ‘When our worries exceed our control’을 ‘걱정이 통제를 넘어서면’으로 옮긴 부분
    - however를 ‘그러나’로 이어 문맥을 잡은 부분
    - ‘they cause us unnecessary suffering’을 ‘고통이 걱정을 밀어낸다’로 읽은 부분
    answer_index: 2
    vocab:
    - word: exceed
      meaning: 넘어서다, 초과하다
    - word: suffering
      meaning: 고통
    - word: unnecessary
      meaning: 불필요한
    solution:
      cut: 우리의 걱정이 / 우리의 통제를 넘어설 때 / 그러나 / 그것들(걱정)이 / 우리에게 / 불필요한 고통을 일으킨다
      wrong: 불필요한 고통이 걱정을 통제 밖으로 밀어낸다.
      wrong_why: cause의 주어(they = worries)와 목적어(suffering)를 뒤바꿔, 원인과 결과가 정반대가 되었다.
      author_msg: 걱정이 감당할 수준을 넘으면, 그 걱정 자체가 쓸데없는 괴로움을 만들어 낸다.
      key_points:
      - '''they cause us unnecessary suffering'' : they(원인=our worries)와 suffering(결과)을 뒤바꿔 ''고통이 걱정을 밀어낸다''로 읽기 쉽다 → cause A B는 A(they)가 B(고통)를 일으킴.'
      cut_en: When our worries / exceed our control, / however, / they cause us / unnecessary suffering.
      cloze:
        en: When our worries exceed our control / however / they cause us unnecessary suffering
        ko:
        - t: 우리의 걱정이 우리의 통제를 넘어설 때
          v: 통제
        - t: 그러나
        - t: 그것들(걱정)이 우리에게 불필요한 고통을 일으킨다
          trap: true
      intent:
        kind: arrow
        signal: cause
        a: 걱정이 통제를 넘어섬
        b: 불필요한 고통
        a_label: 원인
        b_label: 결과
  - kind: mc
    sentence: In the south there was London, already the largest city in the world, showing all the crime, evil, and misery that result from overpopulation and unplanned growth.
    source: 2024 고3 9월 29번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “인구 과잉과 무계획적 성장을 초래하는 모든 범죄·악·비참함”'
    options:
    - ‘that result from ~’을 ‘~을 초래하는’으로 읽은 부분
    - ‘the largest city in the world’를 ‘세계에서 가장 큰 도시’로 옮긴 부분
    - ‘crime, evil, and misery’를 ‘범죄·악·비참함’으로 옮긴 부분
    answer_index: 0
    vocab:
    - word: misery
      meaning: 비참함
    - word: result from
      meaning: ~에서 비롯되다
    - word: overpopulation
      meaning: 인구 과잉
    solution:
      cut: 남쪽에는 / 런던이 있었다 / (이미 세계 최대 도시인) / [모든 범죄·악·비참함을] 보여주며 / [인구 과잉과 무계획적 성장에서 비롯되는]
      wrong: 인구 과잉과 무계획적 성장을 '초래하는' 범죄·악·비참함.
      wrong_why: result from은 'A from B = A가 B에서 비롯되다'(B가 원인). 방향을 뒤집어 결과를 원인으로 읽었다.
      author_msg: 런던의 온갖 범죄·악·비참함은 '인구 과잉과 무계획적 성장'이라는 원인에서 나온 결과다.
      key_points:
      - '''that result from ~'' : ''초래하는''으로 방향을 뒤집어 범죄·악·비참을 원인으로 읽기 쉽다 → A result from B는 A(범죄·악·비참)가 B(인구 과잉·성장)에서 비롯됨, B가 원인.'
      cut_en: In the south / there was London, / already the largest city in the world, / showing [all the crime, evil, and misery] / [that result from overpopulation and unplanned growth].
  - kind: mc
    sentence: The strategy is to analyze all the possible scenarios that the future holds and then to see what proportion of them lead to success or failure.
    source: 2023 고3 11월 20번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “얼마나 많은 성공·실패가 그 시나리오들로 이어지는지”'
    options:
    - ‘analyze all the possible scenarios’를 ‘모든 가능한 시나리오를 분석하다’로 옮긴 부분
    - ‘what proportion of them lead to ~’를 ‘성공·실패가 시나리오로 이어진다’로 읽은 부분
    - ‘that the future holds’를 ‘미래가 품고 있는’으로 옮긴 부분
    answer_index: 1
    vocab:
    - word: scenario
      meaning: 시나리오, 상황
    - word: proportion
      meaning: 비율, 부분
    - word: lead to
      meaning: ~로 이어지다
    solution:
      cut: 그 전략은 / 분석하는 것이다 / [미래가 품은 모든 가능한 시나리오를] / 그런 다음 / 보는 것이다 / [그중 얼마만큼이 / 성공 또는 실패로 이어지는지]
      wrong: 얼마나 많은 성공·실패가 그 시나리오들로 이어지는지.
      wrong_why: lead to는 'A lead to B = A가 B로 이어지다'(A가 원인). 주어(proportion=시나리오)와 결과(success/failure)를 뒤바꿨다.
      author_msg: 미래 시나리오들을 다 따진 뒤, 그중 몇 %가 성공으로/실패로 귀결되는지 확인하는 게 전략이다.
      key_points:
      - '''what proportion of them lead to ~'' : 주어(시나리오 비율)와 결과(성공·실패)를 뒤바꿔 ''성공·실패가 시나리오로 이어진다''로 읽기 쉽다 → lead to의 주어는 proportion(시나리오), 그것이 성공/실패로 이어짐.'
      cut_en: The strategy is / to analyze / [all the possible scenarios that the future holds] / and then / to see / [what proportion of them / lead to success or failure].
  - kind: mc
    sentence: Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors.
    source: 2026 고3 11월 31번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “농산물 시장이 불안정하기 때문에 수확량이 변하고 날씨가 변덕스러워진다.”'
    options:
    - ‘naturally unstable’을 ‘본래 불안정하다’로 옮긴 부분
    - ‘variable weather patterns’를 ‘변덕스러운 날씨’로 옮긴 부분
    - ‘due to ... that result from ...’을 ‘시장이 불안정해서 날씨가 변한다’로 읽은 부분
    answer_index: 2
    vocab:
    - word: unstable
      meaning: 불안정한
    - word: harvest
      meaning: 수확(량)
    - word: variable
      meaning: 변덕스러운, 가변적인
    solution:
      cut: 농산물 시장은 / 본래 불안정하다 / ~때문에 / [수확량의 변화] / [변덕스러운 날씨와 기타 요인에서 비롯되는]
      wrong: 시장이 불안정해서 수확량과 날씨가 변한다.
      wrong_why: due to와 result from 둘 다 역방향(결과 ← 원인). 원인(날씨 → 수확량 변화)과 결과(시장 불안정)를 통째로 뒤집었다.
      author_msg: 시장 불안정 ← 수확량 변화 ← 날씨 변동. 원인이 뒤에서 앞으로 거슬러 올라가는 이중 인과다.
      key_points:
      - '''due to changes ... that result from ...'' : due to와 result from이 겹쳐 원인·결과를 통째로 뒤집기 쉽다 → 날씨(원인) → 수확량 변화 → 시장 불안정(결과), 화살표는 결과←원인이지만 읽기는 앞으로만.'
      cut_en: Agricultural markets are / naturally unstable, / due to / [changes in harvest size] / [that result from variable weather patterns and other factors].
  - kind: mc
    sentence: Social media users may unknowingly participate in creating and circulating misinformation, which can influence elections, cause violence, and create widespread panic.
    source: 2024 고3 9월 20번
    prompt: '아래 오역은 딱 한 군데를 잘못 읽었다. 어디인가?  ▷ 오역: “선거·폭력·공황이 소셜미디어 이용자들에게 잘못된 정보를 만들게 한다.”'
    options:
    - ‘which can ... cause violence ...’를 ‘선거·폭력·공황이 정보를 만들게 한다’로 읽은 부분
    - ‘unknowingly participate’를 ‘자신도 모르게 가담하다’로 옮긴 부분
    - ‘creating and circulating misinformation’을 ‘잘못된 정보를 만들고 퍼뜨리는 것’으로 옮긴 부분
    answer_index: 0
    vocab:
    - word: circulate
      meaning: 퍼뜨리다, 유통시키다
    - word: misinformation
      meaning: 잘못된 정보
    - word: widespread
      meaning: 광범위한
    solution:
      cut: 소셜미디어 이용자들은 / 자신도 모르게 / [잘못된 정보를 만들고 퍼뜨리는 데] 가담할 수 있다 / 그리고 그것은 / 선거에 영향을 주고 / 폭력을 일으키며 / 광범위한 공황을 만든다
      wrong: 선거·폭력·공황이 이용자들에게 정보를 만들게 한다.
      wrong_why: cause/influence/create의 주어는 which(= misinformation)다. 원인(잘못된 정보)과 결과(선거·폭력·공황)를 뒤바꿨다.
      author_msg: 이용자가 무심코 퍼뜨린 잘못된 정보가 선거·폭력·공황이라는 실제 피해로 이어진다.
      key_points:
      - '''which can ... cause violence ...'' : 뒤의 선거·폭력·공황을 주어로 착각해 인과를 뒤집기 쉽다 → 주어는 which(=misinformation), 그것이 선거·폭력·공황을 일으킴.'
      cut_en: Social media users / may unknowingly / participate in [creating and circulating misinformation], / which can / influence elections, / cause violence, / and create widespread panic.
  - kind: short
    sentence: Whether it be due to the growing presence of AI assistants or the emergence of self-driving cars, the necessity of the role of humans as the decision makers would appear to be in decline.
    source: 2024 고3 6월 20번
    prompt: be due to에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 그것이 AI 비서의 증가 때문이든 자율주행차의 등장 때문이든, 의사결정자로서 인간 역할의 필요성은 줄어드는 것처럼 보인다.
    vocab:
    - word: presence
      meaning: 존재, (수의) 증가
    - word: emergence
      meaning: 등장, 출현
    - word: in decline
      meaning: 줄어드는, 쇠퇴하는
    solution:
      cut: 그것이 ~때문이든 / [AI 비서의 증가] 또는 [자율주행차의 등장] / 의사결정자로서 인간 역할의 필요성은 / 줄어드는 듯 보인다
      wrong: AI 비서와 자율주행차가 인간의 역할 때문에 늘어난다.
      wrong_why: be due to는 역방향('~때문이다'). 원인(AI·자율주행차)과 결과(인간 역할 감소)를 뒤집으면 안 된다.
      author_msg: 원인이 무엇이든(AI든 자율주행차든), 결과적으로 인간이 결정을 내릴 필요는 줄고 있다.
      key_points:
      - '''be due to A'' : ''A 때문이다''를 뒤집어 A를 결과로 읽기 쉽다 → 원인은 A(AI·자율주행차), 결과는 인간 역할의 감소.'
      - '''the necessity of the role of humans'' : 전치사구가 겹쳐 in decline의 주어를 humans로 잘못 잡기 쉽다 → 줄어드는 것은 ''필요성(necessity)''.'
      cut_en: Whether it be due to / [the growing presence of AI assistants] or [the emergence of self-driving cars], / the necessity of the role of humans as the decision makers / would appear to be in decline.
  - kind: short
    sentence: Living your values only some of the time does not contribute to the creation and maintenance of culture.
    source: 2024 고3 11월 20번
    prompt: contribute to와 부정어에 유의하여 해석하시오.
    answer: 가치를 오직 일부 시간에만 실천하는 것은 문화의 창조와 유지에 기여하지 않는다.
    vocab:
    - word: contribute to
      meaning: ~에 기여하다
    - word: maintenance
      meaning: 유지
    - word: values
      meaning: 가치(관)
    solution:
      cut: '[당신의 가치를 / 오직 일부 시간에만 실천하는 것은] / 기여하지 않는다 / [문화의 창조와 유지에]'
      wrong: 가치를 가끔 실천해도 문화를 만들고 유지하는 데 도움이 된다.
      wrong_why: does not을 놓치면 극성이 뒤집힌다. contribute to(기여하다)는 정방향이지만 앞의 부정이 핵심.
      author_msg: 가치를 어쩌다 한 번씩 실천하는 정도로는 문화가 만들어지지도 유지되지도 않는다.
      key_points:
      - '''does not contribute to ~'' : does not을 놓쳐 ''기여한다''는 긍정으로 극성을 뒤집기 쉽다 → 핵심은 부정, ''기여하지 않는다''.'
      cut_en: '[Living your values / only some of the time] / does not contribute to / [the creation and maintenance of culture].'
  - kind: short
    sentence: Excessive specificity may result in information from outside the domain being underestimated and unavailable, which leads to fixedness of thinking, whereas excessive generality causes chaos, vagueness, and shallowness.
    source: 2023 고3 6월 20번
    prompt: result in / lead to / cause의 방향에 유의하여 해석하시오.
    answer: 지나친 구체성은 영역 밖 정보가 과소평가되고 이용 불가능해지는 결과를 낳을 수 있고, 이것은 사고의 경직으로 이어지는 반면, 지나친 일반성은 혼란·모호함·피상성을 초래한다.
    vocab:
    - word: excessive
      meaning: 지나친
    - word: specificity
      meaning: 구체성
    - word: fixedness
      meaning: 경직, 고착
    solution:
      cut: 지나친 구체성은 / 초래할 수 있다 / [영역 밖 정보가 / 과소평가되고 이용 불가능해지는 것을] / 이것은 이어진다 / 사고의 경직으로 / 반면 / 지나친 일반성은 / 초래한다 / 혼란·모호·피상을
      wrong: 과소평가된 정보가 지나친 구체성을 초래한다.
      wrong_why: 'result in은 정방향(A result in B: A가 B를 낳다). 원인(구체성)과 결과(정보 과소평가)를 뒤집으면 안 된다.'
      author_msg: 너무 구체적이면 바깥 정보를 놓쳐 사고가 굳고, 너무 두루뭉술하면 혼란해진다 — 양극단 모두 문제.
      key_points:
      - '''result in ~ being underestimated'' : result in을 result from처럼 방향을 뒤집어 정보를 원인으로 읽기 쉽다 → A result in B는 A(구체성)가 B(정보 과소평가)를 낳음.'
      cut_en: Excessive specificity / may result in / [information from outside the domain / being underestimated and unavailable], / which leads to / fixedness of thinking, / whereas / excessive generality / causes / chaos, vagueness, and shallowness.
  - kind: short
    sentence: Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment experiences.
    source: 2026 고3 11월 24번
    prompt: lead to에 유의하여 해석하시오.
    answer: 변화하는 정치·사회·종교 지형은 새로운 문화의 등장으로, 그와 함께 새로운 문화체험의 등장으로 이어질 것이다.
    vocab:
    - word: landscape
      meaning: 지형, 양상
    - word: religious
      meaning: 종교의
    - word: emergence
      meaning: 등장
    solution:
      cut: 변화하는 / 정치·사회·종교 지형은 / 이어질 것이다 / [새로운 문화의 등장으로] / 그리고 그것들과 함께 / [새로운 문화체험으로]
      wrong: 새로운 문화가 정치·사회·종교 지형의 변화를 이끈다.
      wrong_why: lead to는 정방향(A lead to B). 주어(landscapes)와 결과(new cultures)를 뒤바꾸면 인과가 뒤집힌다.
      author_msg: 정치·사회·종교의 변화가 원인이 되어 새 문화, 나아가 새 문화체험이 생겨난다.
      key_points:
      - '''landscapes will lead to the emergence ...'' : 주어(지형 변화)와 결과(새 문화)를 뒤바꿔 ''문화가 지형을 이끈다''로 읽기 쉽다 → lead to의 주어는 landscapes(원인).'
      cut_en: Changing / political, social and religious landscapes / will lead to / [the emergence of new cultures], / and with them / [new culturtainment experiences].
  - kind: short
    sentence: Departure from the group may signal danger to nonvigilant animals and cause what appears to be a coordinated flushing of prey from the area.
    source: 2022 고3 6월 39번
    prompt: cause에 유의하여 해석하시오.
    answer: 무리에서 벗어나는 것은 경계하지 않는 동물들에게 위험 신호를 보내고, 그 지역에서 먹잇감이 조직적으로 몰려 달아나는 것처럼 보이는 사태를 일으킬 수 있다.
    vocab:
    - word: departure
      meaning: 벗어남, 출발
    - word: nonvigilant
      meaning: 경계하지 않는
