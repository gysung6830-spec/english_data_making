  - kind: short
    sentence: We can see the world only as it appears to us, not as it truly is, because there is no as it truly is without a perspective to give it form.
    source: 2022 고3 6월 21번
    prompt: no에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 우리는 세계를 그것이 진정으로 존재하는 대로가 아니라 오직 우리에게 보이는 대로만 볼 수 있는데, 왜냐하면 그것에 형태를 부여하는 관점 없이는 '진정으로 존재하는 대로'라는 것이 없기 때문이다.
    vocab:
    - word: appear to
      meaning: ~에게 보이다, 나타나다
    - word: perspective
      meaning: 관점
    - word: give A form
      meaning: A에 형태를 부여하다
    solution:
      cut: 우리는 세계를 볼 수 있다 / 오직 그것이 우리에게 보이는 대로만 / 그것이 진정으로 존재하는 대로가 아니라 / 왜냐하면 ~라는 것이 없기 때문이다 / '진정으로 존재하는 대로'가 / 그것에 형태를 부여하는 관점 없이는
      wrong: 그것에 형태를 부여하는 관점 없이도 '진정으로 존재하는 대로'가 있기 때문이다.
      wrong_why: there is no ... without ~은 '~ 없이는 ...가 없다'는 이중의 부정 구조다. no를 놓쳐 '~가 있다'로 읽으면 극성이 정반대로 뒤집힌다 (−).
      author_msg: 관점이 있어야 비로소 세계가 형태를 얻으므로, 관점 없는 '있는 그대로'는 존재하지 않는다는 뜻이다.
      key_points:
      - '''there is no ... without a perspective'' : no ... without의 이중 부정을 놓쳐 ''관점 없이도 있다''로 뒤집기 쉽다 → ''형태를 주는 관점 없이는 있는 그대로가 없다''.'
      cut_en: We can see the world / only as it appears to us, / not as it truly is, / because there is no as it truly is / without a perspective to give it form.
