      meaning: 좀처럼 ~않다, 드물게
    - word: note
      meaning: 음(音)
    solution:
      cut: 음악 연주에 관한 그의 초기 연구에서 / Carl Seashore는 발견했다 / 음악가들이 극히 드물게만 연주한다는 것을(only
        rarely) (−) / 두 개의 같은 음을 / 정확히 같은 방식으로.
      wrong: 음악가들이 두 개의 같은 음을 정확히 같은 방식으로 자주 연주한다는 것을 발견했다.
      wrong_why: only rarely는 '극히 드물게만'이라는 준부정 표현이다. rarely를 놓쳐 '자주'로 읽으면 빈도의 극성이
        정반대로 뒤집힌다 (−).
      author_msg: 같은 음이라도 음악가는 매번 미묘하게 다르게 연주한다는 것을, 드물다는 표현으로 강조한다.
      key_points:
      - '''only rarely play ...'' : rarely를 놓쳐 ''자주''로 빈도를 뒤집기 쉽다 → only rarely는 ''극히
        드물게만''(준부정).'
  - kind: short
    sentence: We can see the world only as it appears to us, not as it truly is, because
      there is no as it truly is without a perspective to give it form.
    source: 2022 고3 6월 21번
    prompt: no에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 우리는 세계를 그것이 진정으로 존재하는 대로가 아니라 오직 우리에게 보이는 대로만 볼 수 있는데, 왜냐하면 그것에 형태를 부여하는
      관점 없이는 '진정으로 존재하는 대로'라는 것이 없기 때문이다.
    vocab:
    - word: appear to
      meaning: ~에게 보이다, 나타나다
    - word: perspective
      meaning: 관점
    - word: give A form
      meaning: A에 형태를 부여하다
    solution:
      cut: 우리는 세계를 볼 수 있다 / 오직 그것이 우리에게 보이는 대로만 / 그것이 진정으로 존재하는 대로가 아니라(not) / 왜냐하면
        ~라는 것이 없기 때문이다(there is no) (−) / '진정으로 존재하는 대로'가 / 그것에 형태를 부여하는 관점 없이는.
      wrong: 그것에 형태를 부여하는 관점 없이도 '진정으로 존재하는 대로'가 있기 때문이다.
      wrong_why: there is no ... without ~은 '~ 없이는 ...가 없다'는 이중의 부정 구조다. no를 놓쳐 '~가
        있다'로 읽으면 극성이 정반대로 뒤집힌다 (−).
      author_msg: 관점이 있어야 비로소 세계가 형태를 얻으므로, 관점 없는 '있는 그대로'는 존재하지 않는다는 뜻이다.
      key_points:
      - '''there is no ... without a perspective'' : no ... without의 이중 부정을 놓쳐 ''관점
        없이도 있다''로 뒤집기 쉽다 → ''형태를 주는 관점 없이는 있는 그대로가 없다''.'
  - kind: short
    sentence: However, in the virtual world, we have a tendency to be less defensive,
      as there appears to be no physical threat to our well-being.
    source: 2023 고3 6월 22번
    prompt: less에 유의하여 밑줄 친 문장을 우리말로 해석하시오.
    answer: 그러나 가상 세계에서 우리는 덜 방어적인 경향이 있는데, 왜냐하면 우리의 안녕에 대한 물리적 위협이 없어 보이기 때문이다.
    vocab:
    - word: tendency
      meaning: 경향
    - word: defensive
      meaning: 방어적인
    - word: well-being
      meaning: 안녕, 행복
    solution:
      cut: 그러나 가상 세계에서 / 우리는 경향이 있다 / 덜 방어적인(less defensive) (−) / 왜냐하면 없어 보이기 때문이다(there
        appears to be no) (−) / 우리의 안녕에 대한 물리적 위협이.
      wrong: 가상 세계에서 우리는 더 방어적인 경향이 있는데, 안녕에 대한 물리적 위협이 있어 보이기 때문이다.
      wrong_why: less defensive는 '덜 방어적'이고 no physical threat은 '물리적 위협이 없다'는 부정이다.
        less와 no를 놓치면 '더 방어적', '위협이 있다'로 두 곳의 극성이 모두 뒤집힌다 (−).
      author_msg: 가상 세계에는 실제 위협이 없어 보이므로 사람들이 경계를 덜 하게 된다는 흐름이다.
      key_points:
      - '''less defensive ... no physical threat'' : less와 no를 놓쳐 ''더 방어적'', ''위협이
        있다''로 두 곳의 극성을 뒤집기 쉽다 → ''덜 방어적'', ''물리적 위협이 없어 보임''.'
  - kind: short
    sentence: Moreover farmers can rarely acquire payoff information on more than
      a few of the production methods they might use.
