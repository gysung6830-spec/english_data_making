      meaning: 얻다, 획득하다
    - word: payoff
      meaning: 이득, 성과
    - word: production method
      meaning: 생산 방법
    solution:
      cut: 게다가 농부들은 / 좀처럼 얻을 수 없다(rarely) (−) / 이득 정보를 / 몇 가지가 넘는 것에 대한 / 생산 방법 중
        / 그들이 사용할 수도 있는.
      wrong: 농부들은 자신이 사용할 수도 있는 생산 방법에 대한 이득 정보를 자주 얻을 수 있다.
      wrong_why: rarely는 '좀처럼 ~않다'는 준부정 부사다. rarely를 놓쳐 '자주 얻을 수 있다'로 읽으면 극성이 정반대로
