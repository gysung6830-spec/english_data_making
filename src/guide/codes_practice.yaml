    - word: fraudster
      meaning: 사기꾼
    solution:
      cut: 비밀번호·이중 키 인증·생체 인식(지문·홍채·음성 인식 '같은')은 / 모두 방법이다 / 계정 정보를 사기꾼에게서 숨기는 / 즉 데이터를 감춰 두는
