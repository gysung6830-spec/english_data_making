# ============================================================
#  0부 — 3단계 읽기 엔진 (모든 문장에 쓰는 공통 도구)
#  철학: "수능 문장 안에는, 네가 이미 아는 중3 문장이 숨어 있다."
#  고정 콘텐츠. 예문/설명을 여기서 바로 고칠 수 있습니다(코딩 불필요).
# ============================================================

title: "3단계 읽기 엔진"
spine: "수능 문장 안에는, 네가 이미 아는 중3 문장이 숨어 있다."
intro: >-
  수능 문장이 어려운 건 내용이 어려워서가 아니다. 수식어(살)가 뼈대를 덮고 있어서다.
  살을 괄호로 떼어내면 남는 건 '주어 + 동사' — 바로 중3 문장이다.
  아래 3단계를 모든 문장에 똑같이 적용한다.

methods:
  - step: "STEP 1"
    title: "괄호치기 — 수식어는 통째로 건너뛴다"
    idea: "명사 뒤에 붙어 명사를 꾸미는 덩어리는 다 ( )로 묶어 눈에서 지운다."
    rule: "괄호 대상 = 관계사절(who/which/that…) · 분사(V-ing/V-ed 덩어리) · 전치사구(of/in/with…) · to부정사 · 삽입(— , —)"
    ms_point: "긴 문장이 갑자기 짧아진다 — '살'을 지웠을 뿐인데."
    demo:
      sentence: "The students who joined the science club last year won the national award."
      bracketed: "The students (who joined the science club last year) won the national award."
      skeleton_en: "The students won the award."
      skeleton_ko: "그 학생들이 상을 받았다."
      full_ko: "작년에 과학 동아리에 가입한 그 학생들이 전국 대회 상을 받았다."

  - step: "STEP 2"
    title: "뼈대 찾기 — '누가 → 무엇을 한다'부터 읽는다"
    idea: "괄호를 건너뛰고 남은 뼈대에서 '주체(누가)'에 동그라미, '행위(무엇을 한다=진짜 동사)'에 세모. 무조건 '주체 → 행위' 순서로 먼저 읽는다."
    rule: "진짜 동사는 문장에 하나. to-V·V-ing·p.p.는 동사처럼 생겨도 '가짜(준동사)'다. 세모(진짜 동사)를 먼저 찾고, 그 앞에서 동그라미(주체)를 찾아라."
    ms_point: "'누가 → 무엇을 한다' 한 줄만 잡으면 나머지는 다 그 뼈대에 붙는 살이다."
    demo:
      sentence: "The report published by the committee last month suggests a completely new approach."
      bracketed: "The report (published by the committee last month) suggests a completely new approach."
      skeleton_en: "The report suggests a new approach."
      skeleton_ko: "그 보고서는 새로운 접근을 제안한다."
      full_ko: "지난달 위원회가 발표한 그 보고서는 완전히 새로운 접근법을 제안한다."

  - step: "STEP 3"
    title: "살 붙이기 — 연결어로 자연스럽게 합친다"
    idea: "괄호 속 수식어를 '~하는 / ~하면서 / ~해서 / ~한 채로 / ~라면' 중 문맥에 맞게 뼈대에 붙인다."
    rule: "뒤에서 앞으로 붙이기(후치수식). 한 번에 하나씩, 짧은 문장 여러 개로 나눠 이해한다."
    ms_point: "아무리 길어도 '뼈대 + 살 몇 개'일 뿐 — 조립만 하면 된다."
    demo:
      sentence: "Feeling nervous about the result, she slowly walked onto the stage."
      bracketed: "(Feeling nervous about the result), she slowly walked onto the stage."
      skeleton_en: "She walked onto the stage."
      skeleton_ko: "그녀는 무대 위로 걸어 나갔다."
      full_ko: "결과가 걱정되어(~해서), 그녀는 천천히 무대 위로 걸어 나갔다."

  - step: "보너스 A"
    title: "패러프레이징 — 같은 뜻, 다른 말로 바꾸기"
    idea: "평가원은 지문의 표현을 '다른 말로 바꾼' 선지를 정답으로 쓴다. 문장을 읽고 '내가 다른 영어로 바꿔 말하면?'을 연습하면 정답 선지가 보인다."
    rule: "① 동의어 치환(rise↔increase) · ② 구조 바꾸기(능동↔수동, 명사화↔동사화) · ③ 부정·비교를 반대로 뒤집어 같은 뜻 만들기(A>B ↔ B<A) · ④ 핵심 명제는 반드시 유지"
    ms_point: "'이런 내용'(구체화)도 결국 패러프레이즈다 — 단, 그 문장 안 정보만 써서 바꿔야 한다(지문 전체를 끌어오면 안 됨)."
    demo:
      sentence: "Rising incomes inevitably lead to increases in motorization."
      bracketed: "Rising incomes inevitably lead to increases in motorization."
      skeleton_en: "Rising incomes → more motorization"
      skeleton_ko: "소득 증가 → 자동차화 증가 (원인 → 결과)"
      full_ko: "패러프레이즈 예: As people earn more, car ownership and use are bound to increase. (동의어·구조를 바꿨지만 '소득↑ → 차↑'라는 핵심 명제는 그대로.)"

  - step: "보너스 B"
    title: "모르는 단어는 '유추'로 뚫는다"
    idea: "단어 뜻을 다 몰라도 된다. 문장의 신호로 '대략의 뜻·극성(좋다/나쁘다)'만 잡으면 해석은 굴러간다."
    rule: "① 긍정/부정 신호로 극성 잡기 · ② 대조(but·unlike) → 반대 뜻 · ③ 재진술(즉·that is)·예시(such as) → 옆에 쉬운 말 · ④ 병렬(A and B) → 같은 부류 · ⑤ 접두사·어근(dis-·un-·-less=부정, re-=다시)"
    ms_point: "모르는 단어 1~2개는 '?'로 두고 넘어가도, 신호만 잡으면 문장 뜻은 안 무너진다."
    demo:
      sentence: "Consumer engagement levels in all manner of digital experiences and communities have simply exploded—and they show little or no signs of slowing."
      bracketed: "Consumer engagement levels (in all manner of digital experiences and communities) have simply exploded (—and they show little or no signs of slowing)."
      skeleton_en: "levels have exploded (and show no signs of slowing)"
      skeleton_ko: "참여도가 폭발적으로 늘었다 (그리고 느려질 기미가 없다)."
      full_ko: "'exploded(폭발했다)'의 정확한 뜻을 몰라도, 뒤의 'little or no signs of slowing(느려질 기미가 거의 없다)'이 부정 신호 → '계속 급증하고 있다'는 뜻임을 유추할 수 있다."

tools:
  - "ⓐ 진짜 동사는 하나 — to-V · V-ing · p.p. 는 가짜 동사(준동사)다. 진짜 동사를 먼저 찾아라."
  - "ⓑ 긴 주어·가주어 It ~ that/to — 가주어 It 은 버리고 뒤 덩어리를 진짜 주어로 앞에 놓는다."
  - "ⓒ who · which · that · 접속사 = '여기서 새 문장(살) 시작' 신호다. 거기서 끊어라."
