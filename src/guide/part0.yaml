# ============================================================
#  0부 — 읽기 엔진 (모든 문장·모든 문제에 쓰는 공통 도구)
#  원칙: 간결하게. 학생이 한 번 읽고 이해할 분량만.
#  고정 콘텐츠. 예문/설명을 여기서 바로 고칠 수 있습니다(코딩 불필요).
# ============================================================

title: "읽기 엔진 — 뼈대 → 관계 → 깊이 조절"
spine: "수능 문장 안에는, 네가 이미 아는 중3 문장이 숨어 있다."
intro: >-
  수식어(살)가 뼈대를 덮어서 어려울 뿐이다. 뼈대부터 잡고 → 살을 붙여 → 앞으로만 읽는다.
  그리고 문제 유형에 맞게 '읽는 깊이'만 조절하면 된다.

methods:
  - step: "STEP 1"
    title: "괄호치기 — 수식어는 잠깐 미뤄둔다"
    idea: "명사 뒤에서 꾸미는 덩어리는 ( )로 묶어 미뤄두고, 주어+동사(뼈대)부터 본다. '버리는' 게 아니라 순서를 뒤로."
    rule: "괄호 대상 = 관계사절 · 분사(V-ing/V-ed) · 전치사구 · to부정사 · 콤마·대시 삽입."
    ms_point: "긴 문장이 짧아진다. 단, 살 속에 답 근거가 있으니 STEP 3에서 다시 읽는다."
    demo:
      sentence: "The students who joined the science club last year won the national award."
      bracketed: "The students (who joined the science club last year) won the national award."
      skeleton_en: "The students won the award."
      skeleton_ko: "그 학생들이 상을 받았다."
      full_ko: "작년에 과학 동아리에 가입한 그 학생들이 전국 대회 상을 받았다."

  - step: "STEP 2"
    title: "관계로 읽기 — '누가 ↔ 무엇'"
    idea: "단어 순서대로가 아니라 '누가(주어) → 무엇을 한다(진짜 동사)'라는 관계부터 잡는다."
    rule: "진짜 동사는 문장에 하나(to-V·V-ing·p.p.는 가짜). 접속사·비교·인과 신호 = 'A와 B의 관계' 이정표."
    ms_point: "다 해석했는데 뜻이 안 잡히면, '관계'를 안 본 것이다."
    demo:
      sentence: "The scientists whose research the government funded published results that surprised everyone."
      bracketed: "The scientists (whose research the government funded) published results (that surprised everyone)."
      skeleton_en: "The scientists published results."
      skeleton_ko: "그 과학자들이 결과를 발표했다. (누가 → 무엇을)"
      full_ko: "관계로 보면 간단하다 — [정부가 그 연구에 자금을 댄] 과학자들이, [모두를 놀라게 한] 결과를 발표했다."

  - step: "STEP 3"
    title: "살 붙이기 — 앞으로만(직독직해)"
    idea: "미뤄둔 수식어를 '~하는 / ~해서'로 다시 붙여 완성. 끝에서 앞으로 되돌아가지 말고 앞으로만."
    rule: "한 덩어리씩 앞에서부터. 되돌아가 재해석하지 않는 것이 속도의 핵심."
    ms_point: "아무리 길어도 '뼈대 + 살 몇 개'. 순서대로 조립하면 끝."
    demo:
      sentence: "Feeling nervous about the result, she slowly walked onto the stage."
      bracketed: "(Feeling nervous about the result), she slowly walked onto the stage."
      skeleton_en: "She walked onto the stage."
      skeleton_ko: "그녀는 무대 위로 걸어 나갔다."
      full_ko: "결과가 걱정되어(~해서), 그녀는 천천히 무대 위로 걸어 나갔다."

  - step: "읽기 깊이"
    title: "유형별로 '어디까지' 읽나"
    idea: "모든 문장을 같은 깊이로 읽는 게 비효율. 유형이 요구하는 만큼만 판다."
    rule: "대의 → 뼈대·연결어만 빠르게 / 빈칸·함축 → 논리(재진술·대조) 정밀 / 어법·어휘 → 구조 정밀 / 순서·삽입 → 연결어·지시어(담화 표지)."
    ms_point: "빠르게 훑을 곳과 정밀히 팔 곳을 나누면, 같은 시간에 더 정확히 푼다."

  - step: "유추 tip"
    title: "모르는 단어는 '유추'로 뚫는다"
    idea: "단어 뜻을 다 몰라도 된다. 대조·재진술 단서가 뜻을 공짜로 준다."
    rule: "① 극성(긍정/부정어 주변) · ② 대조(but·unlike 뒤=반대) · ③ 재진술·예시(that is·such as=같은 뜻) · ④ 병렬(A and B=같은 부류) · ⑤ 형태(un-·-less=부정)."
    ms_point: "but=반대말, that is·such as=같은 말을 이미 준 것. 단서 하나만 잡으면 뜻은 안 무너진다."
    demo:
      sentence: "Unlike his frugal brother, who saved every coin, Tom was profligate and spent his salary within a week."
      bracketed: "Unlike his frugal brother (who saved every coin), Tom was profligate and spent his salary within a week."
      skeleton_en: "Tom was profligate (≠ frugal)."
      skeleton_ko: "Tom은 profligate했다 (≠ 절약하는)."
      full_ko: "'profligate'를 몰라도 Unlike(대조) + '형은 절약' + '일주일 만에 월급 탕진' → '헤프게 낭비하는'으로 유추. (단서 ②)"

# '읽기 깊이' 형광펜 예시(꼭 읽을 곳만 강조). 학습용 예시 지문.
depth_demos:
  - kind: "주제·요지 — 뼈대만 빠르게"
    source: "학습용 예시"
    goal: "핵심 주장 하나만 잡으면 끝. 예시는 증거일 뿐 흘려 읽는다."
    passage: >-
      ==Many people believe talent alone determines success, but research suggests that
      deliberate practice matters far more.== In one study, elite violinists were not born more
      gifted; they had simply practiced thousands more hours. Chess masters spend years studying
      past games. Even 'natural' athletes train relentlessly. ==In short, what looks like raw
      talent is usually the tip of a long, deliberate effort.==
    read: "주제문(but) + In short(재진술)만 읽어도 요지가 잡힌다 — 가운데 예시는 같은 말의 반복."
  - kind: "빈칸 추론 — 단서 정밀"
    source: "학습용 예시"
    goal: "빈칸의 답 = 주변의 재진술·대조가 이미 말해 준다. 빈칸만 노려보지 말 것."
    passage: >-
      A good map leaves out detail on purpose. ==A subway map, for example, ignores real distances,
      showing only the order of stops,== which makes it easier to use. In the same way, a useful
      model works by ( ____ ). ==By stripping away the messy details, it reveals the pattern that
      matters.==
    read: "빈칸 앞 예시 + 뒤 재진술만 읽으면 답이 보인다 — 빈칸 = '불필요한 세부를 덜어내기'."

tools:
  - "ⓐ 되돌아가지 않기 — 청크 단위로 '앞으로만'(직독직해)."
  - "ⓑ 진짜 동사는 하나 — to-V·V-ing·p.p.는 가짜. 진짜 동사부터."
  - "ⓒ 관계가 먼저 — 단어 뜻보다 'A와 B의 관계(인과·대조·재진술)'. 평가원은 논리 시험이다."
