# ============================================================
#  Render.com 배포 설정 (Blueprint)
#  render.com 에서 이 저장소를 연결하면 이 파일대로 자동 배포됩니다.
#  처음 올리실 때는 아무것도 고치지 마시고 그대로 두세요.
# ============================================================
services:
  # ---- 고객이 보는 판매 사이트 (store.py) --------------------
  - type: web
    name: ortica-store
    runtime: python
    # ⚠️ free 로 두면 다시 배포할 때마다 올려 둔 자료와 주문 장부가 사라집니다.
    #    실제로 파실 거면 starter 로 올리고 아래 disk 의 '# ' 를 지우세요. (월 $7)
    plan: free
    buildCommand: pip install -r store_requirements.txt
    startCommand: gunicorn store:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /healthz
    # ---- 다시 배포해도 안 지워지는 저장 공간 -------------------
    # plan 을 starter 이상으로 바꾼 뒤 아래 네 줄 앞의 '# ' 를 지우세요.
    # 자료 파일 · 주문 장부 · 가게 설정이 모두 여기에 쌓입니다.
    # disk:
    #   name: ortica-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # --- 꼭 넣어야 하는 값 ---------------------------------
      - key: ADMIN_PASSWORD    # 관리자 화면(/admin) 비밀번호. 안 넣으면 관리자 화면이 잠깁니다.
        sync: false
      # 위 disk 를 켜셨다면 이 값도 같이 켜 주세요 (앞의 '# ' 를 지우면 됩니다).
      # 안 켜면 자료가 서버 안쪽에 쌓여, 다시 배포할 때 사라집니다.
      # - key: STORE_DATA
      #   value: /var/data
      # --- 자동으로 만들어지는 값 (건드리지 마세요) ----------
      - key: STORE_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      # --- 넣어 두면 좋은 값 ---------------------------------
      - key: BANK_ACCOUNT      # 입금 계좌번호. 비우면 관리자 화면에서 넣은 값을 씁니다.
        sync: false
      # 주문 알림 메일 — 무료 요금제는 다시 배포하면 저장 공간이 초기화되므로,
      # 메일로도 주문을 남겨 두면 안전합니다. (설정법은 STORE.md 10번)
      - key: ORDER_EMAIL_TO    # 알림을 받을 내 메일 주소
        sync: false
      - key: SMTP_HOST         # 지메일이면 smtp.gmail.com
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER         # 보내는 계정 (내 지메일 주소)
        sync: false
      - key: SMTP_PASS         # 지메일 '앱 비밀번호' 16자리
        sync: false

# ------------------------------------------------------------
